source_request: "Skill-engine coherence check — milestone 0.12.0 sprint 5. New /check:skill-engines skill that parses every .claude/commands/**/*.md for scripts/... references and verifies the referenced engine script exists. Wire into release-build (refuse capsules where any skill doc references a missing script) AND /warp:setup postflight (catch drift after install)."
interpreted_intent: "Skills under .claude/commands/ reference engine scripts via prose (e.g. 'Run `node scripts/turbo/apply.js`'). When the engine script is missing — either because canonical never shipped it, or because a capsule mid-build dropped it — the skill is silently broken. Add a scan/validate: parse skill docs for `scripts/...` references; cross-check that each referenced path exists in canonical. Wire into release-build as a fail-loud gate AND into /warp:setup postflight to catch consumer-side drift. Same shape as the path-manifest-coverage gap that 0.8.x solved."
