schema: warpos/sprint/current-sprint/v1
id: S-VLADW1-01
title: "Engine skeleton — plain-node Agent SDK app, MCP stdio server, four-core tool surface, job state machine, journal, permission-level config port, and the API-key model-access seam"
objective: "Stand up the engine Vlad runs on: a plain-node app on the TypeScript Agent SDK exposing a four-tool MCP surface over stdio, with a job state machine, an on-disk journal, ported permission-level config, and a model-access seam that bills to the user's own API key and never lets that key leave their machine."
status: planning
created_at: "2026-07-30T00:52:06.179Z"
updated_at: "2026-07-30T02:30:23.499Z"
source_request: "Wave-1 ENGINE of epic E-VLAD-001 (epic label SP-VLAD-W1-ENGINE). Derived from the epic contract, not from a fresh operator message: the operator's verbatim brief is the completed 6-round grill recorded in _planning/vlad-agent-mcp-plan.md (rulings in-file, 2026-07-28), the differentiator memo _planning/vlad-why-us.md, and the 34-family port inventory _planning/vlad-transferability.md. This Plan Contract marshals the banked product-lead substance in runtime/vlad-w1/w1-planning-inputs.md §2 and the ToS finding in §1."
interpreted_intent: "Build the substrate every later Vlad wave stands on: a plain-node application on the TypeScript Agent SDK that speaks MCP over stdio, runs jobs through an explicit state machine backed by an on-disk journal, reads a ported per-project permission-level config, and reaches a model through the user's OWN Anthropic API key. Two of the calls in this sprint are load-bearing far beyond it. First, the model-access seam: the ratified claude-CLI subscription shell-out is ToS-barred, so API-key is primary and ONLY, which makes a fail-closed credential-custody enforcer part of the build rather than a later hardening pass. Second, the receipt: ENGINE emits a versioned envelope with an UNTYPED interior (J4) and never validates or branches on it, because typing it here would propagate a v0 shape into the journal, get_status, the MCP signatures, the driver assertions and the ledger records before the dogfood data that defines it exists."
plan_contract: ".claude/project/sprint/plan-contracts/PC-20260730-0085.yaml"
risk_level: high
approval_state: none_required
current_phase: plan
recommended_mode: no_recommendation
mode_invocation_required_by_user: true
external_services:
  identified:
    - "Anthropic API via the TypeScript Agent SDK (@anthropic-ai/claude-agent-sdk) on the user's OWN Console API key — the engine's only permitted model-access path after the ToS NO-GO on the claude-CLI subscription seam. Requires a Console account and a dev/test spend envelope before any metered run."
    - "An Anthropic Console account with billing for development and test, including the deliberately-provoked failures the quota-exhaustion detector must be characterized against."
    - "Anthropic sales, for the open questions with no published answer — the scope of 'route requests on behalf of their users' for a local-CLI topology, and the approval criteria behind the SDK page's 'unless previously approved' carve-out. A sales conversation with no published criteria, form or timeline is not a dependency this sprint can schedule around."
