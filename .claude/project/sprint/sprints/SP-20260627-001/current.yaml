title: "E-DISPATCH-SHAPE-001 ADR-0013 enforce repair + W3 review-lane policy"
objective: "Make the dispatch-contract enforce gate default to ENFORCE without false-refusing legitimate dispatches, and add the per-failure-class minimum-review-lane policy — closing E-DISPATCH-SHAPE-001's last two DoD items and unblocking E-DISPATCH-PERFECT-001 W3 (the codex-doer build shape)."
