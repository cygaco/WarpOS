title: "E-DISPATCH-SHAPE-001 W1 — make availability and fallback real"
objective: "Close the three availability/fallback gaps from the dispatch-stack audit (NOTAGAIN §7 W1) so the dispatch stack behaves correctly when providers go down — the highest-risk moment: (G2) ONE sanctioned, LEDGERED claude-fallback review lane so a claude review when cross-providers are quota-dead is RECORDED and VISIBLE to gauntlet-verify (and visibly trips cross_provider_required as honest debt, not silently satisfies coverage); (G5) a provider circuit breaker — providers.js writes a provider-down state file on quota_exhausted classification with a TTL, consulted before dispatch so a quota-dead provider is not blindly re-burned (telemetry: 6 reviewer prompts x 3 retries each into a known-dead window), fail-open on breaker-file faults; (G4/N4) auth-posture surface — parse codex auth.json auth_mode (value-free, mode label only), fix the detectAuthTier metered-as-oauth misreport, surface key(metered) vs oauth(plan) in dispatch-readiness/provider-tier rows + quota error envelopes. Each gap ships a planted-violation test; goldens before/after on touched wrappers. Engine sprint, RI-001 fast-close."
