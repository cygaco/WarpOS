updated_at: "2026-06-09T00:35:11.840Z"
source_request: "Implement the dispatch-shape north star: a live shape resolver (dispatch-shape.js) verified+tested+wired as the consulted authority; fix the §13.6 ping reap blocker so the §13.7 earn-it can stamp; finish mechanical enforcement (doc-ref auto-fire at commit, team-gate default-on). Engine sprint, ff-merge close."
interpreted_intent: "Build the LIVE dispatch-shape decision keystone: (1) scripts/dispatch/dispatch-shape.js#resolveShape(unit) applies PLAN §17's per-unit decision rule (inline/in-process-agent/subprocess-claude/subprocess-cross-provider/api) reading the dispatch-contract (agents) + skill-weight registry (skills, fail-closed on the earn-it proof) + the research criteria-matrix for ad-hoc units, and shapeMismatch() makes the WRONG shape self-detecting; wire it as the authority consulted by route-guard / the dispatch wrappers. (2) Fix the §13.6 ping non-deterministic reap (the RI-004 CLI-buffer reap, ~50%) so a subprocess skill can be honestly §13.6-pinged then §13.7-measured then stamped subprocess_verified:true (0 are today → all route inline). (3) Mechanical-enforcement close-out: doc-ref-integrity fires automatically at commit via merge-guard (not report-only-in-/scan:full); the S-12c team-gate ships default-ON."
