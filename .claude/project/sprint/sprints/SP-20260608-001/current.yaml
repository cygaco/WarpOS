title: "Dispatch-shape north star — resolver + earn-it ping-reap fix + mechanical enforcement"
objective: "Implement the dispatch-shape NORTH STAR (PLAN §16/§17): every unit of work — skill OR agent — matched to the right shape by a LIVE resolver, the wrong shape self-detecting, the chosen shape PROVEN. This is the actual point of E-SYSTEM-ORG-001, previously skipped in favor of peripheral cleanup."
