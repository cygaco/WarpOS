schema: warpos/sprint/current-sprint/v1
id: SP-20260514-001
title: "Harden WarpOS update pipeline — content-hash + sha256 un-truncation + operator-override + ownership transition"
objective: "Implement GPT-5.5 prescribed architectural fixes for the WarpOS update pipeline (recommended scope: items 1+2+3+5+6, item 4 release/apply separation deferred): centralize content-hash, un-truncate capsule sha256 with back-compat, consolidate preflight overrides into single --operator-override with audit log, stop shipping migrations as installed assets, add framework_template → project_owned ownership transition."
status: releasing
created_at: "2026-05-14T04:01:31.114Z"
updated_at: "2026-05-14T09:34:07.298Z"
source_request: "Harden the WarpOS update pipeline against the systemic Windows brittleness exposed in the 2026-05-13 multi-hour update session. Implement the architectural fixes prescribed by the GPT-5.5 review at .warpos/codex-consult-prompt.md: (1) centralize hash logic into scripts/warpos/lib/content-hash.js, (2) un-truncate capsule sha256 (full 64-char) with back-compat for 0.6.x prefixes, (3) consolidate the 4 narrow preflight overrides + --skip-preflight into a single --operator-override <gate-name> --override-reason <text> with audit logging, (4) separate the release pipeline from the apply pipeline (shared code limited to manifest schema + content-hash), (5) stop shipping migrations/ as installed assets, (6) introduce framework_template → project_owned ownership transition so consumer content in former-template paths survives framework version changes."
interpreted_intent: "User wants the architectural backlog GPT-5.5 prescribed turned into a real sprint plan. The mid-session fixes that shipped in 0.6.1 are insufficient as a permanent solution. The structural causes (untruncated hashes, gate rigidity, migrations-as-assets, framework-template ownership ambiguity, release/apply coupling) remain. This sprint addresses items 1, 2, 3, 5, 6; item 4 deferred per recommended scope."
