source_request: "Install fixture CI matrix — build a 5-scenario regression test suite for /warp:setup + /warp:update covering: (1) clean install on a fresh project, (2) /warp:update against an existing install, (3) /warp:update preserving dirty-uncommitted operator changes, (4) multi-version-upgrade across migration boundaries, (5) /warp:update preserving user-customized framework files. Wire the matrix into the existing test runner so install-pipeline changes regress automatically. Highest-leverage pick from the install reliability batch because it protects every other install-reliability item from regression — both the items already shipped (rollback snapshot, dry-run gating, settings compiler, manifest generator/validator) and the items still pending (per-file status reporting, migrations + userModified, release-build.js stale-manifest refusal, .claude/manifest.json always-present cleanup)."
interpreted_intent: "Author scripts/warpos/test-install-matrix.js: a fixture-based runner that spins up 5 ephemeral fixture projects (in .warpos/test-fixtures/install-matrix/ or os.tmpdir(), gitignored), runs the appropriate /warp:setup or /warp:update flow per scenario, asserts the expected post-state (files present/matching defaults, transaction snapshot exists, settings.json --check clean, manifest honest, operator overrides preserved, etc.), cleans up after each scenario, and emits a structured pass/fail report. Wired into the existing canonical test gauntlet (likely via npm script + addition to /check:all or framework manifest gates). Each scenario is independent and parallelizable."
