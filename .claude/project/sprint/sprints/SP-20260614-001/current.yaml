title: "Founders in-app panel — /admin/readiness view (S-PF-09a R-2)"
objective: "Ship the product-shipped founder launch-readiness panel: a founder-allowlist-gated /admin/readiness route in the app scaffold that renders the warpos/readiness/v1 report (the keystone producer) as an actionable board — each item showing owner-class, lead-time, blocker, and a prominent deep-link to its how-to guide — with cold-start + warm-start states and check/uncheck write-back to FOUNDERS_CHECKLIST.md. Brand-clean, gated, ship-covered, and design-quality-passed."
