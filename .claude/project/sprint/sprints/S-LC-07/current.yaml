schema: warpos/sprint/current-sprint/v1
id: S-LC-07
title: "Turbo hardening — spend ceiling + permission profile + push arc-line"
objective: "Harden the turbo session layer: a spend-ledger with source-vs-instance ceiling resolution ($100 framework default, runtime override from authorization.json — never hardcodes the per-session value), a permission profile pinning push-to-main to confirm (P-061 — the classifier sits above permissions.allow), a classifier-preflight, and a /scan:turbo-spend consumer. Wave 2 of E-LIFECYCLE-001. ADR-0011."
status: done
created_at: "2026-06-10T02:56:29.572Z"
updated_at: "2026-06-10T03:39:02.000Z"
source_request: "Wave 2 turbo sprint: spend ceiling (source-vs-instance) + safe commit/push/merge permission profile + classifier-preflight + spend-scan consumer. Engine/tooling sprint, ff-merge close, defer retro to epic close (RI-001)."
interpreted_intent: "Make turbo's autonomy boundary honest: the spend ceiling resolves from operator state (never hardcoded), push-to-main stays per-action (confirm-pinned; a profile that advertised auto-push would lie because the harness classifier overrides permissions.allow). Gauntlet: backend+security PASS; qa/integrity caught 2 spend-ledger spoof blockers (prototype-key model→NaN ceiling bypass + negative-byte under-report) — fixed @f4eb8d7 (Object.hasOwn guard + clampBytes + 5 regression assertions), re-reviewed qa+security PASS (α-verified)."
