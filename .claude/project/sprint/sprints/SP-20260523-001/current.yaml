updated_at: "2026-05-23T03:58:52.020Z"
source_request: "Fix the status lag bug where active-sprints.yaml and current.yaml stay at status=planning/designing/releasing even after /sprint:full Phase 5 (retrospective) completes. Caught it during SP-004 + SP-005 — had to manually patch active-sprints.yaml after each sprint finished."
interpreted_intent: "When /sprint:full runs all 5 phases to completion, both current.yaml (per-sprint state) and active-sprints.yaml#sprints[id].status (registry) should advance to 'retrospected'. Today they remain stuck at an earlier phase. Likely root cause: retrospective.js falls through with exit 3 (skeleton mode) without updating either file. Fix: in retrospective.js (or sprint/full.js Phase 5 wrapper), after retrospective completes (success OR skeleton-skip), explicitly call status updaters for current.yaml AND active-sprints.yaml. Add a test that runs /sprint:full end-to-end against a fixture and asserts both files reach 'retrospected'."
