id: SP-20260614-002
title: "admin:* skill suite — open/preview the in-app founder admin panel (SP-20260614-002)"
objective: "Ship the admin:* dev-tooling skill suite that opens/previews the in-app founder admin panel the scaffold ships (R-2 / SP-20260614-001: /admin, /admin/readiness, /admin/guides) — which currently has NO opener (unlike /cockpit:readiness + /models:router). Keystone /admin:preview is a render harness (scaffold-or-reuse a throwaway product test-instance, npm run dev, open /admin in a browser) that ALSO unblocks the deferred design-quality/visual-review Playwright lane; /admin:readiness + /admin:guides forward to sub-routes; /admin:seed seeds real data so the panel renders warm-start. Registry-backed, path-keys-in-source, cross-provider-reviewed routing, run-in-product (never WarpOS itself)."
status: designing
created_at: "2026-06-14T20:36:46.804Z"
updated_at: "2026-06-14T21:40:44.078Z"
source_request: "Build the admin:* skill suite per ROADMAP item 24 — session-invocable openers/previewers for the in-app founder admin panel the scaffold ships. Start with the /admin:preview render harness; heed the item-24 guardrails (source-not-generated path keys, cross-provider-review the routing file, single authoritative writer, dispatch invariants, rebuild maps). Run-in-product: open a PRODUCT's panel, not WarpOS."
interpreted_intent: "Close the missing-opener gap for the founder admin panel. The R-2 panel (/admin + /admin/readiness + /admin/guides) is test-proven (8/8) but cannot be OPENED/rendered from a session. Build dev-tooling skills under .claude/commands/admin/ + node helpers under scripts/admin/: (1) /admin:preview — the keystone — resolves-or-scaffolds a throwaway product test-instance (reuse the scaffold/portfolio path), ensures deps, runs `npm run dev`, opens /admin in a browser; idempotent (reuse an existing instance); single authoritative writer for the instance pointer (mode-set.js pattern). (2) /admin:readiness + /admin:guides — thin openers that DELEGATE to the preview harness with a target sub-route (no logic duplication — the /panel:* synonym pattern, item 23 seam). (3) /admin:seed — seeds a founder session + sample events + a FOUNDERS_CHECKLIST so the panel renders warm-start, not cold-start (WarpOS itself has no checklist → cold-start, verified 2026-06-14). A small admin-panel registry (route -> opener -> description) backs the openers and is forward-compatible with item 23 /panel:*; its path keys live in the SOURCE framework/paths.registry.json (build.js regenerates the .claude view); the registry/routing file is cross-provider-reviewed, never a solo alpha draft. The keystone emits the live preview URL so the deferred design-quality Playwright lane can finally target a running Next app."
