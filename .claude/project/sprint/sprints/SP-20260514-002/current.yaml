source_request: "Make the sprint routing policy (paths.sprintRouting) actually enforced — reviewers, gauntlets, diff_review, and model_class declarations must be honored at runtime, not just documented in the policy file."
interpreted_intent: "Today paths.sprintRouting declares per-phase model_class (planning, plan_contract_review, design, qa, redteam, release, retrospective, external_service_setup, …) and which phases require diff_review across two vendor rows. scripts/sprint/routing.js loads/validates the policy. But /sprint:plan, /sprint:design, /sprint:execute, /sprint:release never call routing.js, never record which model drafted an artifact, and never verify diff_review was satisfied. The skill bodies do not reference routing either. Goal: make routing observable + checkable + blocking at the artifact boundary so the policy stops being decorative."
