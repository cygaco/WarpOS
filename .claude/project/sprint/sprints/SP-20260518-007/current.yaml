updated_at: "2026-05-18T23:06:36.146Z"
source_request: "Add Sprint Goal Verification — every sprint ships a regression fixture under tests/regression/<sprint-id>/, ACs link verified_by: <test-file>::<test-name>, /sprint:release ship-gate runs cited tests, /check:ac-coverage skill audits linkage. Also wire scripts/sprint/test-plan-honors-registry-primary.js into /linters:run."
interpreted_intent: "Today's QA plans verify ACs with English checkboxes; there's no executable link between the user's original bug and a fixture that asserts the fix. Sprint A closes that gap. Every sprint must produce at least one test that would have failed before the sprint started and passes after. To enforce that, this sprint (a) adds a goal_verification block to the Plan Contract and propagates it through current-sprint, (b) defines a new regression-fixture schema and a per-sprint corpus under tests/regression/<SP-id>/, (c) introduces an AC linkage convention (verified_by: <test-file>::<test-name>), (d) makes /sprint:design refuse to advance without a fixture (or an explicit not_applicable justification for research/docs/refactor sprints), (e) makes /sprint:release ship-gate run all cited tests, (f) ships a read-only /check:ac-coverage audit skill, (g) wires the existing scripts/sprint/test-plan-honors-registry-primary.js regression test into /linters:run so the plan.js drift bug from 2026-05-18 cannot silently recur. Closed/retrospected sprints are exempt — no backfill, no retroactive enforcement."
