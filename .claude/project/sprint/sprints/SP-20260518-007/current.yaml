id: SP-20260518-007
title: "Sprint Goal Verification — regression corpus, AC linkage, ship-gate, /check:ac-coverage"
objective: "Every sprint produces at least one regression fixture that would have failed before the sprint started and passes after; the ship-gate enforces it."
status: releasing
