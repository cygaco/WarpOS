source_request: "Post-scrub gate hardening — sprint 2 of milestone 0.10.0 Framework Boundary Closure. Flip `ROOT_LEAK_PENDING_SCRUB=false` in `scripts/checks/framework-purity.js` so the root_leak detector hard-refuses any future reintroduction of product-titled paths at canonical root."
interpreted_intent: "Sprint 1 of milestone 0.10.0 (SP-20260525-001) physically removes WarpOS-as-product content from canonical. This sprint closes the door by flipping the `ROOT_LEAK_PENDING_SCRUB=true` flag to `false` in `scripts/checks/framework-purity.js`. Flag-flip is a one-line change; the higher-value work is the regression net around it: a synthetic write-attempt fixture proves the gate hard-refuses reintroduction, a fresh-install smoke-test proves no product-titled paths leak to consumers, and a test that runs the purity check on a clean canonical exits 0. After this sprint, the manifest-driven architecture (milestone 0.8.x) becomes load-bearing — the boundary stops being aspirational and starts being a write-time enforcement."
