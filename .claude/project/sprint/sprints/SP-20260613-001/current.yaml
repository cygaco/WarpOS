title: "ED-051 enforcer — missing_product_lead_authoring finding"
objective: "Make the WG-3 product-lead-authoring routing self-detecting: extend scripts/checks/sprint-manager-consult.js with a missing_product_lead_authoring finding and wire it into /scan:full, so a post-cutoff sprint that has a plan-contract or PRD but no product-lead authorship record is flagged (authored_by: alpha-solo valid only when the sprint mode was solo)."
status: closed
created_at: "2026-06-14T01:34:52.870Z"
updated_at: "2026-06-14T02:07:38.806Z"
source_request: "Build the ED-051 enforcer that completes last session's WG-3 fix — the /sprint:plan + /sprint:design skill-body routing change shipped (authoring routes to product-lead), but no detector enforces it. Add a missing_product_lead_authoring finding mirroring missing_design_consult, and wire it into /scan:full."
interpreted_intent: "Close the aspirational-vs-enforced gap on the WG-3 routing change: a sprint that produced a plan-contract or PRD after the enforcer's cutoff must carry a record that product-lead authored those requirements (or have been run in solo mode, where alpha-solo authoring is legitimate). Absence of such a record on a non-solo post-cutoff sprint is a finding. The detector lives beside missing_design_consult in sprint-manager-consult.js, reuses the same record-backed coverage machinery (RECORD_BACKED_CUTOFF, hasBackingDispatchRecord), and surfaces through /scan:full so drift is observable at the same gate as the other manager-consult findings."
