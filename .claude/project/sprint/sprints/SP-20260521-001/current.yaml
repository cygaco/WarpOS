schema: warpos/sprint/current-sprint/v1
id: SP-20260521-001
title: "DreamTeams portfolio onboarding — recommended scope (side-by-side repos with manifest)"
objective: "Stand up the WarpOS portfolio model (Variant 2: side-by-side repos with manifest), seed DreamTeams as the first listed product, ship /portfolio:list, /portfolio:sync, /portfolio:status skills, and register paths.portfolioManifest / paths.portfolioIndex — without ingesting DreamTeams source or building the workspace orchestrator (Variant 3)."
status: releasing
created_at: "2026-05-21T20:31:25.038Z"
updated_at: "2026-05-21T21:59:40.172Z"
source_request: "Make WarpOS the command console for a portfolio of products. Each product lives in its own private GitHub repo with team collaborators, side-by-side with WarpOS on disk. WarpOS exposes a single unified /portfolio:* skill family (collapses the existing /product:* into /portfolio:*) so the user has ONE namespace for everything product-related — bootstrap, clone, ponder, import, list, open, new, register, status, dispatch, sync. The user can also 'port' into any product in a separate terminal (via /portfolio:open <slug> --spawn) and run multiple products in parallel, each in its own Claude Code session, while WarpOS remains the home-base terminal."
interpreted_intent: "Two architectural decisions on top of the original portfolio-console ask: (1) UNIFY the existing /product:* (bootstrap, clone, ponder, import) and the proposed /products:* into a single /portfolio:* namespace — rename in place, ship deprecated /product:* aliases for 1-2 releases; (2) FIRST-CLASS multi-terminal parallelism — /portfolio:open <slug> --spawn opens a fresh terminal window with Claude Code running in the target product, so the user can keep WarpOS as the home base while each active product runs in its own session. Parallel sessions are inherently safe because each product has its own .claude/ (per FRAMEWORK_VS_DOWNSTREAM.md). Combined: one unified namespace, one home-base terminal, N parallel product terminals on demand."
