source_request: "Events retention policy — milestone 0.13.0 sprint 4. Compress / roll events.jsonl above threshold (~10MB); sleep:deep manual flow retires for this concern."
interpreted_intent: "paths.eventsFile (events.jsonl) is append-only and grows monotonically. At 6MB it's already large; future growth degrades read performance for /events:tail + /events:query + smart-context's append. Add a rotation policy: when events.jsonl > 10MB, rotate to events.jsonl.<ISO>.gz; keep last 5 rotations; clean older. Triggered on append from logger.js OR via periodic check skill."
