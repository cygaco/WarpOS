source_request: "Wire existing /roadmap:* through DoPM — milestone 0.14.0 sprint 4. /roadmap:add and /roadmap:cleanup declare `temporary-agent: director-of-pm` in frontmatter; proposed edits pass through DoPM critique before file write; operator sees 'DoPM suggests: …' annotations with rationale. /roadmap:add gains 'which milestone does this feed?' prompting; /roadmap:cleanup gains 'what cadence rule is this entry violating?' lensing. Closes milestone 0.14.0."
interpreted_intent: "Two existing roadmap skills (/roadmap:add, /roadmap:cleanup) get DoPM integration via the skill-scoped injection mechanism. /roadmap:add: when operator adds an entry, DoPM lenses it — 'which milestone does this feed? if none, should there be a new milestone? does this conflict with current cadence?'. /roadmap:cleanup: when scanning for stale/duplicate/hidden-urgency entries, DoPM applies decision lenses — 'this entry violates the cadence rule because…', 'this entry is duplicate because…'. Edits still go through operator review; DoPM annotates, doesn't autonomously write."
