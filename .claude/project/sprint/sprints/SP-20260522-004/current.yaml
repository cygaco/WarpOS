source_request: "Implement scripts/warpos/manifest/bootstrap.js — the migration bootstrap script that converts an existing WarpOS install (Jobzooka, DreamTeam, canonical-as-workspace) to the new _warpos/ architecture. Sprint 1 architecture-core's last mechanical piece; named in ROADMAP.md Pickup Queue as Sprint 5 candidate."
interpreted_intent: "Sprint-1's architecture-core landed schema v1 + generator + validator + regenerator + settings compiler + structural gates against canonical itself, but installed products (Jobzooka, DreamTeam) still have no _warpos/ zone. A one-shot bootstrap script materializes that zone in an existing install: creates _warpos/, copies framework-owned content (hooks, templates, schemas, reference, settings/defaults) into it, generates the initial MANIFEST.json via build.js, rewrites .claude/settings.json hook paths to point at _warpos/hooks/*.js, then runs validator.js --strict for a clean-state attestation. Canonical-vs-product detection branches behavior (canonical sources self-reference; product sources point at _warpos/). Safe-copy semantics refuse to overwrite without --force."
