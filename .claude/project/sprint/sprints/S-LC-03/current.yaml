source_request: "Build the mode-switch preflight guard (Wave 1 of E-LIFECYCLE-001, REAL guard #1): a PreToolUse hook on the SlashCommand|Skill matcher that observes /mode:* switches, emits the two virtual lifecycle events in order, and surfaces a non-blocking advisory — report-only, fail-open, kill-switchable, backstop to mode-set.js. Engine/tooling sprint, ff-merge close, defer retro to epic close (RI-001)."
interpreted_intent: "Make mode-switch preflight mechanically observable: a real PreToolUse guard that catches /mode:* switches bypassing the mode-set.js transaction writer and logs the lifecycle events, without ever blocking (flip-to-block is a later ramp gated on §22 #4). Settings wiring + hooks-registry registration are integration-finished by Alpha."
