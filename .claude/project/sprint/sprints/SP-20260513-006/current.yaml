title: "Turbo as mode argument — compose /turbo into /mode:{solo,adhoc,oneshot}"
objective: "Compose /turbo with each /mode:X skill so the operator can enter a mode AND pre-authorize batch actions in a single command. Behavior without --turbo is unchanged."
