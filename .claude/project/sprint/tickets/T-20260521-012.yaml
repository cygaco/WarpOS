description: |
  PRE-RENAME MANDATORY STEP (DEC-005-addendum, CLAUDE.md §Refactor & Rename Hygiene):
  Run: grep -r "/product:" --include="*.md" --include="*.json" --include="*.js" .
  Every hit must be (a) in a file marked for rename, (b) in a documented deprecation context, or
  (c) explicitly allow-listed with <!-- portfolio-rename-allowed -->.
  Do NOT commit any D-status file until this sweep is clean.
  
  RENAMES (approval_required: true per prd.md §Approval Boundaries):
  - .claude/commands/product/{bootstrap,clone,ponder,import}.md → .claude/commands/portfolio/
  - scripts/product/{bootstrap,clone}.js → scripts/portfolio/ (full implementations move here)
  
  DEPRECATION ALIASES at old paths (thin stubs, live 2 releases until v0.10):
  - .claude/commands/product/{bootstrap,clone,ponder,import}.md — stub content prints C-1 banner on
    stderr (session-deduplicated) then forwards to /portfolio:<x>.
  - scripts/product/{bootstrap,clone}.js — thin re-export: module.exports = require('../portfolio/<x>')
  Alias invocations emit TR-6 portfolio.namespace_alias_used: { old_skill, new_skill } once per session.
  
  GITIGNORE additions (R-7, path-rooted patterns):
  - /_docs/briefs/
  - /_docs/clones/
  - /_docs/imports/
  
  Wire ref-checker hook on D-status files at commit time per DEC-005-addendum.
