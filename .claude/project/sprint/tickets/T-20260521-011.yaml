description: |
  Ensure schemas/portfolio/registry.schema.json includes forward-compat "kind" field in the
  products entry sub-schema (additionalProperties controlled at schema level — no silent unknown keys).
  
  Write scripts/portfolio/smoke-registry.js with 5 tests:
  1. validate() on empty document { schema: "warpos/portfolio-registry/v1", products: {} } — must PASS.
  2. validate() on well-formed single-product document — must PASS.
  3. validate() on document with missing required field — must FAIL with non-empty errors[].
  4. load() on non-existent file path — must return empty document shape (NOT throw).
  5. save() + load() roundtrip — written data survives roundtrip unchanged (deep-equal check).
  All 5 print PASS/FAIL. Script exits 0 only if all 5 pass.
