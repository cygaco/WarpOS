description: |
  Implement /portfolio:status skill and scripts/portfolio/status.js aggregator.
  Per registered product (all run in parallel via Promise.all — AC-9.1):
  - WarpOS version: read <repo_path>/.claude/framework-installed.json installedVersion
  - Last commit: git log -1 --format='%h %ad' --date=short in repo_path
  - Dirty-file count: git status --porcelain | wc -l (count lines)
  - Current sprint: read paths.sprintCurrent if present, else "-"
  - GitHub remote: gh repo view --json url (best-effort, "?" if gh not on PATH or no github_url)
  Each product check: 5s timeout (R-12). On timeout, show [timeout] in all cells for that row (C-8).
  Output: single ASCII table. Columns: slug | version | last-commit | dirty | sprint | remote.
  --validate-only flag: exits 0 if all products on_disk, exits 1 if any stale (AC-10.1, AC-10.2).
  Exit codes: 0 = all healthy, 1 = one or more stale/missing (AC-11.1, AC-11.2, AC-11.3).
