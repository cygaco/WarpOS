description: |
  Placeholder. The SP-20260513-003 /sprint:design subagent created this ticket via
  `ticket.js create` without passing --sprint. The script's loadCurrent() reads
  paths.sprintCurrent (the registry primary, currently SP-001), so the created ticket
  was tagged for SP-001 even though all linked artifacts pointed to SP-003. The
  subagent could not edit SP-001's current.yaml to remove the dangling reference
  (auto-mode classifier correctly blocked scope escalation), so this ticket is
  preserved as `abandoned` and the real SP-003 work moved to a new id minted with
  --sprint SP-20260513-003.
  
  Action for SP-001 owner: prune this id from current-sprint.yaml#tickets.proposed
  on next sprint hygiene pass.
  
  Class: refactor & rename hygiene class (ticket.js bypasses parseSprintArg side
  effect for cmdCreate's plan_contract / source_request capture — only `sprint`
  gets the override). Suggested fix: pass `current` through parseSprintArg in
  cmdCreate.
