description: "New events.jsonl event type skill-suggested-vs-invoked with phase discriminator (suggested|invoked) per copy.md C-4 schema. smart-context.js emits suggested events for each top-K skill it surfaces; PreToolUse SlashCommand hook (or wrapper) emits invoked events with invocation_path (ranker|agent-tool|user-slash) and turn_offset. Adherence = invoked ∩ suggested ÷ suggested over rolling window (filtered to invocation_path=ranker). /check:patterns helper consumes. Fail-open on telemetry write fail → paths.logs/<sessionId>/telemetry-fail.log. CRITICAL: load-bearing for measurement story; without S-6 the sprint cannot be validated post-ship."
