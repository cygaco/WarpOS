source_request: "Plan a new skill /product:clone that intakes information about a competitor's product (video URL, product website, product name) and emits cloneable competitive analysis under _docs/clones/<slug>/ — JTBDs of their product, scored feature list (build-complexity S/M/L/XL + how-core 1-5), voice-of-customer with quote+source attribution, gaps in their product, and capitalize-able opportunities. Sources to support: videos about the product, the product's own website (one-level link discovery), reviews and adjacent material (G2, ProductHunt, Reddit, HN, Twitter, blogs). Exploration rules: when only a video is given without a name, identify the name and web-search to enrich; when a URL is given, discover and crawl one level deep; try 2-3 review sources. Goal: enable rapid deployment of clones/competing products against companies the operator wants to kill — output detailed enough to feed directly into /product:bootstrap or /sprint:plan."
