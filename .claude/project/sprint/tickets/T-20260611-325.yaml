description: |
  W1 GPT 2nd-pass MINOR. mode-lifecycle-guard.js:199 treats a team-member cwd that is a
  PARENT of the project as belonging to this project via `normProject.startsWith(c + "/")`.
  That can mislabel a broad/foreign team as active for this project. Safer scoped test:
  exact project cwd, or member-cwd UNDER the project — not parent containment.

  NOTE: W1 finding #2 (.mode-guard-off silent suppression) is NOT in this ticket — it was
  CLOSED by G1/T-316 AC-2.4 (attestModeGuardKillSwitch makes the kill-switch no-op loud;
  verified by epsilon, mode-write-coverage.test.js passes). Only the parent-containment
  scoping (#3) on this same file remains.
