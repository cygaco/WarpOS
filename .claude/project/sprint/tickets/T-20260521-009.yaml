description: |
  /portfolio:new <slug> [--from-brief <existing-slug>]:
  - Validate slug (IN-1), resolve sibling path as path.resolve(warposRoot, '..', slug) (IN-2).
  - Exit 2 if target dir already exists with .git (not a fresh scaffold target).
  - git init <sibling-path>.
  - Copy templates from framework/templates/portfolio-bootstrap/ into new dir (R-20).
  - Run /warp:setup against sibling — must succeed (AC-16.2).
  - Call registry.js save() to register new slug.
  - Print C-2: gh repo create <slug> --private --source=<abs-path> --remote=origin --push
    as a copyable command block. "Skip this if the product will stay local-only for now."
    NEVER execute this command (DEC-003 / R-10).
  - Print C-11 registration success.
  - Emits TR-1 portfolio.registered with source_skill: "portfolio:new".
  
  /portfolio:adopt <slug> <existing-path>:
  - Resolve and validate path exists (IN-2).
  - Check WarpOS installed at path (.claude/framework-installed.json exists).
    If not found, prompt C-7 "WarpOS is not installed at <path>. Install now? (y/n)".
  - If WarpOS detected: register with registry.js, print C-11.
  - Emits TR-1 portfolio.registered with source_skill: "portfolio:adopt".
  
  /portfolio:from-brief <slug>:
  - Thin wrapper: locates brief at paths.briefsRoot/<slug>/, calls /portfolio:new --from-brief <slug>,
    moves brief files into new repo (not copy). Reports files_moved_count.
