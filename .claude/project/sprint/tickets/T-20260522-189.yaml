implementation_notes: "Validator detects: (1) missing — manifest path absent on disk; (2) unmanifested — on-disk path not in manifest (install-time coverage gap); (3) drift — framework sha256 mismatch with current file; (4) user_modified — installedSha != current; (5) schema_violation — per-class structural checks. Soft findings (drift/unmanifested) exit 0; hard findings (missing/schema_violation) exit 1; --strict upgrades soft to hard. 18/18 tests pass (test-validate.js — synthetic fixtures for each finding type, both with and without --strict). Live canonical manifest validates clean (1917 paths, 0 findings)."
