source_request: "Make WarpOS the command console for a portfolio of products. Each product lives in its own private GitHub repo with team collaborators, side-by-side with WarpOS on disk. WarpOS exposes a single unified /portfolio:* skill family (collapses the existing /product:* into /portfolio:*) so the user has ONE namespace for everything product-related — bootstrap, clone, ponder, import, list, open, new, register, status, dispatch, sync. The user can also 'port' into any product in a separate terminal (via /portfolio:open <slug> --spawn) and run multiple products in parallel, each in its own Claude Code session, while WarpOS remains the home-base terminal."
