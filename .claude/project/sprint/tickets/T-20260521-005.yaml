description: |
  Implement /portfolio:register <slug> <path> [<github_url>] skill and backing register.js helper.
  Validation:
  - slug: must match IN-1 regex ^[a-z0-9][a-z0-9-]{0,63}$, exit 2 on fail.
  - repo_path: resolve to absolute via path.resolve(). Must exist on disk (exit 2 if not).
    Must not be current WarpOS canonical CWD.
  - github_url: optional, must match IN-3 pattern if provided.
  Idempotent: if slug already registered with same path, logs "already registered" + exits 0.
  On new registration: calls registry.js save() atomically, prints C-11 success copy.
  Emits TR-1 portfolio.registered event with path_offset (relative to os.homedir()), never absolute path.
