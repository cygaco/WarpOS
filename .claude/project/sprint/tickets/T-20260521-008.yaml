description: |
  Implement /portfolio:open <slug> [--spawn] skill and scripts/portfolio/spawn.js.
  
  Attach mode (no --spawn):
  - Print C-5: absolute path + cd <abs-path> && claude hint + hint to use --spawn.
  - Emits TR-2 portfolio.open_attempted with spawn_requested: false.
  
  Same-CWD guard (R-18, DEC-006 addendum):
  - If slug.repo_path == process.cwd(), print C-3 warning, exit 0.
  - Guard fires BEFORE any spawn attempt.
  
  --spawn mode platform dispatch (R-16):
    Windows: wt -w 0 nt -d <repo_path> pwsh -NoExit -Command "claude"  [exact per AC-14.1]
             fallback: start powershell -NoExit -Command "cd '<repo_path>'; claude"
             fallback: start cmd /k "cd /d <repo_path> && claude"
    macOS:   open -a iTerm <repo_path>, fallback: open -a Terminal <repo_path>
    Linux:   gnome-terminal --working-directory=<repo_path>, fallback: xterm -e "cd <repo_path> && claude"
  
  Terminal resolution: which/where at invocation time (IN-5). Never cache result.
  
  PATH fallback (R-17, DEC-006 addendum):
  - If NO terminal binary found on PATH, print C-4 (copyable cd <abs-path> && claude command
    + supported-terminals list). Exit 0 — graceful degradation, NOT an error (AC-14.4).
  
  Non-Windows --spawn: exit 2 with not_implemented_on_platform: <platform> per AC-15.2.
  
  Emits TR-2 portfolio.open_attempted + TR-3 portfolio.spawn_result on every invocation.
