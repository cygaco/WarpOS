description: |
  Implement /portfolio:sync skill and scripts/portfolio/sync.js.
  Operation: git fetch --prune in all registered products in parallel (Promise.all — AC-12.1).
  10s timeout per product (AC-12.2). On timeout, mark result as "timed_out" in summary.
  Fetch-only — NO git merge or git pull under any circumstances (R-14).
  Output: summary table after all fetches complete. Columns: slug | result (fetched / up-to-date / timed_out / error).
  Print C-10 copy: "Fetch-only — no merges were performed." after table.
  Emits TR-5 portfolio.sync_completed event with: product_count, fetched, up_to_date, timed_out, errored counts.
  Skip products where github_url is null (no remote to fetch from) — show "-" in result column.
