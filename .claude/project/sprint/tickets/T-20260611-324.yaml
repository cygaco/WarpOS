description: |
  W1 GPT 2nd-pass BLOCKER. session-end-team-teardown.js:35 trusts `event.cwd` as
  `projectDir`, then `require(<projectDir>/scripts/teams/lifecycle.js)` from that path and
  calls `teardown`. If CLAUDE_PROJECT_DIR is absent or attacker-controlled, hook input can
  redirect MODULE LOADING + teardown requests to a foreign project (require-redirection).
acceptance_criteria:
  - "AC-324.1: projectDir is ANCHORED to the hook's own repo root (derived from __dirname / the hook file location), canonicalized (realpath); event.cwd is treated as CORROBORATING context only, never as the require() base."
  - "AC-324.2: an exploit fixture supplying a foreign/attacker event.cwd (with CLAUDE_PROJECT_DIR absent) must NOT cause require() or teardown to target the foreign path — the hook resolves to its own repo root. Fixture namespaced under tests/regression/SP-20260611-002/."
  - "AC-324.3: the legitimate same-project teardown path still works (no happy-path regression); fail-open preserved (a teardown-request failure never throws/blocks session end)."
non_goals:
  - "Settings-wiring of the hook into settings.json — OUT of scope (separate α decision per β constraint #3), NOT this ticket."
  - "Signing/auth marker infrastructure (β constraint #4)."
