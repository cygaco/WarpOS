description: |
  Implement scripts/portfolio/lib/registry.js exposing:
  - load(): reads ~/.warpos/portfolio.json, returns empty-document shape
    { schema: "warpos/portfolio-registry/v1", products: {} } if file missing (NOT an error).
    If corrupt JSON, throws with message "Portfolio registry is corrupt at <path>. Fix manually or delete to reset."
  - save(data): atomic write — write to .portfolio.json.tmp then rename to portfolio.json.
    Creates ~/.warpos/ dir with fs.mkdirSync(dir, { recursive: true }).
  - list(): returns array of product entries from registry.
  - findBySlug(slug): returns entry or null.
  - validate(entry): validates against registry.schema.json, returns { valid: boolean, errors: [] }.
  Uses os.homedir() for HOME expansion at runtime (never cache).
  Emits TR-7 portfolio.registry_read event on every load().
