source_request: "Sprint 1 of the ROADMAP — Framework Boundary & Identity. Adopt the managed-config-layer architecture: canonical WarpOS contains only framework source; installed products treat _warpos/ as the framework source-of-truth zone and .claude/ as the compiled runtime interface. Full purge of the upstream-discovery surface (/warp:promote, /warp:promote-flags, /warp:flag, warpos-to-update.md and supporting scripts/paths/keys). Introduce _warpos/MANIFEST.json as the ownership source-of-truth. Generated-view discipline for tool-mandated paths (.claude/commands, .claude/agents, .claude/settings.json). Three-layer settings.json compiler. Canonical scrub: move WarpOS-as-product specs to a new PRIVATE workspace. Five structural gates: canonical pre-commit guard, /check:framework-purity, installer ownership manifest, /warp:update --status, /check:framework-views-fresh. Migration plan for existing installed products. Defer Pattern C′."
