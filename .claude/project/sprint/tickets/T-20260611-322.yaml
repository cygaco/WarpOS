business_value: "Closes the last binding FAIL blocking SP-20260611-001 from going green; eliminates a real silent-reap window at the cross-provider dispatch site that defeats the loud-death-record contract the whole E-DISPATCH-SHAPE epic exists to guarantee."
acceptance_criteria:
  - "AC-322.1: dispatch-agent.js derives BOTH its slot-acquire bound AND the runProvider opts.timeoutMs from DISPATCH_BUILDER_TIMEOUT_MS when ε sets it (the propagated childBaseMs), so all three timeout layers (parent SIGTERM / child slot / child provider-exec) single-source from childBaseMs and parent = childBaseMs + grace STRICTLY EXCEEDS every child layer BY CONSTRUCTION — mirroring the epsilon-claude site."
  - "AC-322.2: non-ε callers (DISPATCH_BUILDER_TIMEOUT_MS unset) keep their CURRENT defaults (DISPATCH_SLOT_TIMEOUT_MS 600s, run-provider 540s) — no cross-caller regression. Verify only ε sets that env."
  - "AC-322.3: the epsilon-spawn-grace regression test asserts REAL-BOUND ORDERING — parent spawnSync timeout > child slot bound AND parent > child provider-exec bound — at the epsilon-AGENT site, for opts.timeoutMs in {small, huge, unset}. NOT merely that the env var is present in the spawn options (the MAJOR the backend lane flagged: the old test false-greened the residual by checking presence, not consumption/ordering)."
  - "AC-322.4: MUTATION check — reverting the dispatch-agent.js read REDs the new ordering test (proves it catches the attack, not a happy path)."
non_goals:
  - "Raising the timeout bounds themselves (that is T-20260611-323, a W0 design-constant change with its own blast radius + liveness-ping pairing)."
  - "Touching the WS-B window-clamp surface (marquee — confirmed PASS by qa + security on attempt #1; needs no further work)."
implementation_notes: |
  Fix shape (ε lean, pending β DECIDE/DIRECTIVE on scope+shape — consult sent 2026-06-11):
  CHILD-SIDE single-sourcing. dispatch-agent.js reads DISPATCH_BUILDER_TIMEOUT_MS when set
  and uses it as the basis for slotTimeoutMs AND the runProvider opts.timeoutMs, so the
  child is ACTUALLY bound by childBaseMs (not just the parent). Preferred over a parent-side
  bound-raise (fragile: leaves child bounds independent, re-diverges if the slot default
  changes). Apply the foreground clamp consistently. Confirm DISPATCH_BUILDER_TIMEOUT_MS is
  ε-only so non-ε callers are unaffected.
