description: |
  Re-gauntlet attempt #1 (2026-06-11) returned a binding backend-reviewer FAIL on FIX-A1
  (T-310). FIX-A1 fixed the epsilon-CLAUDE site genuinely (dispatch-claude.js reads
  DISPATCH_BUILDER_TIMEOUT_MS, so parent=childBaseMs+grace by construction), but the
  epsilon-AGENT site's env propagation is DEAD: dispatch-agent.js does NOT read
  DISPATCH_BUILDER_TIMEOUT_MS — it uses DISPATCH_SLOT_TIMEOUT_MS (slot-acquire, 600s
  default, dispatch-agent.js:601) plus runProvider's own foregroundAwareTimeout
  (providers.js:657, 540s), both independent of the parent.

  QUANTIFIED (α-verified at source): epsilon-agent parent SIGTERM = foreground-clamped
  540s + 45s grace = 585s; child slot default = 600s. Parent (585s) < child slot (600s) →
  a saturated provider slot is parent-killed BEFORE the child reaches its graceful fallback
  / writes its record. The same death-record race the +grace was meant to close, still open
  at the cross-provider site.

  This is the operator-confirmed UNCONDITIONAL fix ("epsilon must definitely read the right
  timer"). The fix is now independent of any verdict; the backend lane's verdict only
  informs the fix shape.
