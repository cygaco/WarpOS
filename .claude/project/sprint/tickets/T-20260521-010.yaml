description: |
  Implement /portfolio:dispatch <slug> <skill> [args...] skill and scripts/portfolio/dispatch.js.
  
  Validation:
  - slug: must be registered in registry (exit 2 "No product registered as '<slug>'").
  - skill: must match IN-7 regex ^[a-z0-9:_-]+$. Exit 2 "Invalid skill name '<value>'..." on fail.
  - Metacharacter guard: block & ; | ` $ > < ( ) in skill argument and ALL args. Exit 2 on hit.
  
  Interactive skills warning (C-9):
  - Before spawning subprocess, print C-9 interactive warning + prompt y/n.
  - Skip warning only if --no-confirm flag is passed.
  
  Execution:
  - Subprocess: cd <product-path> && claude --print "/<skill> <args>"
  - Capture stdout/stderr and stream to WarpOS terminal.
  - Surface exit code verbatim.
  
  Hard non-goal: NEVER set CLAUDE_PROJECT_DIR in the current Claude Code instance.
  Always a new subprocess.
  
  Emits TR-4 portfolio.dispatch_run: { slug, skill, interactive_warned, confirmed }.
