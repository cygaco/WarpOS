completion_evidence:
  - kind: api-surface
    note: |
  postflight.js exports registerExternalCheck({name, resolvePath, required, degradedReason}) → boolean. Module-scoped singleton externalChecks[]. De-dups by name. SP-002 invocation example:
  
      const pf = require('scripts/warpos/postflight');
      pf.registerExternalCheck({
        name: 'provider-smoke',
        resolvePath: 'paths.providerSmokeSkill',
        required: false,
        degradedReason: 'provider-smoke skill not yet shipped',
      });
  
  Also exports listExternalChecks() and clearExternalChecks() for testing.
  - kind: smoke-test
    note: "Test confirmed: with paths.providerSmokeSkill absent in paths.json → status:degraded with degradedReason in evidence; postflight ok=false unaffected by degraded status; AC-S-8.1 met. AC-S-8.2 covered by runExternalCheck spawnSync path (4096-byte stdout truncation, exit-code → status mapping)."
