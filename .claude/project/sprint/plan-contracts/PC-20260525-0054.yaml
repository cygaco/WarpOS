  - "Add portfolio: thin wrappers (spinup at minimum) that dispatch /bootstrap:<skill> <slug>."
  - "Rename portfolio:dispatch -> portfolio:run (skill + body + engine reference)."
  - "Fold adopt into portfolio:new --from-brief; delete standalone adopt."
  - "Delete .claude/commands/product/ (4 aliases) and portfolio:import."
  - "Grep-sweep the repo for old names (portfolio:clone/bootstrap/dispatch/import/adopt, product:*) and update/remove every reference."
