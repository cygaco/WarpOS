sprint: SP-20260523-002
source_request: "Fix the status lag bug where active-sprints.yaml and current.yaml stay at status=planning/designing/releasing even after /sprint:full Phase 5 (retrospective) completes. Caught it during SP-004 + SP-005 — had to manually patch active-sprints.yaml after each sprint finished."
source_request_verbatim: "current.yaml#status lag after /sprint:full Phase 5 — sprint stays at status: designing/releasing even after the full pipeline runs through retrospective. Probably the retrospective.js fall-through (skeleton exit 3) is the missed update site. Sprint 6 polish from ROADMAP.md Pickup Queue."
request_type: bug_fix
interpreted_intent: "When /sprint:full runs all 5 phases to completion, both current.yaml (per-sprint state) and active-sprints.yaml#sprints[id].status (registry) should advance to 'retrospected'. Today they remain stuck at an earlier phase. Likely root cause: retrospective.js falls through with exit 3 (skeleton mode) without updating either file. Fix: in retrospective.js (or sprint/full.js Phase 5 wrapper), after retrospective completes (success OR skeleton-skip), explicitly call status updaters for current.yaml AND active-sprints.yaml. Add a test that runs /sprint:full end-to-end against a fixture and asserts both files reach 'retrospected'."
user_or_business_outcome: "Sprint registry stays honest with actual completion state — operator can run /sprint:status and trust the output. The active-sprints.yaml registry is what other skills (/sprint:status, downstream tooling) read; manual patches today are a footgun."
affected_surfaces:
  - surface: "scripts/sprint/retrospective.js (modify — ensure exits update status before returning)"
    evidence_level: inferred_from_repo
  - surface: "scripts/sprint/full.js (modify — Phase 5 wrapper should ensure status update happens regardless of retrospective exit)"
    evidence_level: verified_from_repo
  - surface: ".claude/project/sprint/active-sprints.yaml (read/write — the registry)"
    evidence_level: verified_from_repo
  - surface: ".claude/project/sprint/sprints/<SP-id>/current.yaml (read/write — per-sprint state)"
    evidence_level: verified_from_repo
  - surface: "scripts/sprint/test-sprint-full.js (modify — add end-to-end status assertion)"
    evidence_level: inferred_from_repo
current_behavior:
  evidence_level: verified_from_repo
  notes: "After /sprint:full SP-20260522-004 reached 'done' through all 5 phases this session, active-sprints.yaml still showed SP-004 with status=planning. Same for SP-005. Manual patch via Edit tool was the workaround. The sprint-full-report.md correctly shows completion; the registry doesn't."
desired_behavior: "After /sprint:full final phase completes (including skeleton-exit-3 retrospective skip), both active-sprints.yaml#sprints[id].status AND .claude/project/sprint/sprints/<SP-id>/current.yaml#status are updated to 'retrospected'. Test fixture runs full pipeline against a tmp dir and asserts both files post-completion."
scope:
  size: s
  risk_level: low
  complexity_drivers:
    - "Two write sites to keep in sync (current.yaml + active-sprints.yaml)"
    - "retrospective.js exit-3 skeleton case must still trigger the update (it's the most common path)"
    - test-sprint-full.js fixture setup may need extension
scope_variants:
  minimal_safe:
    summary: "In sprint/full.js Phase 5 wrapper (post-retrospective.js invocation), unconditionally call existing status-update helpers for both files. Add one end-to-end test."
    tradeoffs:
      - "Ships in <1 hour"
      - "Doesn't fix the underlying retrospective.js bug — wrapper compensates"
  recommended:
    summary: "Minimal-safe + fix retrospective.js to update status itself (the right architectural place). Wrapper is still a safety net. Two updaters touched, defense in depth."
    tradeoffs:
      - Slightly more code
      - Cleaner separation of concerns
  expanded:
    summary: "Recommended + add a /check skill (or existing /check:all entry) that surfaces sprints where current.yaml status disagrees with full-reports/<SP-id>/sprint-full-report.md."
    tradeoffs:
      - Self-healing telemetry
      - Out of scope for this sprint
