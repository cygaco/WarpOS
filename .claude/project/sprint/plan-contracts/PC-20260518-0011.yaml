    evidence_level: verified_from_repo
    notes: "Read 2026-05-18. Schema has 35+ required fields; no goal_verification block today. Additive field — no schema-version bump per sprint-routing.json precedent."
  - surface: schemas/sprint/current-sprint.schema.json
    evidence_level: verified_from_repo
    notes: "Read 2026-05-18. Per-sprint live state schema. Will propagate goal_verification (or a pointer to it) so /sprint:design + /sprint:release can read it without re-loading the Plan Contract."
  - surface: "schemas/sprint/regression-fixture.schema.json (new)"
    evidence_level: verified_from_repo
    notes: "Glob 2026-05-18 confirms this file does not exist. Design will define the fixture record shape — fields likely: schema, sprint_id, origin (bug_id|ticket_id|user_report), bug_classes_closed[], cited_tests[{file, test_name}], reproduction_kind (executable|not_applicable), justification."
  - surface: scripts/sprint/plan.js
    evidence_level: verified_from_repo
    notes: "Read 2026-05-18. Already accepts arbitrary payload fields and is dumb-plumbing — extending to capture goal_verification (origin_evidence, bug_classes_closed) is mechanically simple. The script's auto-record routing trace + conflict-check sections are unaffected."
  - surface: scripts/sprint/design.js
    evidence_level: verified_from_repo
    notes: "Exists (glob 2026-05-18). Design will add a gate: refuse to advance to designed state unless a fixture record exists under tests/regression/<SP-id>/, or goal_verification.reproduction is set to not_applicable with a written justification."
