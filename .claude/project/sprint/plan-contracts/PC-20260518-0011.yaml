current_behavior:
  evidence_level: verified_from_repo
  notes: "Today AC markdown is the only acceptance artifact (template at framework/templates/sprint/requirements/acceptance-criteria.md.tmpl uses AC-N.M numbering with prose Given/When/Then). No verified_by linkage. /sprint:release Step 2 checks acceptance_criteria_satisfied as a boolean — operator discipline, not execution. /sprint:release ship-gate does not execute any sprint-specific tests; routing/coverage checks happen but are independent of AC-level fixtures. /linters:run discovers scripts/lint-*.js and package.json#lint* — test-plan-honors-registry-primary.js (placed under scripts/sprint/) is not currently auto-discovered."
desired_behavior: "Every Plan Contract for an active sprint carries a goal_verification block recording: the originally-reported failure (origin_evidence), the bug_classes_closed, and a contract that a regression fixture under tests/regression/<SP-id>/ will exist by /sprint:design exit. Each AC in acceptance-criteria.md links verified_by: <test-file>::<test-name>. /sprint:design refuses to advance unless every AC is linked (or marked not_applicable with justification). /sprint:release ship-gate enumerates cited tests, runs each, and fails closed on any failure. /check:ac-coverage reports linkage + execution status on demand. scripts/sprint/test-plan-honors-registry-primary.js runs as part of /linters:run, catching the plan.js drift bug class at lint-time."
scope:
  size: m
  risk_level: medium
  complexity_drivers:
    - "Touches three schemas (plan-contract additive field, current-sprint propagation, new regression-fixture schema)."
    - "Modifies four sprint helpers (plan.js, design.js, release.js, retrospective.js) plus four skill bodies (sprint/plan.md, design.md, release.md, execute.md)."
    - "Adds a new top-level paths.sprintRegressionCorpus key in .claude/paths.json (must be the SINGLE source of truth — no literal duplication per CLAUDE.md Paths rule)."
    - "Introduces a new /check:* skill (ac-coverage) and a new helper script (check-ac-coverage.js)."
    - "Affects ALL future sprints — must be opt-in for closed/retrospected sprints (10+ retro'd sprints already on disk; no backfill)."
    - "Ship-gate gains a hard execution dependency — sprint cannot release if any cited test fails. Bypass discipline (--allow-coverage-gap or similar) needs design."
    - "Wiring test-plan-honors-registry-primary.js into /linters:run requires either a scripts/lint-* shim OR extending scripts/linters/run.js discoverer (no root package.json; the package.json#lint* discovery path is dead in this repo)."
scope_variants:
  minimal_safe:
    summary: "Schema fields + corpus directory convention only. No ship-gate enforcement, no /check:ac-coverage skill, no design-time refusal. Skill bodies document the convention but /sprint:release behavior is unchanged. test-plan-honors-registry-primary.js still wired into /linters:run (the prevention follow-up is independently valuable). Operator discipline carries the rest."
    tradeoffs:
      - "Pro: bounded surface area, no risk to existing /sprint:release flow."
      - "Pro: lets the convention bake in for one sprint before enforcement."
      - "Con: the load-bearing rule ('every sprint produces a test that would have failed before') stays aspirational — same class of gap we have today."
      - "Con: no audit signal — operators can ship without fixtures and never get told."
  recommended:
    summary: "minimal_safe + /sprint:design refusal on missing fixture + /sprint:release ship-gate runs cited tests + /check:ac-coverage skill + scripts/sprint/test-plan-honors-registry-primary.js wired into /linters:run. goal_verification.reproduction allows not_applicable for research/docs/refactor sprints when paired with a written justification. No backfill for closed sprints."
    tradeoffs:
      - "Pro: the load-bearing rule becomes enforceable — ship-gate fails closed if cited tests fail."
      - "Pro: read-only audit (/check:ac-coverage) gives a yellow signal before /sprint:release, not after."
      - "Con: medium blast radius — design.js + release.js + four skill bodies change in one sprint."
      - "Con: need a clean bypass story for legitimate not_applicable cases (research/docs)."
  expanded:
    summary: "recommended + retroactive coverage scanner that audits closed sprints (read-only, never blocks) + per-AC test discovery via test-file annotations (`// @verifies AC-N.M`) + integration with /warp:health to raise yellow advisory on aggregate coverage drops."
    tradeoffs:
      - "Pro: cross-sprint insight — does the corpus grow over time?"
      - "Pro: test-file annotations make linkage discoverable from either direction (AC → test, test → AC)."
      - "Con: scope balloons into observability territory — /warp:health is a separate workstream."
      - "Con: retroactive scanner has to handle 10+ closed sprints' worth of historical AC files with no convention — high noise floor."
assumptions:
  safe:
    - "tests/regression/ is a fresh directory — no current path; verified absent via Glob 2026-05-18."
    - "Additive schema fields don't require a schema-version bump — precedent: sprint-routing.json and current-sprint.schema.json#lane were added the same way under SP-20260512-001."
    - "The convention <test-file>::<test-name> is more stable than <test-file>:<line> — line numbers churn on every edit; test names are deliberately named."
    - "Closed/retrospected sprints (SP-20260512-001 through SP-20260518-001, 10 entries) are exempt — the ship-gate only applies when the Plan Contract carries a goal_verification block."
    - "Beta consultation is in scope — this changes every future sprint's contract; per CLAUDE.md §Autonomy Class B/C this is at minimum Class B."
  unsafe:
    - "Wiring test-plan-honors-registry-primary.js into /linters:run via the scripts/lint-*.js auto-discovery path requires either renaming/shim'ing or extending the discoverer — there is NO root package.json so the package.json#lint:* path is unavailable in this repo (verified via Glob 2026-05-18). Design must pick one."
    - "The cited-test format `<file>::<test-name>` assumes the test exposes individual named cases. The existing test-plan-honors-registry-primary.js uses bespoke `passed/failed` counters with stdout strings (`ok    <name>` / `FAIL  <name>`) — there is no canonical test runner. The /sprint:release ship-gate test executor needs to parse this output format OR mandate a thin runner contract (e.g., exit code 0 = pass, structured per-case lines) — design decision."
    - "Excluding tests/regression/<SP-id>/ from /linters:run is essential — fixtures execute via the ship-gate, not on every linter pass. If we wire the corpus into the auto-discoverer naively, every linter pass becomes a full corpus run. Design must scope discovery."
    - "The new paths.sprintRegressionCorpus key must propagate through scripts/hooks/lib/paths.js (which the path-guard hook also reads) — a partial rollout where only .claude/paths.json knows the key creates a stale-literal class of bug (LRN-2026-04-29 stale-anthropic-checks)."
    - "/sprint:full (just shipped in SP-20260518-001) dispatches the same per-phase helpers — any behavioral change in design.js or release.js inherits to /sprint:full's autonomous runs. Must validate /sprint:full v1 still works after the design-time refusal lands."
  needs_user_or_beta_review:
    - "[RESOLVED 2026-05-18 by Beta, conf 0.87] not_applicable reproduction_kind: yes — allow with non-empty justification REQUIRED; empty justification = same as missing (design refuses)."
    - "[RESOLVED 2026-05-18 by Beta, conf 0.82] Ship-gate unparseable-output default: INCONCLUSIVE; operator override logged to decision-ledger; NO --allow-coverage-gap flag in v1 (observe real bypass patterns first)."
    - "[RESOLVED 2026-05-18 by Beta, conf 0.84] /sprint:full preset semantics: explicit bump REQUIRED — add note to moderate preset about design.js fixture gate; do not silently inherit (same bug class as RT-008)."
    - "[OPEN, non-blocking] Should /check:ac-coverage be added to the default set run by /check:all? Low-risk additive; defer to design or post-design."
open_questions:
  blocking: []
  non_blocking:
    - "Wiring mechanism for scripts/sprint/test-plan-honors-registry-primary.js into /linters:run — `scripts/lint-sprint-plan-honors-registry.js` shim vs. extending scripts/linters/run.js discoverer to pick up scripts/sprint/test-*.js. Design decides."
    - "Whether goal_verification lives as a sibling field on plan-contract.schema.json or as a $ref to a separate goal-verification.schema.json. Design decides."
    - "Whether the per-sprint fixture directory tests/regression/<SP-id>/ should be created automatically by /sprint:design or asserted on entry to /sprint:execute. Design decides."
    - "Whether /check:ac-coverage emits machine-readable JSON in addition to its prose report (matches /linters:run --json convention). Design decides."
    - "Backfill policy for sprints in flight at the moment Sprint A ships (SP-20260518-001 is retrospected, so n/a today — but if another sprint is mid-flight at execution time, do we (a) exempt by start-date or (b) require goal_verification on the next /sprint:design entry into that sprint). Beta should weigh in during design."
