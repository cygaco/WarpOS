source_request: "Build the keystone (DUMP.md #5): the executable consumer-contract gate in SEALED-CAPSULE posture, with full cross-provider gauntlet + telemetry verify."
source_request_verbatim: "Build the KEYSTONE (DUMP.md #5): the executable consumer-contract gate in SEALED-CAPSULE posture. Spec: (1) materialize the release capsule into a self-contained sealed payload and install ONLY that into a disposable out-of-tree repo where canonical WarpOS is UNREACHABLE; (2) run the real consumer lifecycle setup->scan:install->a real sprint->dispatch telemetry->update under BOTH repo roles (scripts/warpos/repo-role.js) across cold + warm/update paths; (3) typed success via scripts/dispatch/gauntlet-verify.js (green = action occurred AND telemetry record exists; fail-closed); (4) wire as release/promotion gate + name the enforcer. Builds on already-merged repo-role.js, gauntlet-verify.js, test-fresh-install-smoke.js. HIGH-risk enforcer-class: full 4-reviewer cross-provider gauntlet + telemetry verify REQUIRED, do NOT skip-gauntlet, expect >=1 fix cycle. Beta pre-cleared the plan (DECIDE x3): build in isolated worktree, autonomous through gauntlet, single halt = gauntlet verdict before ff-merge (halt-report to operator), ff-merge LOCAL only (no push - operator-gated). ADR-0006 already written. Engine/tooling sprint (no deploy artifact) -> fast-close path."
request_type: architecture_change
interpreted_intent: "Build the full sealed-capsule consumer-contract release gate (ADR-0006): a script + tests + release/promotion wiring that materializes the release capsule into a self-contained payload, installs ONLY that payload into a disposable out-of-tree repo where canonical is unreachable, runs the real consumer lifecycle under both repo roles across cold+warm paths, and asserts typed success (action occurred AND telemetry record exists) fail-closed. Name the enforcer per CLAUDE.md Policy & Enforcement Hygiene."
user_or_business_outcome: "Releases can no longer ship code that secretly reaches back into canonical-only state (the #1 recurring 'downstream always missing' disease, e.g. the 100 dangling seeded_from pointers). A failing gate blocks promotion before a broken release reaches a real product install."
affected_surfaces:
  - surface: "scripts/warpos/ (new sealed-capsule gate script)"
    evidence_level: verified_from_repo
    notes: "Sibling to test-fresh-install-smoke.js; reuses release-build.js capsule layout in framework/releases/."
  - surface: "scripts/warpos/repo-role.js (consumed, not modified)"
    evidence_level: verified_from_repo
    notes: Single-source role resolver with override-arg threading for both-role runs.
  - surface: "scripts/dispatch/gauntlet-verify.js (consumed for typed-success telemetry)"
    evidence_level: verified_from_repo
    notes: "verifyGauntlet() / isWellFormedOkRecord(); fail-closed semantics."
  - surface: "release/promotion wiring + named enforcer (scripts/checks/ or release-gates.js)"
    evidence_level: inferred_from_repo
    notes: "Wire as a release/promotion gate; register the enforcer name."
  - surface: "_warpos/MANIFEST.json + .claude/framework-manifest.json (regen)"
    evidence_level: verified_from_repo
    notes: "New scripts are hash-tracked; regen BOTH before commit (BC-02/BC-05)."
current_behavior:
  evidence_level: verified_from_repo
  notes: "Only the cheap leading-indicator slice exists (test-fresh-install-smoke.js), which installs via warp-setup source-clone with canonical REPO_ROOT REACHABLE — structurally cannot catch reach-back. The capsule ships a manifest (file list+hashes) but not the file bytes."
desired_behavior: "A runnable gate that: (a) materializes a sealed self-contained payload from the capsule manifest; (b) installs only that payload into a disposable out-of-tree temp repo with canonical pathed-out/unreachable; (c) runs setup->scan:install->a real sprint->dispatch telemetry->update under BOTH repo roles across cold+warm paths; (d) asserts typed success via gauntlet-verify (action + well-formed telemetry record), fail-closed on runner-error/malformed/no-record; (e) is wired as a release/promotion gate with a named enforcer. Exit 0 = release stands on its own; non-zero = reach-back / contract break detected."
scope:
  size: l
  risk_level: high
  complexity_drivers:
    - "enforcer-class: must be hardened against false-green / fail-open (every enforcer lane last session had real holes the gauntlet caught)"
    - "true isolation: canonical must be provably unreachable from the sealed install (no abs path, scrubbed env)"
    - "role-semantics-at-seal-vs-runtime (Class-A design call): seal in canonical role, install in consumer role"
    - "telemetry cwd anchoring (ED-016 class): completion records must be findable from canonical, not the temp/worktree runtime"
    - "full lifecycle x 2 roles x cold+warm = heavy; must stay bounded/non-flaky"
