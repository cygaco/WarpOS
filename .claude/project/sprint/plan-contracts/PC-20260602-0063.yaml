high_level_story_candidates:
  - "As the release pipeline, I materialize a sealed self-contained payload from a built capsule so install needs nothing from canonical."
  - "As the gate, I install the sealed payload into a disposable out-of-tree repo where canonical is unreachable, so reach-back breaks loudly."
  - "As the gate, I run the real consumer lifecycle under both repo roles across cold+warm paths and assert typed success, so green means it truly works."
  - "As the maintainer, the gate is wired into release/promotion with a named enforcer so violations are self-detecting."
granular_story_candidates:
  - "seal(version): copy the exact bytes the capsule framework-manifest enumerates into a sealed payload dir + verify against checksums.json; refuse on stale/missing manifest (fail-closed)."
  - "isolate(): create out-of-tree temp repo, git init, install only the sealed payload, assert canonical is unreachable (no abs canonical path in installed files; WARPOS scrubbed env)."
  - "lifecycle(role, path): run setup -> scan:install -> a minimal real sprint -> emit dispatch telemetry -> update; capture exit codes + telemetry window."
  - "verifyTyped(window, roles): call verifyGauntlet/typed-success against canonical-anchored telemetry; fail-closed on runner-error/malformed/no-record."
  - "matrix: run lifecycle for role in {canonical,consumer} x path in {cold,warm} via repo-role override threading."
  - "wire: register as release/promotion gate (release-gates.js or checks/) + add named enforcer + log enforcement-debt closure if any policy remains unenforced."
  - "regen BOTH manifests; add the gate to the testsuite/enforce.js runnable set."
workstream_candidates:
  - "core gate script (seal+isolate+lifecycle+verify)"
  - "release/promotion wiring + named enforcer"
  - "tests (unit + e2e fixture) + testsuite registration"
  - "manifest regen + docs/enforcement-debt"
