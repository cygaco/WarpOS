sprint: SP-20260523-003
source_request: "Wire installer ownership manifest hook into /warp:setup. After install, validate target's _warpos/MANIFEST.json against on-disk state and surface unmanifested files as coverage gaps. Built on Sprint 1's shipped manifest generator + validator."
source_request_verbatim: "Installer ownership manifest hook into /warp:setup. /warp:setup should refuse to write any path not enumerated in _warpos/MANIFEST.json (or write it and flag as unmanifested coverage gap). Conceptually this IS the manifest generator + validator pair already shipped — needs the actual /warp:setup integration. Sprint 6 polish from ROADMAP.md Pickup Queue."
request_type: feature_add
interpreted_intent: "Sprint 1 shipped scripts/warpos/manifest/build.js (generator) and validate.js (--strict). /warp:setup writes a bunch of framework files (hooks, settings, manifest, etc) but doesn't currently verify the install matches _warpos/MANIFEST.json. This sprint adds a post-install step that runs build.js (regenerate manifest) + validate.js (--json) and surfaces findings — especially `unmanifested` (files written but not declared in manifest, which means future updates won't track them). Gentle mode: warn + log; --strict-manifest mode: refuse non-zero exit."
user_or_business_outcome: "Every /warp:setup leaves the target in a state where _warpos/MANIFEST.json is honest about on-disk content. Maintainers using /warp:setup against new products immediately know if anything slipped through the cracks. Subsequent /warp:update + /warp:check skills get correct data."
affected_surfaces:
  - surface: "scripts/warp-setup.js (modify — add post-install manifest-coverage step)"
    evidence_level: verified_from_repo
  - surface: "scripts/warpos/manifest/build.js (read — invoked as subprocess)"
    evidence_level: verified_from_repo
  - surface: "scripts/warpos/manifest/validate.js (read — invoked as subprocess)"
    evidence_level: verified_from_repo
  - surface: "scripts/warp-setup-test.js or similar (new test for hook)"
    evidence_level: assumed_from_request
current_behavior:
  evidence_level: verified_from_repo
  notes: "scripts/warp-setup.js writes framework files (hooks at scripts/hooks/, agents at .claude/agents/, settings.json, paths.json, manifest.json, etc) directly. No post-install validation against _warpos/MANIFEST.json. Validator exists but is unwired from /warp:setup."
desired_behavior: "At the end of /warp:setup (after all writes), if target has _warpos/ directory: (1) run build.js --root <target> to regenerate/verify the manifest; (2) run validate.js --root <target> --json to check honesty; (3) parse findings and surface a summary (drift, missing, unmanifested counts). Refuse non-zero exit on --strict-manifest flag; else warn only. Fail-open if build/validate errors out (don't break install on tooling glitches)."
scope:
  size: s
  risk_level: low
  complexity_drivers:
    - "Should the hook fire conditionally (target has _warpos/) or always?"
    - "Strict mode vs warn-only — default behavior decision"
    - "Subprocess invocation + JSON parsing of validate.js output"
scope_variants:
  minimal_safe:
    summary: "Post-install hook: run build.js + validate.js --json conditionally (only if target has _warpos/). Print summary. Warn on findings; never block install. No --strict-manifest flag."
    tradeoffs:
      - "Ships in <1 hour"
      - Operator must read warnings to know about coverage gaps
  recommended:
    summary: "Minimal-safe + --strict-manifest flag refuses install with non-zero exit when findings present. Plus tests covering both modes."
    tradeoffs:
      - Same ship time
      - CI can wire --strict-manifest as a gate
  expanded:
    summary: "Recommended + add the same post-install hook to scripts/warpos/update.js for symmetry."
    tradeoffs:
      - Doubles the wiring surface
      - update.js already has its own postflight composer that could absorb this
