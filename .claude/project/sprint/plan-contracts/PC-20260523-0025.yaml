  - surface: "scripts/warpos/manifest/validate.js (read — invoked by bootstrap with --strict for clean-state attestation)"
    evidence_level: verified_from_repo
  - surface: "scripts/warpos/views/regenerate.js (read — bootstrap may invoke to materialize generated .claude/commands and .claude/agents views post-copy)"
    evidence_level: verified_from_repo
  - surface: ".claude/settings.json (modify — rewrite hook command paths from scripts/hooks/*.js to _warpos/hooks/*.js)"
    evidence_level: verified_from_repo
  - surface: "_warpos/ zone (create — destination for framework-owned content in product mode)"
    evidence_level: verified_from_repo
    notes: "Currently only MANIFEST.json exists at _warpos/ root in canonical; product installs have no _warpos/ at all."
  - surface: "scripts/warp-setup.js (modify — call bootstrap.js when install detects an upgrade path from pre-_warpos to _warpos schema)"
    evidence_level: inferred_from_repo
    notes: "Discovery integration is the optional polish layer; bootstrap stands alone as a standalone CLI first."
  - surface: "framework-installed.json (read — used to detect existing install version and schema)"
    evidence_level: verified_from_repo
current_behavior:
  evidence_level: verified_from_repo
  notes: "scripts/warpos/manifest/ has build.js, validate.js, test-build.js, test-validate.js. scripts/warpos/views/ has regenerate.js, test-regenerate.js. Canonical _warpos/ contains only MANIFEST.json (1939 paths, 0 unmanifested). DreamTeam product repo has zero _warpos/ directory. No bootstrap.js exists. There is no automated path from a v0.8.x install (scripts/hooks/, no _warpos/) to a v0.9+ install (_warpos/ zone with framework-owned content). A maintainer wanting to migrate Jobzooka or DreamTeam would have to hand-create _warpos/, copy content in, regenerate MANIFEST, rewrite settings.json hook refs — all error-prone."
desired_behavior: "node scripts/warpos/manifest/bootstrap.js [--root <dir>] [--source <canonical-clone>] [--force] [--dry-run] [--json] performs the migration end-to-end: (1) detect canonical-vs-product mode from the target's framework-installed.json or absence thereof; (2) refuse if _warpos/ already exists without --force; (3) copy framework-owned content from the source canonical (scripts/hooks → _warpos/hooks, templates, schemas, reference, settings/defaults) into the target's _warpos/; (4) invoke build.js to generate initial _warpos/MANIFEST.json with canonical-vs-product sourcePrefix; (5) rewrite .claude/settings.json hooks block — every command path that starts with scripts/hooks/ becomes _warpos/hooks/; (6) optionally invoke views/regenerate.js to materialize .claude/commands and .claude/agents from _warpos/; (7) run validate.js --strict and report clean-state attestation; (8) emit a bootstrap report. --dry-run prints the plan without writing."
scope:
  size: m
  risk_level: medium
  complexity_drivers:
    - "Canonical-vs-product detection (heuristics: framework-installed.json presence, _warpos/ absence, scripts/hooks/ presence)"
    - "Safe-copy semantics with --force discipline (no overwrites without explicit flag, but new files always copied)"
    - "Settings.json hook-path rewrite without breaking other hook config fields (allow lists, deny lists, env)"
    - "Idempotency — running bootstrap twice on the same install must be a no-op (or refuse cleanly)"
    - "Source canonical-clone discovery — bootstrap needs to know where to copy FROM. Options: --source flag, sibling-clone heuristic, framework-installed.json#source field"
scope_variants:
  minimal_safe:
    summary: "Ship bootstrap.js as a standalone CLI with --root, --source, --force, --dry-run flags. Manual invocation only. No /warp:setup integration. Test against canonical-as-workspace (no destructive change) + dry-run against DreamTeam. Source-canonical-clone defaults to sibling-clone heuristic; --source overrides."
    tradeoffs:
      - "Ships fast (~1 day)"
      - Maintainer invokes manually for each product migration
      - Migrations are predictable and auditable
      - "/warp:setup integration deferred"
  recommended:
    summary: "Minimal-safe + auto-detection in /warp:setup. When /warp:setup runs on an existing install that lacks _warpos/, it offers (with --apply flag) to invoke bootstrap. Plus a comprehensive test suite covering: canonical mode (refuse — already has _warpos), product mode (clean migration), product mode with --force, dry-run output shape, settings.json rewrite correctness, hook-path edge cases (env vars, conditional matchers)."
    tradeoffs:
      - "Sprint duration ~1.5 days"
      - "Auto-detection in /warp:setup is the right UX but adds one integration point"
      - "Test surface ~15-20 test cases"
  expanded:
    summary: "Recommended + actual migration of one real product (DreamTeam) as part of sprint acceptance. Plus a /warp:bootstrap dedicated skill wrapper. Plus rollback support (bootstrap-snapshot directory restored by /warp:rollback)."
    tradeoffs:
      - "Real-product migration touches DreamTeam repo (cross-repo commit)"
      - "Rollback is its own sub-feature — could blow up scope"
      - "Best deferred to a Sprint 6+ slot if Sprint 5 stays focused"
assumptions:
  safe:
    - "Sprint runs on a sprint/SP-20260522-004 branch (orchestrator refuses main without --allow-main)"
    - "build.js, validate.js, regenerate.js are stable per Sprint 1 retrospective (63 tests passing)"
    - "Canonical _warpos/ structure (commands/, agents/, hooks/, schemas/, templates/, settings/defaults.json, reference/) is the migration target shape (per ROADMAP lines 199-228)"
    - framework-installed.json captures the prior install snapshot used for upgrade-path detection
  unsafe:
    - "Source-canonical-clone discovery: sibling-clone heuristic may fail when the canonical clone is at an unexpected path"
    - "Settings.json hook-path rewrite assumes hooks block follows the well-known schema (paths in command strings) — exotic hook configs could break"
    - "Existing user-customized hooks in scripts/hooks/ would be left behind by the copy (treated as user-owned per ownership model — but bootstrap should at least warn)"
    - "Canonical _warpos/ source migration (settings/defaults.json doesn't yet exist per ROADMAP Sprint 6 backlog) — bootstrap may copy from a partial source"
  needs_user_or_beta_review:
    - "Should bootstrap migrate canonical to canonical mode too (regenerate self-references), or only product mode? Probably product-only — canonical already has _warpos/."
    - "If the target has uncommitted changes, should bootstrap refuse, snapshot-then-proceed, or proceed silently?"
    - "DreamTeam currently has no _warpos/ — should bootstrap.js be the recommended migration path for the DreamTeam team or a maintainer-only tool?"
open_questions:
  blocking: []
  non_blocking:
    - "Rollback support — defer to a separate sprint or include?"
    - "/warp:bootstrap skill wrapper or just the CLI?"
    - "Should bootstrap touch _requirements/ and _docs/ at all (product-owned content) or leave entirely alone?"
    - "If canonical source has changes uncommitted, should bootstrap refuse to copy from a dirty source?"
non_goals:
  - "Do NOT migrate _requirements/ or _docs/ — those are project-owned content per the ownership model"
  - "Do NOT auto-execute against multiple products in one invocation — single target per run"
  - "Do NOT push or commit to the target — bootstrap only modifies the working tree; operator commits"
  - "Do NOT delete legacy scripts/hooks/ in the target — leave for operator cleanup (manifest will mark them user-owned or unmanifested)"
  - "Do NOT build the /warp:bootstrap skill if minimal_safe is the chosen scope variant"
  - "Do NOT add rollback support in this sprint (expanded scope only)"
  - "Do NOT integrate with central-WarpOS architecture (parked in Later: Platform Bets)"
