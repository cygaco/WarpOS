  - "Unit + integration tests"
  - "/warp:setup discovery hook (recommended variant only)"
high_level_story_candidates:
  - "As a maintainer migrating Jobzooka, I run `node scripts/warpos/manifest/bootstrap.js --root <jobzooka>` and get a clean _warpos/ zone with a fresh MANIFEST.json, rewritten settings.json hook paths, and a green validate.js --strict attestation."
  - "As a maintainer running /warp:setup on a pre-_warpos install, I'm prompted to bootstrap automatically (with --apply or --dry-run) rather than discover the gap days later."
  - "As a maintainer running bootstrap twice on the same install, the second run refuses cleanly (or is a no-op with --force) — never silent-clobber."
  - "As a CI gate, I can run bootstrap --dry-run --json to verify a planned migration before merge."
granular_story_candidates:
  - "Detect canonical-vs-product mode from framework-installed.json + _warpos/ presence"
  - Refuse without --force when _warpos/ exists
  - "Copy framework-owned content from source canonical's framework/ into target _warpos/ (preserving structure)"
  - Generate initial _warpos/MANIFEST.json via build.js with correct sourcePrefix
  - "Rewrite .claude/settings.json hooks block — substitute scripts/hooks/ → _warpos/hooks/ in command strings"
  - Validate post-state with validate.js --strict and surface findings
  - "Emit bootstrap report (BOOTSTRAP_REPORT.md or stdout) + --json for machine-readable output"
  - Dry-run mode shows the full plan without writing
  - "Idempotency test: running bootstrap twice on a clean install must refuse (or no-op)"
  - "/warp:setup discovery: call bootstrap when install detects upgrade path (recommended scope only)"
  - "Source-canonical-clone discovery: --source explicit, sibling-clone heuristic, framework-installed.json#source field fallback"
