sprint: SP-20260522-004
source_request: "Implement scripts/warpos/manifest/bootstrap.js — the migration bootstrap script that converts an existing WarpOS install (Jobzooka, DreamTeam, canonical-as-workspace) to the new _warpos/ architecture. Sprint 1 architecture-core's last mechanical piece; named in ROADMAP.md Pickup Queue as Sprint 5 candidate."
source_request_verbatim: "Implement scripts/warpos/manifest/bootstrap.js — migration script that converts an existing WarpOS install (Jobzooka, DreamTeam, canonical-as-workspace) to the new _warpos/ architecture. Creates _warpos/ zone at product root, copies framework-owned content in (scripts/hooks → _warpos/hooks, templates, schemas, reference, settings/defaults), generates initial _warpos/MANIFEST.json via build.js, updates .claude/settings.json hook references to point at _warpos/hooks/, runs validator.js --strict to confirm clean migration. Canonical-vs-product detection (canonical = self-references, product = _warpos source-of-truth). Safe-copy semantics (no overwrites without explicit flag). Sprint 5 candidate from ROADMAP.md Pickup Queue (lines 45, 138, 297-303). Output: scripts/warpos/manifest/bootstrap.js + comprehensive tests + integration with /warp:setup discovery."
request_type: feature_add
interpreted_intent: "Sprint-1's architecture-core landed schema v1 + generator + validator + regenerator + settings compiler + structural gates against canonical itself, but installed products (Jobzooka, DreamTeam) still have no _warpos/ zone. A one-shot bootstrap script materializes that zone in an existing install: creates _warpos/, copies framework-owned content (hooks, templates, schemas, reference, settings/defaults) into it, generates the initial MANIFEST.json via build.js, rewrites .claude/settings.json hook paths to point at _warpos/hooks/*.js, then runs validator.js --strict for a clean-state attestation. Canonical-vs-product detection branches behavior (canonical sources self-reference; product sources point at _warpos/). Safe-copy semantics refuse to overwrite without --force."
user_or_business_outcome: "Rolling _warpos/ out to real products (Jobzooka, DreamTeam) becomes a single command instead of a multi-day manual migration. The new ownership/regeneration/validation system gets exercised under real load — which surfaces edge cases that canonical-only testing can't. Sprint 5 candidates after this (install/release reliability batch, Sprint 6 polish) all build on the assumption that _warpos/ exists in products."
