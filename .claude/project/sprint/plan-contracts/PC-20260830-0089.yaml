current_behavior:
  evidence_level: verified_from_repo
  notes: "At 417147d: suite 408/408 with real dependencies (independently confirmed by a blind third-party run); lint exit 0 / 0 violations on the shipped file; four routing repairs execution-proven by observed mutation (Q3). Yet five qualifying lanes (two claim-truth, two adversarial, one teeth; two model families; identical artifact-only briefs) returned four fail / one pass: the document carries sentences independent readers graded false — the sentence corrected in S-05 (L13-17, both Q1 lanes agree), class-vs-enumeration closure claims (L7-11, L64-73, L115-116, L171-174 — codex-right, α-confirmed at the pin), an inaccurate residual disclosure (L154-157, AP-17), a shipped A5 clause contradicted by the document itself and pinned by the lint, plainly-worded false custody claims accepted at exit 0 (a designed ceiling; disclosed at L116/L241), three lint bypasses (F-Q2I-1/2/3). Two Q1 lanes disagreed on nine of fourteen items and were wrong in opposite directions — over-grading (S19, S24, S31) and under-grading (L7-11, L64-73, L115-116, L171-174) — so the union was adjudicated per sentence, not per lane."
desired_behavior: "Every shipped sentence in CUSTODY.md is true of the bytes at its mechanism's grain, with class-level claims either backed by class-level mechanisms or restated at character/site grain; the A5 clause and its verbatim bind agree with the two source files; the `## Asserted` region is scanned (or the sentence saying it is scanned is corrected — one defect, one criterion); Rule 4b's duplicate-paragraph bypass closed with an observed falsifier; every correction drafted AFTER the attack that would falsify it and graded by an independent reader before it ships; TRANSFORM-ROUTING.md gains a drift enforcer; S5-4's near-miss population re-derived and run through the matcher as built at the new pin, sha recorded."
