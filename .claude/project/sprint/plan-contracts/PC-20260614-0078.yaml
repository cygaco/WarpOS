  confidence: high
  evidence_gaps:
    - "Exact test-instance location + lifecycle (reuse/recreate/teardown) pinned at design-lock."
    - "The admin-panel registry's relationship to the eventual item 23 /panel:* registry (alias-beside vs shadow) pinned at design-lock."
  fail_reasons: []
