  required: true
  likely_founder_rejection_risks:
    - "If /admin:preview is slow or flaky (scaffold + npm install + dev boot), the operator reads it as 'doesn't work' — reuse-an-existing-instance + clear progress/ETA are load-bearing."
  overbuild_risks:
    - "Building item 23 /panel:* here, or a full live Playwright design-quality run, would over-scope — both are deferred."
    - A heavy bespoke instance-manager when reusing the proven scaffold/portfolio path suffices.
  missing_context_risks:
    - "The routing/registry file is load-bearing — it MUST be cross-provider-reviewed (guardrail b), not shipped as a solo draft."
    - "Path keys must round-trip through the SOURCE registry + build.js, or the generated view orphans them."
plan_quality:
