  type: branch
  value: sprint/SP-20260614-002
  isolation_notes: "Dedicated sprint branch off the local session/main-equivalent; builder dispatch may use isolation worktrees (branch from current HEAD — heed the stale-worktree-base gap); no remote push without explicit approval."
