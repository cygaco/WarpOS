resume_instructions: "Design-lock pins the test-instance location/lifecycle + the registry shape (alias-beside item 23 /panel:*); product-lead owns the requirements; mirror the /cockpit:readiness + /models:router opener patterns. Heed item-24 guardrails: source-not-generated path keys (paths.registry.json -> build.js regen), cross-provider-review the routing/registry file, single authoritative writer for instance state, respect dispatch invariants, rebuild maps + regen both manifests. Then mint tickets for the four workstreams and execute. Seam: forward-compatible with item 23 /panel:*; run-in-product (open a PRODUCT's panel, not WarpOS)."
