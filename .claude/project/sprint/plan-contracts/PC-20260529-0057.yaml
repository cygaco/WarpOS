  value: null
  isolation_notes: "Single working tree — the rename is one coherent cross-file change set; worktree isolation would fragment the regen+manifest+views step that must stay atomic."
beta_review:
  required: true
  likely_founder_rejection_risks:
    - Operator may prefer hard-rename with NO alias shims at all.
    - "Alias scope chosen (4 high-traffic) may be larger or smaller than desired."
  overbuild_risks:
    - "Building the expanded generic alias-resolution layer when hard-rename + targeted shims suffice."
  missing_context_risks:
    - "Downstream products reference check: — unclear if coordinated update is needed or aliases suffice (cross-project boundary)."
plan_quality:
  status: needs_design
  confidence: high
  evidence_gaps:
    - "Exact count + location of every check:/issues:scan caller — design discovery will grep the full tree."
    - "Whether any caller constructs the skill name dynamically (non-literal) and would evade a literal sweep."
