sprint: SP-20260525-003
source_request: "Orchestrator→Beta bridge — sprint 1 of milestone 0.11.0 Sprint Workflow Honesty. Choose and ship one of two designs: (a) dispatch-from-subprocess pattern that lets spawnSync-d node reach in-process Beta teammates, or (b) halt-at-each-Beta-boundary pattern where the orchestrator pauses at each Phase boundary and resumes after operator-driven Beta consult."
source_request_verbatim: "Orchestrator→Beta bridge — sprint 1 of milestone 0.11.0 Sprint Workflow Honesty. /sprint:full currently emits placeholder DECIDE events without actual SendMessage round-trip to Beta — the subprocess can't easily reach in-process teammates. Design + ship one of: (a) dispatch-from-subprocess pattern (orchestrator runs as spawnSync-d node, gains a bridge to in-process teammates), or (b) halt-at-each-Beta-boundary (orchestrator halts at each Phase boundary, operator runs Beta consult interactively, then resumes). Either way, _docs/sprint/AUTONOMY.md cadence becomes enforced. Autonomy: aggressive. Mode: adhoc."
request_type: architecture_change
interpreted_intent: "`scripts/sprint/full.js` currently writes `sprint_full_beta_consult` events with placeholder verdicts (DECIDE) without actually invoking Beta via SendMessage. The subprocess can't reach in-process teammates because the Agent/SendMessage tool surface lives in the Claude Code runtime, not in node-spawned subprocesses. Two architectures resolve this: (a) build a subprocess-to-runtime bridge (file-drop-and-poll, named pipe, HTTP localhost) so the orchestrator's subprocess can drop a consult-request and the runtime picks it up + dispatches Beta + drops the verdict back, OR (b) restructure /sprint:full so it halts the subprocess at each Beta boundary, exits with a checkpoint, and the operator (or Alpha in the foreground) drives the Beta consult interactively before resuming. Design pass chooses (a) or (b) based on operator UX + crash-recovery + simplicity tradeoffs."
user_or_business_outcome: "Every `sprint_full_beta_consult` event in `events.jsonl` reflects an actual SendMessage round-trip to Beta with a real verdict (DECIDE | DIRECTIVE | ESCALATE) and real reasoning. The operator can `grep events.jsonl | jq` to audit β-consultation cadence and see it matches `_docs/sprint/AUTONOMY.md`'s declared policy. ESCALATE verdicts halt the sprint reliably. The autonomy ladder rungs become load-bearing instead of decorative."
affected_surfaces:
  - surface: scripts/sprint/full.js
    evidence_level: verified_from_repo
    notes: "Contains current placeholder beta-consult emission. Either rewrite to call bridge (option a) or restructure to halt at boundaries (option b). Halt mechanism + checkpoint format already exists per existing tickets_pending halt pattern."
  - surface: "scripts/dispatch/send-message.js (or equivalent bridge surface)"
    evidence_level: unknown
    notes: "Option (a) requires a subprocess→runtime channel. Investigate during design: does any existing script already bridge subprocess work to in-process tools? If so, reuse; otherwise design from scratch."
  - surface: ".claude/agents/00-alex/beta.md"
    evidence_level: verified_from_repo
    notes: "Beta's agent spec — receiving end of consultations. May need a documented input contract for sprint-phase-boundary consults (already exists per CLAUDE.md § β consultation protocol but verify completeness)."
  - surface: _docs/sprint/AUTONOMY.md
    evidence_level: verified_from_repo
    notes: "Currently declares cadence as aspirational. After this sprint: remove `aspirational` disclaimer (or move to historical note). Add: 'enforced by /sprint:full via [chosen pattern]; verify via paths.eventsFile | jq 'kind=sprint_full_beta_consult'`."
  - surface: scripts/sprint/checkpoint.js
    evidence_level: verified_from_repo
    notes: "Option (b) requires checkpoint format to capture mid-phase Beta-pending state. Today checkpoints support phase-boundary halts (tickets_pending) — extend for beta-pending."
  - surface: scripts/sprint/test-sprint-full.js
    evidence_level: verified_from_repo
    notes: "Add tests: (1) consult-request format validates; (2) ESCALATE verdict triggers hard halt; (3) DIRECTIVE verdict updates downstream behavior; (4) DECIDE verdict continues unchanged; (5) bridge timeout (option a) or resume contract (option b) tested."
  - surface: "paths.eventsFile (events.jsonl)"
    evidence_level: verified_from_repo
    notes: "Event consumer-side. New event subtype `sprint_full_beta_consult` schema: { sprint_id, phase_boundary, verdict, beta_message, alpha_request, latency_ms, model }. Today only an empty placeholder."
current_behavior:
  evidence_level: verified_from_repo
  notes: "Per ROADMAP.md milestone 0.11.0 entry + 'Sprints feeding this' bullet 1: '`/sprint:full` emits DECIDE events without actually SendMessage-ing Beta — the subprocess can't easily reach in-process teammates.' Per existing 'open' note in roadmap section 'Shipped in SP-20260522-001/002/003': 'orchestrator emits the event without actually SendMessage-ing Beta. Honest halt approach pending a dispatch-from-subprocess design'. Honest halts (Phase 2 tickets_pending, Phase 3 no_tickets_ready, Phase 4 no_tickets_done) ARE implemented and tested. The gap is specifically the Beta SendMessage round-trip."
desired_behavior: "After sprint completion: (1) chosen pattern (a or b) is implemented end-to-end in /sprint:full; (2) Every Phase-boundary Beta-consult produces a real `sprint_full_beta_consult` event with non-placeholder verdict + beta_message + latency_ms; (3) ESCALATE verdict triggers `sprint_full_halt` with `halt_reason: beta_escalate`; (4) DIRECTIVE verdict applies the directive to downstream phase behavior (e.g., 'skip Phase 3, halt for operator review'); (5) DECIDE verdict continues unchanged; (6) `_docs/sprint/AUTONOMY.md` Beta cadence line removes 'aspirational' disclaimer; (7) `scripts/sprint/test-sprint-full.js` includes a Beta-consult contract test that exercises all 3 verdict paths."
scope:
  size: l
  risk_level: medium-high
  complexity_drivers:
    - "Architectural choice between two valid patterns (a) bridge vs (b) halt — design has real tradeoff"
    - "Option (a) introduces a new IPC surface — must handle timeouts, crashes, security"
    - "Option (b) changes the resumption contract — checkpoint format extends, operator UX changes"
    - "Testing requires either Beta dispatch mock or actual β invocation (slow + costs API budget)"
    - "Backward-compatibility: existing sprint full-reports have placeholder events — should we backfill or just start fresh?"
scope_variants:
  minimal_safe:
    summary: "Option (b) halt-at-each-Beta-boundary. /sprint:full halts at each Phase boundary with `halt_reason: beta_consult_pending`, writes checkpoint with `pending_consult: { phase, alpha_request_payload }`. Operator runs `/sprint:full --sprint <id> --beta-verdict DECIDE|DIRECTIVE|ESCALATE --beta-message '<text>'` to provide the verdict and resume. Implementation: extend CLI args, extend checkpoint schema, extend halt-report COPY. No bridge IPC complexity."
    tradeoffs:
      - "Pro: minimal architectural change — reuses halt + resume primitives"
      - "Pro: zero IPC surface; no crash/timeout/security concerns"
      - "Pro: operator stays in the loop on every Beta consult (acceptable for current sprint volume)"
      - "Con: more operator keystrokes per sprint (~4 extra halts/resumes per sprint)"
      - "Con: 'autonomous orchestrator' becomes 'semi-autonomous with operator-driven Beta consults'"
  recommended:
    summary: "Option (a) dispatch-from-subprocess via simple file-drop polling. Orchestrator drops `consult-request-<phase>.json` in `paths.betaInbox/`, polls `paths.betaInbox/consult-verdict-<phase>.json` with timeout (default 5min). Runtime (smart-context or a new poller-hook) picks up requests, dispatches Beta via Agent, writes verdict. No long-running listener; file-drop is cron-able + tracked via existing event sinks. Includes timeout halt with `halt_reason: beta_consult_timeout` and clear remediation."
    tradeoffs:
      - "Pro: orchestrator stays autonomous — no operator interruption per Beta consult"
      - "Pro: file-drop pattern is observable + crash-safe (lost verdict file = retry)"
      - "Pro: bridge surface is small — JSON files, no network or named pipes"
      - "Con: runtime-side poller hook is new infrastructure — needs design + test"
      - "Con: cross-process state coordination has classic race-condition pitfalls (mitigated by single-writer + atomic rename)"
  expanded:
    summary: "recommended + persistent runtime poller that watches `paths.betaInbox/` continuously (PostToolUse hook + background) + Beta-consult batching (multiple consult-requests dispatch in parallel) + verdict caching (skip Beta if previous consult on same phase + same hashed input verdicts DECIDE within last N minutes) + telemetry dashboard (per-sprint Beta consult latency histogram)."
    tradeoffs:
      - "Pro: optimizes the autonomous path — Beta consults are fast + cached"
      - "Pro: caching reduces β API spend"
      - "Con: ~3× the surface area; background poller risks zombie processes"
      - "Con: caching introduces correctness risk — stale verdict on changed input"
assumptions:
  safe:
    - "Existing halt + resume primitives in /sprint:full are reliable — beta_consult_pending is a new halt_reason but uses the same machinery"
    - "`paths.eventsFile` is the right place for `sprint_full_beta_consult` events — already declared in CLAUDE.md § Memory + Prompt Pipeline"
    - "Beta's input contract (`.claude/agents/00-alex/beta.md`) accepts arbitrary sprint-context payloads"
    - "Operator is willing to absorb 4 extra halts per sprint (option b) OR willing to trust autonomous bridge (option a) — design phase picks based on operator preference"
  unsafe:
    - "Option (a)'s runtime-side poller is new — investigate whether smart-context or another existing hook can host it without becoming a perpetual-running process"
    - Beta dispatch via Agent tool from a subprocess context may have permission / authentication / quota constraints not yet tested
    - "ESCALATE verdict must reliably halt — test must prove this; an unhandled ESCALATE that continues silently would defeat the milestone"
  needs_user_or_beta_review:
    - "Choose between option (a) and option (b) — operator decision. Recommend (b) minimal_safe for first ship, (a) recommended if operator UX is the bigger concern"
    - "Confirm Beta consult cadence: at all 4 Phase boundaries OR only at the 2 most consequential (post-plan, post-execute)?"
    - "Backward compat: leave existing placeholder events in history OR scrub via migration?"
open_questions:
  blocking:
    - "Pick option (a) bridge or option (b) halt-at-boundary — affects entire design"
  non_blocking:
    - "Should Beta consults be sync (block until verdict) or async (continue with default DECIDE if no verdict within N seconds)?"
    - "How are Beta consult costs tracked — per-sprint budget, per-session budget, no tracking?"
    - "Should the verdict format be more structured (typed reasoning fields) or stay free-form text?"
non_goals:
  - "Implementing the Beta-honesty enforcement skill (`/check:sprint-beta-honesty`) — that's SP-20260525-004 (sprint 2 of 0.11.0)"
  - "Building Beta-consult batching, caching, or dashboard (expanded scope, deferred)"
  - "Migrating historical placeholder events in `events.jsonl` (deferred; leave as is for traceability)"
  - "Adding new Beta personas or roles — Beta's existing role + agent spec is the consultation surface"
  - "Changing the AUTONOMY.md cadence policy itself — only enforcement mechanism changes"
  - "Pushing to remote — operator-scoped"
