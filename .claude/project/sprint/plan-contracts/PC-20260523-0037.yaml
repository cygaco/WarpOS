  - "As Alpha (running /sprint:full), I consult Beta at each Phase boundary and receive a real verdict that shapes downstream behavior."
  - "As the operator, I see in `events.jsonl` that every Beta consult is real (non-placeholder verdict + message + latency) — the cadence I see in AUTONOMY.md matches reality."
  - "As Beta, when I ESCALATE, the sprint halts reliably and reports my concern clearly to the operator."
  - "As the operator, ESCALATE is the recovery contract — read the halt report, address Beta's concern, then resume."
