requirement_areas:
  - "R-1 epsilon-runtime parent-timeout grace: parent spawnSync bound exceeds the child wrapper's internal bound by 30-60s at both spawn sites so the child's graceful death-record write wins the race"
  - "R-2 review-fallback shape registration: the sanctioned --review-fallback lane is a registered/exempted valid shape under the resolver so a future blocking/ENFORCE flip does not exit-1 it; E-DISPATCH-SHAPE-001 plan §12.2 W2 entry gate gains the corresponding precondition line"
  - "R-3 registry-derived build-chain gating: dispatch-claude.js worktree-isolation gate + fallback refusal consult the registry class (validateDispatchForClass / build_chain_worker), not only the hardcoded BUILD_CHAIN_ROLES literal"
  - "R-4 spoofed-ts window clamp (TWO-SITE, β design directive 2026-06-11): BOTH sprint-hook-coverage.js AND sprint-manager-consult.js window derivations clamp bounds to sane horizons (sprint created_at ± hard cap, outlier/extreme timestamps discarded) so a planted 1970/2099 ts cannot widen the window in either checker"
  - "R-5 sprint_id-preferring correlation: hasBackingDispatchRecord (sprint-hook-coverage.js) and the equivalent in sprint-manager-consult.js prefer rec.sprint_id match when present, falling back to time-window only for legacy records"
  - "R-6 programmatic window-parse refusal: verifyGauntlet() refuses unparseable since/until inside the library function (throw/refuse, never silent whole-ledger degrade); CLI behavior preserved"
