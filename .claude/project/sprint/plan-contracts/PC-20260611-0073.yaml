interpreted_intent: "Close the six real findings from the 2026-06-10 cross-family (gemini) re-reviews of W0+W1 (diff 4d7301f...ba61a2f) and SP-20260610-005 (diff a05b1ef...d85e9a9) — dispatch-layer correctness and enforcement-integrity fixes — and prove them with a three-family gauntlet (gemini diff lanes + claude execution-access lanes + GPT 2nd pass)."
user_or_business_outcome: "The dispatch/enforcement layer stops lying: the epsilon spawn timeout headroom actually works, the sanctioned review-fallback lane survives the W2 ENFORCE flip, build-chain role gating derives from the registry (no unregistered-role bypass), and the F-1/F-3 coverage predicates cannot be spoofed by planted timestamps, concurrent sprints, or garbage windows."
affected_surfaces:
  - surface: "scripts/sprint/epsilon-runtime.js (spawnAgent parent timeout, lines ~476/500)"
    evidence_level: verified_from_repo
    notes: "foregroundAwareTimeout passed as spawnSync's own timeout while the child wrapper self-bounds at the same 540s — parent SIGTERM races the child's graceful death-record write."
  - surface: "scripts/dispatch-claude.js (--review-fallback lane + BUILD_CHAIN_ROLES set, lines ~103/182/225/358)"
    evidence_level: verified_from_repo
    notes: "Fallback shape-mismatch advisory suppressed only when !blocking (bricks under future ENFORCE); BUILD_CHAIN_ROLES is a hardcoded literal set, not registry-derived."
  - surface: "scripts/checks/sprint-hook-coverage.js (window derivation ~191, hasBackingDispatchRecord ~88)"
    evidence_level: verified_from_repo
    notes: "Window from untrusted events.jsonl ts (no clamp); correlation by time window only, ignores rec.sprint_id."
  - surface: "scripts/checks/sprint-manager-consult.js (same correlation shape)"
    evidence_level: verified_from_repo
    notes: Same time-window-only correlation as sprint-hook-coverage.
  - surface: "scripts/dispatch/gauntlet-verify.js (verifyGauntlet programmatic API, CLI guard ~233)"
    evidence_level: verified_from_repo
    notes: "Unparseable-window refusal is CLI-only; programmatic callers passing garbage since/until silently degrade to the forbidden whole-ledger scan."
  - surface: "_planning/epics/E-DISPATCH-SHAPE-001.md §12.2 (W2 entry gate)"
    evidence_level: verified_from_repo
    notes: "Gains: 'the sanctioned fallback lane is shape-registered before ENFORCE flips'."
current_behavior:
  evidence_level: verified_from_repo
  notes: "All six findings re-verified live in canonical on 2026-06-11 (post-mint grounding pass): (1) parent timeout == child bound at both spawn sites; (2) fallback advisory suppressed only when !blocking; (3) BUILD_CHAIN_ROLES literal Set at dispatch-claude.js:103; (4) no ts clamp on window derivation; (5) hasBackingDispatchRecord(dispatchRecords, role, minTsMs, maxTsMs) has no sprint_id param; (6) parse refusal in CLI block only."
desired_behavior: "(1) Parent spawn bound = child bound + 30-60s grace (or backstop-only when child self-bounds) at BOTH epsilon-runtime spawn sites. (2) The sanctioned --review-fallback lane is registered/exempted as a valid shape so the W2 ENFORCE flip cannot exit-1 it; W2 entry gate text appended to E-DISPATCH-SHAPE-001 §12.2. (3) Worktree-isolation gate + fallback refusal derive build-chain membership from the registry class (validateDispatchForClass/build_chain_worker), with the literal set at most a fallback. (4) Sprint window bounds clamped to sane horizons (sprint created_at ± hard cap; outlier ts discarded). (5) hasBackingDispatchRecord prefers sprint_id match when the record carries one (post-W0 records do) in BOTH sprint-hook-coverage.js and sprint-manager-consult.js. (6) verifyGauntlet() itself refuses unparseable since/until (throw/refuse), CLI message preserved. Each fix lands with regression tests; existing suites stay green."
