  - "Author scripts/guides/registry.js: deterministic _guides/*.md frontmatter -> _guides/registry.json; expose read helpers."
  - "Author .claude/commands/guides/integrate.md: read registry, place each guide at its anchor in spinup/lastmile, append a guide-integration.jsonl record per placement; read-before-write idempotency + conflict detection."
  - "Author .claude/commands/guides/coverage.md + scripts/checks/guides-coverage.js: assert every guide anchored, every anchor live in bootstrap, no orphans/dangles; exit 1 on any gap."
  - "Backfill anchor frontmatter onto the 7 guides; generate registry.json."
  - "Run organize, then integrate (mutate spinup/lastmile + write jsonl), then coverage to green."
workstream_candidates:
  - "guides:organize + registry helper + anchor backfill"
  - "guides:integrate + recording system"
  - "guides:coverage enforcer"
  - "dogfood run (organize -> integrate -> coverage) + verify green"
