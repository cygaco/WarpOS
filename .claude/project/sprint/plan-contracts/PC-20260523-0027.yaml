sprint: SP-20260522-005
source_request: "Wire /warp:update --status into scripts/warpos/update.js. The validator (scripts/warpos/manifest/validate.js --json) is shipped — add --status flag that spawns it and renders the JSON as a per-file table grouped by finding class."
source_request_verbatim: "/warp:update --status wires the validator. Validator (validate.js --json) is ready to consume; need to add --status to scripts/warpos/update.js and surface the JSON output as a per-file table. Sprint 6 polish from ROADMAP.md Pickup Queue."
request_type: feature_add
interpreted_intent: "scripts/warpos/manifest/validate.js --json already emits a structured payload with findings (missing/drift/unmanifested/user_modified/schema_violation) and ownerCounts. Sprint 6 wires this into scripts/warpos/update.js as an early-branch --status flag (like --rollback), so maintainers can run /warp:update --status against any install and get a human-readable diagnostic table — or pipe through --json for CI consumption. Exit 0 when clean, exit 1 when any finding present."
user_or_business_outcome: "Maintainers gain a single command to audit any WarpOS install's manifest honesty against its on-disk state — for Jobzooka, DreamTeam, or canonical itself. CI can wire this in as a release gate. Today the audit requires manually running validate.js with the right --root flag; the new wrapper is one canonical entry point."
affected_surfaces:
  - surface: "scripts/warpos/update.js (modify — add runStatusCli + --status early branch + exports)"
    evidence_level: verified_from_repo
  - surface: "scripts/warpos/manifest/validate.js (read — invoked as subprocess)"
    evidence_level: verified_from_repo
  - surface: "scripts/warpos/test-status-cli.js (new — smoke tests)"
    evidence_level: assumed_from_request
current_behavior:
  evidence_level: verified_from_repo
  notes: "scripts/warpos/update.js has --to (apply/dry-run) and --rollback early branches. No --status. Validators must be invoked directly via node scripts/warpos/manifest/validate.js --root <dir> --json."
desired_behavior: "node scripts/warpos/update.js --status [--target <dir>] [--json] [--strict] spawns validate.js --json under the hood. Human output: header (manifest path, root, pathCount, ownerCounts), then table per finding class (DRIFT / MISSING / UNMANIFESTED / USER_MODIFIED / SCHEMA_VIOLATION) with each item's path. JSON output: validator JSON augmented with mode=status. Exit 0 when total findings == 0, exit 1 otherwise. --target defaults to REPO_ROOT. --strict passes through to validate.js."
scope:
  size: s
  risk_level: low
  complexity_drivers:
    - "Subprocess spawn of validate.js with stdout capture + JSON parse"
    - "Fallback when target lacks scripts/warpos/manifest/validate.js (use canonical's)"
    - "Exit-code semantics: --status exits 1 on any finding (not just strict findings) so CI can wire it in"
scope_variants:
  minimal_safe:
    summary: "Just the --status flag + table rendering + smoke tests. No additional UI polish."
    tradeoffs:
      - Ships in a few hours
      - "No /warp:status slash command wrapper"
  recommended:
    summary: "Minimal-safe + clean exit-code semantics (0 clean, 1 any finding) + canonical-fallback when target lacks validate.js + test fixtures covering clean/drifted/missing-validate cases."
    tradeoffs:
      - Same ship time
      - Clear contract for CI
  expanded:
    summary: "Recommended + new /warp:status skill wrapper + diff against last known-good manifest (history table)"
    tradeoffs:
      - Skill wrapper is straightforward
      - Diff-against-history needs storage and is out of scope for this sprint
assumptions:
  safe:
    - "validate.js --json emits stable schema (ownerCounts, findings.{missing,drift,unmanifested,user_modified,schema_violation})"
    - "update.js arg parser is the right place for --status (matches --rollback pattern)"
    - "Sprint runs on a sprint/SP-20260522-005 branch (orchestrator refuses main)"
  unsafe:
    - "Targets that lack validate.js are rare in practice (only fresh installs without warpos infrastructure) — but fallback handles it"
  needs_user_or_beta_review: []
