source_request_verbatim: "Dreamteam verified-open guard batch. ACTIONABLE (execution-verified reproducing): W-26 — scope-contract-guard: an EMPTY allowedFiles:[] silently blocks ALL builder writes; the guard's hasScopeContract substring-matches the prompt without parsing the JSON so it can't even SEE the empty array. Fix: parse when parseable, LOUD error on empty allowedFiles ('empty allowedFiles blocks everything — declare files or use forbiddenFiles'), fail-closed wording when unparseable. W-14 — paths.portfolioRegistry points at the dead project-local file; the REAL registry lives at ~/.warpos/portfolio.json. Fix in the SOURCE framework/paths.registry.json, run scripts/paths/build.js, VERIFY the key survived in .claude/paths.json + lib/paths.generated.js (P-058), then grep ALL portfolioRegistry consumers and confirm they handle the HOME-anchored path. CLOSED already-fixed: W-5 (read-only node -e already allowed), W-13 (commit-message args already stripped), W-28 (install.ps1 header already checked). PLANTED tests per fix; goldens before/after on every touched GUARD (HIGH blast — fires every turn)."
request_type: bug_fix_batch
interpreted_intent: "Close two real, execution-verified guard/path defects: a scope-contract guard that can't see an empty allowedFiles array (so it silently bricks builder writes), and a paths key pointing at a dead registry file. Do it without regressing the every-turn guards (golden-first). The other three register items are already-fixed-in-canonical — close them with citations, don't rebuild."
user_or_business_outcome: "A builder dispatched with an empty allowedFiles:[] gets a LOUD, actionable error at dispatch time instead of silently failing every write; and /portfolio:* skills read the REAL registry at ~/.warpos/portfolio.json instead of a dead project-local path. Each guarded by a planted-violation test; the every-turn guards stay green (golden-first)."
affected_surfaces:
  - surface: "W-26 — scripts/hooks/scope-contract-guard.js (hasScopeContract + the build-chain block path)"
    evidence_level: verified_from_repo
    notes: "EXECUTION-CONFIRMED: hasScopeContract() (L81) is `/scopeContract|allowedFiles|forbiddenFiles|.../.test(prompt)` — a SUBSTRING match on the prompt text. It never parses the scopeContract JSON, so a prompt carrying `\"allowedFiles\": []` (empty) PASSES (the literal 'allowedFiles' is present) → dispatch proceeds → the empty array then silently blocks ALL builder writes at write-enforcement time. FIX (lead-sharpened): when the scopeContract IS parseable from the prompt, inspect allowedFiles — if it's an EMPTY array (and no forbiddenFiles), emit a LOUD block with an actionable reason ('empty allowedFiles blocks ALL writes — declare the files you intend to write, or use forbiddenFiles to blocklist instead'); when the scopeContract is present-but-unparseable, fail-closed (block with a 'scopeContract present but unparseable' reason) rather than waving it through on the substring. Keep the existing 'no scopeContract at all → block' path. GOLDEN-FIRST: this guard fires on every Agent dispatch — golden its current block/allow cases before, all must still hold."
  - surface: "W-14 — framework/paths.registry.json portfolioRegistry (SOURCE) + scripts/paths/build.js regen + .claude/paths.json / lib/paths.generated.js (generated) + portfolioRegistry consumers"
    evidence_level: verified_from_repo
    notes: "EXECUTION-CONFIRMED: framework/paths.registry.json L1018 portfolioRegistry.path = '.claude/portfolio/registry.yaml' (dead project-local). The REAL registry is ~/.warpos/portfolio.json (exists, 3448 bytes, mtime 2026-06-06). FIX: repoint the SOURCE key to the HOME-anchored path (the registry must express '~/.warpos/portfolio.json' — confirm the registry's path-kind supports a home-anchored/absolute value; if it only supports project-relative, the consumers resolve home themselves and the key documents/points correctly — match the existing home-anchored idiom, e.g. how gemini oauth_creds or codex auth.json paths are expressed). Run scripts/paths/build.js, VERIFY the key survived in .claude/paths.json + scripts/hooks/lib/paths.generated.js (P-058 source-vs-generated — NEVER hand-edit the generated views). Then grep ALL consumers of portfolioRegistry (scripts/portfolio/registry.js + every /portfolio:* skill) and confirm they resolve/handle the HOME-anchored path correctly (a consumer that path.join(PROJECT, key) on a home path would break — fix the resolution if so)."
  - surface: "CLOSED already-fixed (execution-verified, cited): W-5 scripts/hooks/memory-guard.js L217 + writeTargetsText; W-13 memory-guard#stripNonTargetText L57-85/L78; W-28 scripts/checks/version-coherence.js L53-54"
    evidence_level: verified_from_repo
    notes: "NOT built — closed as already-fixed-in-canonical (lead-reconciled option b). W-5: a read-only node -e (readFileSync only, no write API) is ALLOWED today (tested); writeFileSync control still blocks. W-13: git commit -m mentioning events.jsonl is ALLOWED today (stripNonTargetText strips -m/--message/-F args). W-28: version-coherence L53-54 already REDs a stale install.ps1 $Script:WARPOS_VERSION (passes now only because 0.15.4==truth). Record the citations in the sprint record; lead updates the ROADMAP backlog at integration."
  - surface: "Planted tests (2) + guard goldens: empty-allowedFiles loud-block + portfolioRegistry-resolves-home"
    evidence_level: inferred_from_repo
    notes: "W-26: planted — a build-chain dispatch whose scopeContract carries allowedFiles:[] is LOUD-blocked (not silently passed); a present-but-unparseable scopeContract fail-closes; a NORMAL non-empty allowedFiles still passes (golden). W-14: planted — the resolved paths.portfolioRegistry points at ~/.warpos/portfolio.json (home-anchored), and a consumer reads the real registry; the dead project-local path is gone. Golden the scope-contract-guard's existing cases before/after (every-turn HIGH blast)."
