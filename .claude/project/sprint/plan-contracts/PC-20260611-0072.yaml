  notes: "W-26: hasScopeContract substring-matches the prompt; an empty allowedFiles:[] passes the guard then silently blocks all builder writes. W-14: portfolioRegistry → dead '.claude/portfolio/registry.yaml'; real registry at ~/.warpos/portfolio.json. (W-5/W-13/W-28 already fixed — see citations.)"
desired_behavior: "W-26: an empty allowedFiles:[] (with no forbiddenFiles) is LOUD-blocked at dispatch with an actionable reason; a present-but-unparseable scopeContract fail-closes; a normal non-empty allowedFiles passes. W-14: paths.portfolioRegistry resolves to ~/.warpos/portfolio.json (home-anchored), consumers read the real registry, the dead path is gone, the key survives regen (P-058). The every-turn guards stay green. W-5/W-13/W-28 closed with citations."
