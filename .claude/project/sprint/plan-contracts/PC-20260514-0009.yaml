next_recommended_command: "/sprint:design"
resume_instructions: "If this Plan Contract is the active one (referenced by paths.sprintCurrent.plan_contract) and you crashed mid-design, re-run /sprint:design — it is idempotent and will regenerate the design pack from this Plan Contract. To re-plan from scratch (e.g. scope shift), re-run /sprint:plan — that mints a fresh Plan Contract id and updates the sprint pointer; the old contract remains on disk for history."
