  isolation_notes: ""
beta_review:
  required: true
  likely_founder_rejection_risks:
    - "Adding a hook that hard-blocks Edit/Write to sprint paths could wedge an active sprint if the recording flow has a bug — soft-rollout flag must be the default for the first week."
  overbuild_risks:
    - Cost-class telemetry / Beta auto-recording bridge / actual second-vendor diff-review dispatch all live in expanded scope. Recommended scope must resist scope creep into those.
  missing_context_risks:
    - "Single-vendor session fallback must be explicit and tested — easy to miss and would silently break users without a 2nd API key."
