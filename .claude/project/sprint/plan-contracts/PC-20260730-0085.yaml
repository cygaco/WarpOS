high_level_story_candidates:
  - "As a founder, I install Vlad and it runs on MY OWN Claude subscription, locally, with no developer credentials and no one else's account in the path — so there is no separate Console signup on my way to first value."
  - "As a founder, I am confident whatever credential Vlad holds reaches Anthropic and nowhere else — no log, no telemetry, no proxy, no other process — because a build-failing enforcer proves it rather than a doc promising it."
  - "As a founder who kills the editor mid-job, my repository is left clean and the next session tells me what was interrupted and offers to resume or discard."
  - "As a founder who runs out of quota, I am told the job could not run — never handed a result that silently degraded into a success."
  - "As the operator, I can exercise the whole MCP surface without a host, so the engine is testable from day one."
  - "As the engineer of Wave 2, I inherit a receipt envelope whose interior was never prematurely typed, so filling it costs no rework."
granular_story_candidates:
  - "Stand up the plain-node application and confirm it reaches a model on the user's OWN subscription (subscription-primary per the 2026-08-01 ruling), through an auth-agnostic seam that also accepts an explicitly-supplied API key via @anthropic-ai/claude-agent-sdk without code change."
  - "Register the MCP stdio server and answer the four core tools (set enumerated at design, not assumed)."
  - "Implement the job state machine over running / needs_input / proposing / done with an explicit, enumerated transition table."
  - Write the on-disk job journal at checkpoints and prove crash-survival by killing mid-job and asserting a clean repository.
  - Have get_status name an interrupted job from the journal and offer resume or discard.
