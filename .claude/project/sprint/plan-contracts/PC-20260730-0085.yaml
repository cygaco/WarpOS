sprint: S-VLADW1-01
source_request: "Wave-1 ENGINE of epic E-VLAD-001 (epic label SP-VLAD-W1-ENGINE). Derived from the epic contract, not from a fresh operator message: the operator's verbatim brief is the completed 6-round grill recorded in _planning/vlad-agent-mcp-plan.md (rulings in-file, 2026-07-28), the differentiator memo _planning/vlad-why-us.md, and the 34-family port inventory _planning/vlad-transferability.md. This Plan Contract marshals the banked product-lead substance in runtime/vlad-w1/w1-planning-inputs.md §2 and the ToS finding in §1."
source_request_verbatim: "S-VLADW1-01 (epic label SP-VLAD-W1-ENGINE) — candidate — Engine skeleton: plain-node Agent SDK app + MCP stdio server + 4-core tool surface + job state machine + journal + permission-level config port (turbo engine half) + API-key model-access seam via the TypeScript Agent SDK (the claude-CLI subscription shell-out is ToS NO-GO; the seam's residue is the credential-custody enforcer + an empirically characterized quota-exhaustion detector)"
request_type: feature_add
interpreted_intent: "Build the substrate every later Vlad wave stands on: a plain-node application on the TypeScript Agent SDK that speaks MCP over stdio, runs jobs through an explicit state machine backed by an on-disk journal, reads a ported per-project permission-level config, and reaches a model on the user's OWN Claude subscription. Two of the calls in this sprint are load-bearing far beyond it. First, the model-access seam. SUPERSEDED-2026-08-01: this contract was authored under the 2026-07-29 ToS NO-GO reading, in which API-key was 'primary and ONLY'. The operator ruled 2026-08-01 that model access is SUBSCRIPTION-PRIMARY — the user's own subscription powering an agent they themselves invoke, local MCP topology, no developer credentials in the path — and the API-key seam (TypeScript Agent SDK) is now the ENGINEERED AND READY fallback per beta 7c4e2b96's auth-agnostic design. The seam must therefore be built auth-agnostically so the flip is a swap, not a rework. What does NOT change is that a fail-closed credential-custody enforcer is part of this build rather than a later hardening pass — it guards whichever secret the seam carries. Second, the receipt: ENGINE emits a versioned envelope with an UNTYPED interior (J4) and never validates or branches on it, because typing it here would propagate a v0 shape into the journal, get_status, the MCP signatures, the driver assertions and the ledger records before the dogfood data that defines it exists."
user_or_business_outcome: "Nothing user-visible ships in this sprint, and that is the correct shape: this is the engine, not a feature. What it buys is that every subsequent wave — the audit job, the write path, the agent face, the roadmap layer — has a real surface to attach to, exercisable end-to-end without a host, with the compliance-critical credential boundary already enforced in code rather than retrofitted. The founder-facing payoff arrives in S-VLADW1-02, which cannot start without this."
affected_surfaces:
  - surface: "The sibling Vlad product repo (all product-side files)"
    evidence_level: verified_from_repo
    notes: "RESOLVED-2026-08-01: the repo EXISTS. Created as the sibling `vlad` via /portfolio:new (scaffold commits present), closing what was operator gate #1 and the epic's first approval point. The prior recorded state — 'does not exist; no product-side path can be assigned, so every file-level claim here is necessarily unlocated' — is superseded, and file-level claims can now be located at /sprint:design. Product-side work still may not begin before the design->build gate clears; repo existence removes the precondition, not the gate."
  - surface: The MCP stdio server and its four-core tool surface
    evidence_level: assumed_from_request
    notes: "Both the epic tracker and the plan artifact say '4-core tool surface' but NEITHER enumerates which four. The full v1 surface is seven tools (get_status, get_readiness, run_job, send_message, approve_job, cancel_job, get_roadmap). Which four ship in Wave 1 is genuinely undetermined in the record — see the non-blocking open question. Not invented here."
  - surface: "The job state machine (running / needs_input / proposing / done) and the on-disk job journal"
    evidence_level: assumed_from_request
    notes: "States are named in the epic scope; checkpoint granularity and the resume/discard semantics get_status must offer are design-time work."
  - surface: "The receipt envelope — schema_version plus three named slots, interior UNTYPED"
    evidence_level: assumed_from_request
    notes: "J4's fix for a designed-in circularity. ENGINE journals, returns and logs the interior opaquely and never validates or branches on it; S-VLADW1-02 fills it and mints v1. Cheap only if decided now, which is why it is a Decision on the tracker rather than a design open question."
  - surface: "Model access: SUBSCRIPTION-PRIMARY (the user's own Claude subscription, user-invoked, local MCP topology), with the API-key seam via the TypeScript Agent SDK (@anthropic-ai/claude-agent-sdk) ENGINEERED AND READY as the fallback"
    evidence_level: verified_from_repo
    notes: "SUPERSEDED-2026-08-01. Prior recorded posture (preserved): 'Model access via the TypeScript Agent SDK on the user's own API key — the ToS constraint is primary-source verified TWICE with independently re-fetched verbatim quotes.' The quotes remain accurate and are still the evidence record (runtime/vlad-w1/w1-planning-inputs.md §1); what the OPERATOR RULING of 2026-08-01 supersedes is the NO-GO verdict drawn from them. The operator's parse: the clause bars DEVELOPER credentials proxying users' requests, not a user running a local agent on their OWN subscription. NEW POSTURE: subscription-primary; no developer credentials anywhere in the path; the API-key seam stays engineered and ready as the fallback per beta 7c4e2b96's auth-agnostic design, so a flip is a seam swap rather than a rework. RESIDUAL RISK recorded not softened: an alternative parse of the clause is available, policy is explicitly in flux, and Anthropic reserves enforce-without-notice. TRIGGER: if Anthropic closes or meters the seam, flip to API-key without rework. PARALLEL WORK ITEM (not a blocker): the Anthropic clarification/approval request. What is verified here is the CONSTRAINT TEXT and the RULING, not an implementation — no engine code exists. The SDK bundling its own Claude Code binary removes the user's Claude Code install from the dependency graph on the fallback seam; bank that portability gain, do not spend it. Authoritative source: the epic's Decisions first entry + the 2026-08-01 Change-log fold."
  - surface: "The credential-custody enforcer (fail-closed)"
    evidence_level: assumed_from_request
    notes: "REWORDED 2026-07-31 per beta 7c4e2b96 + ED-331 (the original 'never leave their machine / no transmit' form is unachievable — the Agent SDK authenticates to Anthropic WITH the key, so transmitting it is the mechanism, not a leak): the product never becomes a CREDENTIAL INTERMEDIARY — the HELD SECRET is used solely as the SDK/agent's own auth to Anthropic's endpoint and reaches no other destination (no log, no telemetry, no proxy, no third party, no child process; env passing allowlist-only). EXTENDED 2026-08-01: the control guards WHICHEVER SECRET THE SEAM CARRIES — the user's OAuth/subscription ambient state under the live subscription-primary ruling, the user's API key on the fallback seam. This is not a softening; it is exactly beta 7c4e2b96's generic-held-secret design, and it is why the 2026-08-01 seam ruling changes which secret the control guards rather than whether it works. The twice-verified legal page bars credential intermediation directly (the earlier Consumer-Terms citation was never primary-source verified and is not relied on). COMPLIANCE obligation, not hygiene: report-only does not satisfy it. This requirement is UNAFFECTED by the subscription-primary ruling and remains part of this build. Now the epic's credential-custody DoD item (corrected form 3a8fd442; 2026-08-01 whichever-secret form)."
  - surface: The quota-exhaustion detector
    evidence_level: inferred_from_repo
    notes: "Result strings and structured error codes are documented; the EXIT CODE is not. So the detector must be empirically characterized against real terminations before ship, an unrecognized termination classifies could-not-run rather than success, and it must never trip on 'Server is temporarily limiting requests (not your usage limit)' — that is capacity, auto-retried."
  - surface: "Permission-level config port (turbo engine half: auto | notice | confirm | never, TTL grants checked in code)"
    evidence_level: inferred_from_repo
    notes: "Cited sources (permission-profile.js and the rest of the inventory's maps) are inferred_from_repo and were never opened. The action taxonomy these levels gate does not exist yet — see the risk."
  - surface: The host-free driver
    evidence_level: assumed_from_request
    notes: "Non-negotiable and deliberately inside minimal_safe: without it a four-tool MCP surface cannot be exercised end-to-end at all, so nothing else in the sprint is testable."
  - surface: "The branding guard ('Vlad, powered by Claude')"
    evidence_level: assumed_from_request
    notes: "Never 'Claude Code', never Claude-Code-mimicking visuals. The DoD requires an enforcer to be NAMED, which is currently unmet."
current_behavior:
  evidence_level: verified_from_repo
  notes: "No product CODE exists. UPDATED 2026-08-01: the sibling repo, previously Verified Nonexistent, now EXISTS as the sibling `vlad` (created via /portfolio:new), closing operator gate #1. Inside WarpOS the registry entry, ROADMAP row and sprint stores exist for S-VLADW1-01 — which holds registry primary, the intended result of minting AUDIT first and ENGINE last — with current.yaml and progress.yaml at minted defaults; the tracker at trackers/sprints/S-VLADW1-01-vlad-engine-skeleton.md was authored separately because add-sprint.js does not scaffold one. The previously-recorded blocker that the epic asserted the ToS-barred seam as fact in four places was VERIFIED CLOSED on 2026-07-29 across all six cited locations (epic tracker § Scope and § Open questions item 2; plan artifact § 3 Scope, § 6 Dependency map, § 7 Risk map, § 10 Gate W1), plus AC #1 repriced and the codex/gemini ToS item added. SUPERSEDED-2026-08-01: those same six locations then had to be swept AGAIN, because the operator's subscription-primary ruling reversed the NO-GO verdict they had just been amended to state. The amendment discipline held; the finding is that this seam text drifts across artifacts and must be re-verified by direct read after any ruling, never inherited from an amendment report. No product code has been written and none may be before the design->build gate clears."
desired_behavior: "A plain-node application starts, registers as an MCP stdio server, and answers its four core tools. A job submitted through run_job moves through an explicit state machine (running / needs_input / proposing / done) with every transition checkpointed to an on-disk journal, so killing the editor mid-job leaves the repository clean and the next session's get_status names the interrupted job with resume and discard options. Job completion emits a versioned receipt envelope whose interior the engine treats as opaque bytes — journalled, returned and logged, never validated or branched on. Model calls run on the user's OWN Claude subscription (user-invoked agent, local MCP topology, no developer credentials in the path) per the operator ruling of 2026-08-01, through an AUTH-AGNOSTIC seam that can be swapped to the user's own API key via the TypeScript Agent SDK without rework if Anthropic ever closes or meters the subscription path. Whichever secret that seam holds, no code path reads, logs, transmits, proxies or inherits it: env passing to child processes is allowlist-based, ambient credential state (ANTHROPIC_API_KEY, OAuth state) is never inherited, and a fail-closed enforcer fails the build rather than reporting a warning if that boundary is crossed. A quota-exhausted or otherwise unrecognized termination classifies as could-not-run, never as success. A per-project config file selects a permission level, and at least ONE refusal is genuinely enforced in engine code rather than merely present in the vocabulary. All of it is exercisable through a host-free driver, and every surface says 'Vlad, powered by Claude'."
scope:
  size: xl
  risk_level: high
  complexity_drivers:
    - "SUPERSEDED-2026-08-01 (prior text preserved: 'The model-access seam rests on a ToS reversal of an operator-ratified decision, so the sprint's foundational technical choice is pending operator ratification rather than settled.'). The operator RULED the seam on 2026-08-01 — subscription-primary — so the choice is settled, not pending. The complexity that REPLACES it is real and arguably larger: the seam must be built AUTH-AGNOSTICALLY, because the posture rests on a contested parse of an ambiguous clause under a policy explicitly in flux with enforce-without-notice reserved. The engineering requirement is that a forced flip to the API-key fallback is a seam swap, not a rework — which is a harder design constraint than picking one seam and hardcoding it."
    - "Credential custody is a COMPLIANCE obligation, not hygiene — it demands a fail-closed enforcer, and fail-closed enforcers are materially harder to get right than report-only checks. CITATION RE-BASED (beta 7c4e2b96 A2): the basis is the twice-verified legal-and-compliance page barring credential intermediation directly, NOT the Consumer Terms, which were never primary-source verified and are not relied on. UNAFFECTED by the 2026-08-01 subscription ruling — the enforcer guards whichever secret the seam carries."
    - "A stray ambient credential silently bills the wrong account — in -p 'the key is always used when present', a correctness defect that produces no error, only a wrong invoice. WIDENED 2026-08-01: under subscription-primary the ambient state to keep out of child processes is the user's OAuth/subscription state as well as any API key, so the rule is 'inherit no credential', not 'inherit no API key'."
    - "The quota-exhaustion detector has documented string and structured-error signals but NO documented exit code, so it cannot be specified from docs and must be empirically characterized against real terminations."
    - "The receipt circularity (J4): AUDIT depends on ENGINE for the receipt seam while the data defining the receipt only exists after AUDIT — defused only by shipping an untyped interior, and only if that is decided before the seam is built."
    - "Permission levels are being ported against an action taxonomy that does not exist yet, which invites shipping vocabulary that enforces nothing."
    - "Every port citation is inferred_from_repo and was never opened, so the port surface must be verified before code moves."
    - "Which four of the seven v1 MCP tools constitute the 'four-core' surface is not written down anywhere."
scope_variants:
  minimal_safe:
    summary: "The plain-node Agent SDK app, the MCP stdio server with its four core tools, the job state machine, the journal writer, the untyped-interior receipt envelope, the AUTH-AGNOSTIC model-access seam (subscription-primary per the 2026-08-01 ruling, API-key fallback engineered and ready) WITH its fail-closed credential-custody enforcer, and the host-free driver. The driver is inside minimal_safe deliberately: without it none of the rest is exercisable end-to-end, so it is not a nice-to-have."
    tradeoffs:
      - "Defers the permission-level config port, so the engine has no per-project permission surface yet — acceptable only because the write path (the thing permissions actually gate) is Wave 2."
      - "Defers the branding guard's enforcer, leaving a DoD item on an honour system."
      - "SUPERSEDED-2026-08-01 (prior text preserved: 'Still requires the sibling repo, operator ratification of API-key-only, and a spend envelope — the gates bind minimal_safe exactly as hard as recommended.'). All three are CLEARED: the sibling repo `vlad` exists, ratification is moot under the subscription-primary ruling, and the operator granted a $50 dev/test envelope (vlad lane only). No operator gate now binds minimal_safe; what remains is the design->build gate itself."
  recommended:
    summary: "minimal_safe plus the permission-level config port done honestly — vocabulary, per-project config file, an in-code check, and exactly ONE genuinely enforced refusal — plus the branding guard with a named enforcer, and the quota-exhaustion detector empirically characterized against real terminations rather than specified from documentation."
    tradeoffs:
      - "The 'exactly ONE enforced refusal' discipline will feel underbuilt next to a full permission vocabulary, which is precisely the point: it proves the mechanism rather than the taxonomy."
      - "Empirically characterizing quota exhaustion costs real metered API spend and deliberately provoked failures, which is why the spend envelope is a gate rather than a formality."
      - Larger surface means the port-verification pass covers more unverified citations before any code moves.
  expanded:
    summary: "Recommended plus the full permission action taxonomy with every level enforced across it, and the complete seven-tool MCP surface instead of four."
    tradeoffs:
      - "Builds a permission taxonomy against a write path that does not exist yet — the classic shape of work thrown away when the real actions arrive in Wave 2."
      - "approve_job and cancel_job are write-path tools; implementing them here means implementing them against an unbuilt write path, so their semantics would be guesses."
      - "Directly contradicts J1's finding that the value in this sprint is the four-fifths that is gate-independent; expanding the surface enlarges exactly the part that is not."
assumptions:
  safe:
    - "The TypeScript Agent SDK bundles its own Claude Code binary, so on the fallback seam the user's Claude Code install leaves the dependency graph and the engine becomes MORE host-portable. Bank this; the epic does not need to spend it."
    - "'Your code never touches our servers' survives every seam change intact — it held under the API-key reversal and holds under the 2026-08-01 subscription-primary ruling, because the engine is plain node running locally either way. This claim is seam-agnostic and safe to keep making."
    - "Claude Code is the v1 certified host, so host-specific integration risk is bounded to one host."
    - "The write path is genuinely out of scope for this sprint, so the permission port can prove its mechanism without a complete action taxonomy."
    - "The epic and plan artifact state the CURRENT model-access posture — subscription-primary per the 2026-08-01 operator ruling, with the API-key seam as the engineered fallback. The six locations that carried the seam text were amended on 2026-07-29 to the NO-GO reading and swept AGAIN on 2026-08-01 to the ruling. This assumption has now been falsified once and must be re-verified by direct read at /sprint:design rather than inherited from any amendment report."
  unsafe:
    - "That the cited port references (score.js:134, phases/preflight.js, permission-profile.js, transaction.js, registry.js) are accurate — all are inferred_from_repo, none was opened, and the inventory warns its own maps trail live values."
    - "That the quota-exhaustion contract can be implemented from documentation. The exit code is undocumented; a detector written from the docs alone will misclassify terminations, and misclassifying one as success is the dangerous direction."
    - "That the four-core tool surface is a settled set. It is named as 'four' in two artifacts and enumerated in neither."
    - "That a report-only credential check would be adequate as an interim step. This is a compliance obligation — basis: the twice-verified legal-and-compliance page barring credential intermediation, NOT the unverified Consumer Terms — so report-only does not satisfy the DoD at any stage, under either seam."
    - "That the 2026-08-01 subscription-primary ruling settles the seam permanently. It rests on a contested parse of an ambiguous clause; the alternative parse is available, policy is explicitly in flux, and Anthropic reserves enforce-without-notice. Design for the flip, and treat the Anthropic clarification/approval request as live parallel work rather than a formality."
    - "That 'opportunistic use of other CLIs when detected' is available for codex or gemini. Nobody has read OpenAI's or Google's terms — only the Anthropic instance was tested. NOTE 2026-08-01: the operator's subscription-primary ruling is an ANTHROPIC-SPECIFIC parse of an Anthropic clause and clears nothing for other providers. Each remains its own ToS gate requiring primary-source verification first."
  needs_user_or_beta_review:
    - "RESOLVED-2026-08-01 (prior text preserved: 'OPERATOR: the sibling product repo's name and slug, plus sign-off to create it — the epic's first approval point and a hard precondition for every product-side file.'). Repo created: the sibling `vlad`, via /portfolio:new."
    - "RESOLVED-SUPERSEDED-2026-08-01 (prior text preserved: 'OPERATOR: does the operator RATIFY API-key-only model access, and does the product survive the reinstated onboarding cliff? ... whether v1 ships behind that wall is a product ruling.'). The question is moot: the operator did not ratify API-key-only, they ruled SUBSCRIPTION-PRIMARY, which removes the wall from the primary path and restores the grill-r3 frictionless onboarding this question was raised to defend. The API-key seam becomes the engineered fallback."
    - "RESOLVED-2026-08-01 (prior text preserved: 'OPERATOR: the Anthropic API spend envelope for dev/test — trips two autonomy rows ... this gates a specific DoD item, not just general development.'). Operator granted $50 dev/test, vlad lane only. The quota-detector characterization it gates may proceed within that envelope."
    - "BETA: the credential-custody enforcer. What makes 'the product is never a credential intermediary' (the 7c4e2b96 corrected form, in its 2026-08-01 whichever-secret-the-seam-carries wording) self-detecting and FAIL-CLOSED rather than aspirational — the enforcer's shape, what it can actually prove versus what it can only assert, and its honest residual ceiling. ANSWERED at plan->design by verdict 7c4e2b96; the generic-held-secret design it required is what survived the seam ruling."
    - "BETA: the honest-degradation language ('NOT verified' when a repo has no tests, could-not-run on an unrecognized termination). Both are claims-boundary surfaces where the wording is the control. ANSWERED by 7c4e2b96 (B1/B3)."
    - "SUPERSEDED-2026-08-01 (prior text preserved: 'BETA/OPERATOR: the unmitigated funnel risk. The CLI seam was the sole solve for the operator's own named biggest drop-off; it is now unowned, and no cost estimates in proposals was ruled in a subscription world and is now a churn hazard.'). The subscription-primary ruling restores the subscription world this risk was created by leaving, so the funnel risk and the cost-estimates churn hazard both fall away on the primary path. They return verbatim if the fallback seam is ever triggered — preserved here as the fallback's ready-made impact assessment rather than deleted."
open_questions:
  blocking:
    - "NONE REMAIN AS OF 2026-08-01. All three prior blocking gates are cleared and are preserved below as RESOLVED entries rather than deleted, so the clearance is auditable."
    - "RESOLVED-2026-08-01 (prior text preserved: 'Sibling product repo name + slug + operator sign-off to create it (epic gate #1).'). Created: the sibling `vlad`."
    - "RESOLVED-SUPERSEDED-2026-08-01 (prior text preserved: 'Operator ratification of API-key-only model access, together with the judgment on whether the product survives the reinstated onboarding cliff.'). Superseded by the OPERATOR RULING of 2026-08-01 that model access is SUBSCRIPTION-PRIMARY — the user's own subscription powering an agent they themselves invoke, local MCP topology, no developer credentials in the path. API-key stays engineered and ready as the fallback. The onboarding-cliff judgment falls away with the cliff. Authoritative text: epic § Decisions first entry + Change-log fold 5b022ea9."
    - "RESOLVED-2026-08-01 (prior text preserved: 'The Anthropic API spend envelope for dev/test.'). Operator granted $50, vlad lane only."
  non_blocking:
    - "WHICH four of the seven v1 MCP tools form the 'four-core' surface? Neither the epic tracker nor the plan artifact enumerates them. The natural Wave-1 reading is get_status, get_readiness, run_job and send_message — approve_job and cancel_job are write-path tools belonging to Wave 2, and get_roadmap belongs to Wave 3 — but that is an INFERENCE and must be settled at /sprint:design rather than assumed into code."
    - "RE-SCOPED 2026-08-01 as the PARALLEL CLARIFICATION WORK ITEM named in the operator's ruling, no longer a seam blocker: to Anthropic, no published answer exists for the exact scope of 'route requests ... on behalf of their users' in a local-CLI topology; the approval criteria behind the SDK page's 'unless previously approved' carve-out; which document controls given the paused June-15 metering change; the --bare default timeline; and the current numeric Pro/Max limits. The strongest case to put is exactly the ruled topology — a local tool, user-invoked, on the user's own subscription. Separately, the exit-code/JSON contract on quota exhaustion is the one item in this list that is ENGINEERING rather than policy, and it still gates a DoD item under either seam."
    - "UNOWNED: 'opportunistic use of other CLIs when detected' replicates the prohibited shape for codex and gemini, and nobody has read OpenAI's or Google's terms. Recorded in the epic as not-in-v1, each its own ToS gate — but no owner is named. The 2026-08-01 ruling does NOT touch this: it is an Anthropic-specific parse of an Anthropic clause."
    - "Which single refusal is the ONE genuinely enforced refusal in the permission port, given the action taxonomy it would gate does not exist yet?"
    - "The safe-spawn transfers-as-is classification needs an env-allowlist amendment. This is a billing-correctness defect rather than hygiene, and it is a WarpOS-side item surfacing from a product-side finding."
    - "The plan-contract schema's recommended_mode enum offers only solo/adhoc/oneshot/no_recommendation and has no 'sprint' value, so this contract records no_recommendation despite being conducted in sprint mode. The enum predates sprint mode; the honest value is the one recorded."
non_goals:
  - "The audit job itself — that is S-VLADW1-02."
  - "The write path: transaction.js, branch-per-job, preflight, ff-only apply, draft-PR park, undo. Wave 2."
  - The agent face file and the installer. Wave 2.
  - "TYPING the receipt interior. ENGINE emits schema_version plus three named slots and treats the interior as opaque — deliberately, per J4. Validating or branching on it here is the failure mode, not the goal."
  - A complete permission action taxonomy with every level enforced. Vocabulary plus config plus an in-code check plus exactly ONE genuinely enforced refusal is the target.
  - "approve_job and cancel_job semantics — write-path tools whose meaning depends on a write path that does not exist yet."
  - "SUPERSEDED-2026-08-01 — NO LONGER A NON-GOAL (prior text preserved: 'Any claude-CLI subscription shell-out, setup-token flow, or other route to a user's Free/Pro/Max credentials. ToS NO-GO, verified twice, with no fallback because the path was never permitted.'). The operator ruled model access SUBSCRIPTION-PRIMARY on 2026-08-01, so reaching the user's OWN subscription — user-invoked agent, local MCP topology, no developer credentials in the path — is the PRIMARY GOAL of this seam, not a non-goal. The exact local mechanism is a /sprint:design call and is deliberately not fixed here. What REMAINS a non-goal is any topology where OUR credentials or a service of ours sits in the path proxying someone else's requests — that is the shape the clause actually bars under the operator's parse."
  - "Opportunistic use of codex or gemini CLIs. Terms unread, each its own ToS gate; the 2026-08-01 Anthropic ruling does not extend to other providers."
  - "Modifying any canonical WarpOS asset — every port is a copy-out."
