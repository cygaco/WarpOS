high_level_story_candidates:
  - "As a founder, I install Vlad and it reaches a model on MY API key, so no one else's credentials or subscription is involved."
  - "As a founder, I am confident my API key reaches Anthropic and nowhere else — no log, no telemetry, no proxy, no other process — because a build-failing enforcer proves it rather than a doc promising it."
  - "As a founder who kills the editor mid-job, my repository is left clean and the next session tells me what was interrupted and offers to resume or discard."
  - "As a founder who runs out of quota, I am told the job could not run — never handed a result that silently degraded into a success."
  - "As the operator, I can exercise the whole MCP surface without a host, so the engine is testable from day one."
  - "As the engineer of Wave 2, I inherit a receipt envelope whose interior was never prematurely typed, so filling it costs no rework."
