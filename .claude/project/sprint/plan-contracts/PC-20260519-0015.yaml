  confidence: high
  evidence_gaps:
    - "release-canonical.js single-writer assumption is inferred, not verified."
    - "Downstream consumer RELEASES.md collision risk is inferred, not verified."
  fail_reasons: []
next_recommended_command: "/sprint:design --documentation-scale m"
resume_instructions: "If this session crashes mid-plan or before design: re-run /sprint:plan with the same source_request to regenerate the Plan Contract (a fresh PC-id will be minted; the prior one remains for history). If plan is written and the session resumes mid-design: run /sprint:design --sprint <SP-id-from-active-sprints.yaml#primary> --documentation-scale m. Reasoning trace RT-011 in .claude/project/memory/traces.jsonl carries the 'what counts as a release' policy and MUST be referenced by the design pass."
