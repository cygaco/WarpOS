schema: warpos/sprint/plan-contract/v1
id: PC-20260519-0015
created_at: "2026-05-19T06:54:15.491Z"
updated_at: "2026-05-19T06:54:15.491Z"
sprint: SP-20260519-001
source_request: "Record every sprint in ROADMAP.md and every release in RELEASES.md (with release notes). Use /reasoning:run to define what counts as a release."
source_request_verbatim: "Every sprint to be recorded in ROADMAP.md, and all releases to be recorded in RELEASES.md (include 'release notes'). Consider what counts for a release with /reasoning:run"
request_type: operating_loop
interpreted_intent: "Establish a durable, machine-enforceable ledger discipline so two repo-root docs become canonical entry points: ROADMAP.md must carry an entry for every sprint (closed, in-flight, planned) and RELEASES.md must carry an entry for every release event with release notes. The /reasoning:run pass already produced a two-tier policy for what counts as a release (RT-011): MUST=(version bumps, deployed/prepared RL-*), MAY=(bare git tags with capsule outside /warp:release), MUST NOT=(hotfix without RL-*, docs-only). The sprint codifies this policy into the operating loop — writers, hooks, skill checklists, scaffolds."
user_or_business_outcome: "Any reader (future Alex session, downstream consumer, founder) can answer 'what work has happened?' from a single file at repo root, and 'what shipped where, with what notes?' from a sibling file at repo root — without grep diving through .claude/project/sprint/. Closes the chronic LRN class 'release-capsule-gap' and 'status-transition-edge-ownership' by making the ledger a first-class artifact every release-class skill must update."
affected_surfaces:
  - surface: "ROADMAP.md (repo root)"
    evidence_level: verified_from_repo
    notes: "516 lines today, structured by Phase 1/2/3/4 backlog; does NOT carry per-sprint entries. Carries dual-identity comment block (canonical=framework backlog; downstream=consumer roadmap). Generator scaffold at scripts/warpos/generate-roadmap-scaffold.js excludes ROADMAP.md from canonical→product propagation."
  - surface: "RELEASES.md (repo root)"
    evidence_level: verified_from_repo
    notes: Does NOT exist today. No generator scaffold exists.
  - surface: ".claude/project/sprint/releases/RL-*.yaml + RL-*.changelog.md"
    evidence_level: verified_from_repo
    notes: "Canonical per-release artifacts. ~21 RL-* entries in the past 7 days. Schema warpos/sprint/release/v1."
  - surface: "version.json + framework/releases/X.Y.Z/"
    evidence_level: verified_from_repo
    notes: "Canonical version-bump artifacts. Current 0.8.0; 21 historical capsules (with known gaps for 0.3.x — see LRN-2026-05-13)."
  - surface: scripts/sprint/release.js
    evidence_level: verified_from_repo
    notes: "Owns RL-* creation + deployment. Candidate caller for RELEASES.md append."
  - surface: "scripts/warpos/release-canonical.js (or equivalent /warp:release driver)"
    evidence_level: inferred_from_repo
    notes: "Owns version.json bump + capsule build. Candidate caller for RELEASES.md Versions section append."
  - surface: "scripts/sprint/plan.js + scripts/sprint/add-sprint.js"
    evidence_level: verified_from_repo
    notes: "Own sprint id minting + active-sprints registry update. Candidate caller for ROADMAP.md sprint-row append."
  - surface: scripts/sprint/retrospective.js
    evidence_level: verified_from_repo
    notes: "Owns sprint close → retrospected transition. Candidate caller for ROADMAP.md status update."
  - surface: scripts/warpos/generate-roadmap-scaffold.js
    evidence_level: verified_from_repo
    notes: "Owns downstream consumer ROADMAP.md scaffold. Must be updated if section conventions change (so consumers get the same shape)."
  - surface: "PreToolUse hooks (sprint-tracker-guard, framework-manifest-guard, others)"
    evidence_level: inferred_from_repo
    notes: "Candidate site for a 'ROADMAP/RELEASES untouched' check when /sprint:plan or /sprint:release ran but those files were not modified."
current_behavior:
  evidence_level: verified_from_repo
  notes: "Sprints are recorded only in .claude/project/sprint/active-sprints.yaml + per-sprint subdir under sprints/<SP-id>/. Releases are recorded only in .claude/project/sprint/releases/RL-*.yaml + .changelog.md AND in version.json/framework/releases/. No repo-root index ties them together. ROADMAP.md exists but is framework backlog, not sprint ledger. RELEASES.md does not exist."
desired_behavior: "Two repo-root ledgers maintained by skill+script enforcement (not by Alex memory). ROADMAP.md gains a 'Sprints' section with one row per sprint (id, title, status, started, closed, release-ref); the existing Phase backlog stays as-is below it. RELEASES.md is a new file with two sections: 'Versions' (one row per version.json bump, linked to capsule under framework/releases/, with a 1-2-sentence summary readable by downstream consumers) and 'Sprints' (one row per RL-* at status=deployed OR prepared-at-internal-canary, linked to RL-*.yaml + .changelog.md, with one-line outcome). All writes are skill-driven; manual edits remain valid (markdown)."
scope:
  size: m
  risk_level: low
  complexity_drivers:
    - "Touches multiple writer scripts (plan.js, add-sprint.js, release.js, retrospective.js, release-canonical.js)"
    - "Must remain idempotent and crash-safe (re-running a skill must not duplicate entries)"
    - "Must respect downstream-scaffold boundary — canonical ROADMAP.md content ≠ consumer scaffold; same applies to RELEASES.md if shipped as scaffold"
    - "Backfill of ~14 historical sprints + ~21 historical RL-* + ~21 historical version-bumps required for ledger to be useful day one"
scope_variants:
  minimal_safe:
    summary: "Add a 'Sprints' section to ROADMAP.md and create RELEASES.md with the two-section structure. Backfill historical entries by reading active-sprints.yaml + releases/ + version.json#previousVersions. Document the convention in sprint-workflow.md and /sprint:release. NO hook enforcement, NO writer-script integration — purely manual + skill-checklist driven for one sprint cycle to validate the format."
    tradeoffs:
      - "Pro: fast to ship; lets us iterate on the format with real data before locking in enforcement"
      - "Con: convention drift is likely — next sprint may forget to update; the chronic LRN 'status-transition-edge-ownership' class will recur in a new shape"
  recommended:
    summary: "Minimal-safe PLUS: integrate writer scripts (plan.js / add-sprint.js append to ROADMAP.md Sprints section; release.js append to RELEASES.md Sprints section; release-canonical.js append to RELEASES.md Versions section; retrospective.js update ROADMAP.md row status). Add a soft PreToolUse warn hook that surfaces when /sprint:plan or /sprint:release ran but the corresponding ledger row was not detected (warn-only during a 7-day soft-rollout window per the routing-enforcement precedent). Backfill historical entries via a one-shot scripts/sprint/backfill-ledgers.js (gated by --apply, dry-run default)."
    tradeoffs:
      - "Pro: enforcement matches the established routing-trace precedent; ledger stays honest without Alex memorizing the rule"
      - "Pro: backfill makes the ledger useful day one, not week six"
      - "Con: more surface area to maintain; writer-script integration must remain fail-open per the routing-trace convention"
  expanded:
    summary: "Recommended PLUS: ship RELEASES.md as a scaffold to downstream consumer projects (analogous to ROADMAP.md scaffold today), with the convention that consumer projects record their own product releases (not framework releases) in their RELEASES.md. Update generate-roadmap-scaffold.js to also generate-releases-scaffold.js and wire into the install path. Add /check:roadmap-releases-honesty check (analogous to /check:warpos-manifest-honesty) that fails CI when active-sprints.yaml entries are missing from ROADMAP.md or releases/ RL-* are missing from RELEASES.md. Promote both ledgers to canonical paths.json entries (paths.roadmap, paths.releases)."
    tradeoffs:
      - "Pro: closes the convention end-to-end across framework + consumer + CI"
      - "Con: scope creep — consumer-side scaffolding is a separate concern from the framework's internal ledger; defer unless a downstream consumer asks"
      - "Con: /check skill adds maintenance burden; soft hook warn already covers the same drift detection at lower cost"
assumptions:
  safe:
    - "RT-011 reasoning trace correctly identifies the release-event taxonomy and audience reconciliation (engineering ledger first, consumer-readable second)."
    - "ROADMAP.md remains the framework backlog at canonical; the new 'Sprints' section sits above the Phase backlog without disturbing it."
    - "Existing RL-*.yaml and .changelog.md remain the source of truth for per-release detail; RELEASES.md links to them rather than re-deriving content."
    - "Fail-open is the right posture for writer-script integration (matches routing-trace + sprint-tracker-guard precedent: warn but never block release flow)."
    - "Backfill is safe because all required inputs (active-sprints.yaml, releases/, version.json#previousVersions) are already on disk and deterministic."
  unsafe:
    - "Assumption that release-canonical.js (or whatever drives /warp:release) is the single caller for version.json bumps — there may be manual edits, hotfix paths, or earlier-version scripts that bump version.json without going through it. Design pass must verify by grep before wiring the writer."
    - "Assumption that ROADMAP.md downstream scaffold and canonical content can diverge cleanly via the same exclusion pattern that's already in promote.js — needs verified_from_repo confirmation that the same exclusion will work for RELEASES.md."
  needs_user_or_beta_review:
    - "Whether RELEASES.md should ship to downstream consumers as a scaffold (expanded variant) or stay canonical-only (recommended variant) — Class B/C call on consumer surface area."
    - "Whether 'prepared at internal-canary' RL-* belongs in the public-facing ledger or only in the engineering-section; this affects what a downstream consumer reading the canonical-WarpOS RELEASES.md would see."
open_questions:
  blocking: []
  non_blocking:
    - "How to render the Sprints table compactly in markdown — flat table vs grouped by phase vs reverse-chronological. Defer to /sprint:design."
    - "Whether to backfill release notes prose for historical RL-* (read .changelog.md and inline a 1-line summary) or just link out. Defer to /sprint:design."
    - "Whether the 14 historical sprints (currently in active-sprints.yaml) get a 'pre-ledger' status flag to distinguish them from sprints that went through the new convention. Defer to /sprint:design."
non_goals:
  - "NOT changing what counts as a sprint vs a ticket vs a learning — only how sprints are summarized at repo root."
  - "NOT changing the per-sprint subdir under sprints/<SP-id>/ — they remain the source of truth."
  - "NOT redesigning version.json or framework/releases/ — they remain the source of truth for version bumps."
  - "NOT auto-generating release notes prose via LLM — release notes are human-written or extracted from existing RL-*.changelog.md."
  - "NOT building a UI / dashboard — markdown ledgers at repo root only."
  - "NOT consumer-side scaffolding in the minimal/recommended variants (only the expanded variant ships RELEASES.md scaffold downstream)."
requirement_areas:
  - "operating-loop:ledger-discipline"
  - "sprint-workflow:ledger-writes"
  - "release-pipeline:ledger-writes"
  - "documentation:repo-root-entry-points"
  - "hooks:ledger-presence-warn"
high_level_story_candidates:
  - "As a future Alex session, I can read ROADMAP.md once and understand every sprint that has run (id, title, status, dates, release link) without grep-diving into .claude/project/sprint/."
  - "As a downstream consumer maintainer, I can read RELEASES.md Versions section and understand what changed in the version I just upgraded to, without reading framework engineering detail."
  - "As an engineering reviewer, I can read RELEASES.md Sprints section and audit every RL-* with its status and outcome at a glance."
  - "As the next person to run /sprint:release, the skill body and (warn) hook remind me to update RELEASES.md, and the writer script does it for me by default."
granular_story_candidates:
  - "Define the markdown structure for ROADMAP.md 'Sprints' section (column set, sort order, status enum, link format)."
  - "Define the markdown structure for RELEASES.md 'Versions' section (column set, summary length cap, capsule link format)."
  - "Define the markdown structure for RELEASES.md 'Sprints' section (column set, RL-* link, status enum, outcome length cap)."
  - "Codify the 'what counts as a release' policy from RT-011 into a section in paths.sprintReference or a sibling reference doc."
  - "Wire scripts/sprint/plan.js (or add-sprint.js) to append a sprint row on creation."
  - Wire scripts/sprint/retrospective.js to update the sprint row status to retrospected.
  - "Wire scripts/sprint/release.js to append an RL-* row to RELEASES.md Sprints section."
  - "Wire scripts/warpos/release-canonical.js (or equivalent) to append a version row to RELEASES.md Versions section."
  - "Build scripts/sprint/backfill-ledgers.js (dry-run default, --apply gate) to populate both ledgers from existing on-disk artifacts."
  - "Add a soft PreToolUse warn hook for ledger drift (warn-only during soft-rollout, escalate to block after smoke validation per routing-trace precedent)."
  - "Update sprint-workflow.md / /sprint:release skill body to reference the new ledger convention."
  - "(Expanded only) Ship RELEASES.md scaffold downstream + generate-releases-scaffold.js + /check:roadmap-releases-honesty."
workstream_candidates:
  - "WS-1 Ledger format + policy (markdown structure + RT-011 codification)"
  - "WS-2 Backfill (one-shot script to populate both files from existing artifacts)"
  - "WS-3 Writer-script integration (plan.js, retrospective.js, release.js, release-canonical.js)"
  - "WS-4 Soft enforcement (PreToolUse warn hook, soft-rollout window)"
  - "WS-5 Docs + skill-body updates (sprint-workflow.md, /sprint:release, /sprint:plan)"
preliminary_ticket_candidates:
  allowed: false
  candidates: []
  notes: "Sprint is mid-size, multi-script touch, with a soft-enforcement hook. Ticket minting deferred to /sprint:design per skill convention."
external_service_dependencies:
  status: none_expected
  required: []
  possible: []
  notes: "Purely internal — markdown ledgers, sprint scripts, hooks. No signup, no billing, no credentials."
approval_boundaries:
  - "/sprint:release deploy itself remains user-approved (unchanged from current convention)."
  - "Soft-rollout → block-mode flip for the new warn hook requires explicit user approval after smoke validation (precedent: SP-20260514-002 routing-enforcement)."
design_required: true
execution_allowed_without_design: false
recommended_mode: adhoc
mode_invocation_required_by_user: true
lane:
  type: default
  value: null
  isolation_notes: ""
beta_review:
  required: true
  likely_founder_rejection_risks:
    - "Founder may push back on shipping RELEASES.md downstream as scaffold (expanded variant) — consumer surface area decision."
    - "Founder may want a stricter MUST/MUST NOT boundary than RT-011 currently draws (e.g. include bare git tags by default)."
  overbuild_risks:
    - "Building the expanded variant (consumer scaffold + /check:roadmap-releases-honesty) when no downstream consumer has asked for it."
    - Wiring writer-script integration into all four scripts when the minimal-safe iteration would surface format issues first.
  missing_context_risks:
    - "Have not verified that release-canonical.js is the sole version.json bump path — design pass must confirm by grep."
    - "Have not verified whether existing downstream consumer projects already have a RELEASES.md (would collide on first install)."
plan_quality:
