    evidence_level: assumed_from_request
  - surface: "scripts/warpos/test-fixtures/install-matrix/ (new — scenario definitions, expected-state assertions)"
    evidence_level: assumed_from_request
  - surface: ".warpos/test-fixtures/install-matrix/ (new — ephemeral fixture roots, gitignored)"
    evidence_level: inferred_from_repo
    notes: ".warpos/ is already gitignored per .gitignore convention used by existing tests (test-compile-fixtures, transactions/, etc.)"
  - surface: "scripts/warpos/update.js (read — System Under Test, not modified)"
    evidence_level: verified_from_repo
  - surface: "scripts/warpos/transaction.js (read — exercised by tests for snapshot/rollback assertions)"
    evidence_level: verified_from_repo
  - surface: "scripts/warp-setup.js (read — exercised by clean-install scenario)"
    evidence_level: inferred_from_repo
  - surface: "scripts/warpos/settings/compile.js (read — exercised by tests for settings.json --check clean)"
    evidence_level: verified_from_repo
  - surface: "scripts/warpos/manifest/validate.js (read — exercised for manifest honesty assertion)"
    evidence_level: verified_from_repo
  - surface: "framework/releases/<X.Y.Z>/release.json (read — multi-version-upgrade scenario consumes existing capsules OR synthesizes tiny test capsules)"
    evidence_level: verified_from_repo
  - surface: "package.json or test runner config (modify — wire new test into npm script + gauntlet entries)"
    evidence_level: assumed_from_request
  - surface: ".claude/paths.json (modify — add paths.testInstallMatrix key, optional)"
    evidence_level: assumed_from_request
  - surface: "ROADMAP.md (update on ship — mark scenario A done)"
    evidence_level: verified_from_repo
current_behavior:
  evidence_level: verified_from_repo
  notes: "scripts/warpos/ has 3 narrow tests of the install pipeline: test-cross-version-replay.js (cross-version capsule replay), test-transaction-smoke.js (transaction begin/commit/rollback shape), test-rollback-cli-smoke.js (--rollback CLI). No end-to-end fixture matrix that exercises /warp:setup + /warp:update against representative real-world install scenarios. Regressions in install/update flow currently only surface when an operator runs the real install against a real product — too late."
desired_behavior: "Running `node scripts/warpos/test-install-matrix.js` (or via npm/gauntlet) spins up 5 ephemeral fixture projects, runs the appropriate install/update path per scenario, asserts the expected post-state, cleans up, and reports pass/fail with structured per-scenario output. JSON-report mode for CI consumption. Exit 0 on full pass, non-zero with per-scenario failure detail otherwise. Total runtime target <60s for the full matrix; parallelize per-scenario when safe."
scope:
  size: m
  risk_level: medium
  complexity_drivers:
    - "5 scenarios × N assertions each — scenario authoring is the bulk of the work"
    - "Multi-version-upgrade requires having ≥2 real capsules OR synthesizing minimal test capsules (which itself is a non-trivial helper)"
    - "Fixture lifecycle (create, isolate, cleanup) must be airtight — bad cleanup leaves test detritus that breaks subsequent runs"
    - "Meta-testing: must verify the matrix actually catches intentional regressions, not just always passes"
scope_variants:
  minimal_safe:
    summary: "3 scenarios only — clean install, existing-install upgrade, dirty-uncommitted preservation. No multi-version-upgrade (skip the synthesize-capsules complexity). No CI wire-in (manual invocation only). Single sequential runner, no parallelization. Ships fastest."
    tradeoffs:
      - "Misses multi-version-upgrade — the most error-prone real-world scenario"
      - "Misses user-overrides preservation — tests the operator-modified file path"
      - No CI wire-in means easy to forget to run before shipping install changes
      - "But: validates the fixture-matrix pattern itself with 3 representative scenarios"
  recommended:
    summary: "All 5 scenarios. JSON report mode + human report mode. Wired into the existing test gauntlet (npm test + /check:all entry). paths.testInstallMatrix key registered. Meta-tests verify the matrix detects 2-3 intentional regressions (planted bug fixtures). Parallel-safe per-scenario execution. Cleanup-on-error to avoid orphan fixtures."
    tradeoffs:
      - More ship time than minimal_safe
      - Full safety net for every install-reliability item shipping after this sprint
      - "Multi-version-upgrade scenario adds the synthesize-capsules helper as a side-deliverable that's useful for future tests too"
  expanded:
    summary: "Recommended + property-based fuzz mode (random file sets across scenarios to surface combinatorial bugs) + GitHub Actions workflow wiring + scenario-coverage reporting (which install-flow code paths are exercised vs unreached)."
    tradeoffs:
      - "Property-fuzz tooling is a separate skill; brings its own flake/maintenance cost"
      - "GitHub Actions wiring requires repo-public release first (or a private actions runner) — not strictly canonical-side work"
      - "Coverage reporting needs nyc/c8 integration — adds dependencies"
assumptions:
  safe:
    - ".warpos/ is gitignored (confirmed in repo) — fixtures land there safely without polluting the working tree"
    - "scripts/warpos/update.js + transaction.js + snapshot-installed.js are stable per SP-20260513-005 retro and the 3 existing smoke tests"
    - scripts/warpos/settings/compile.js is stable per 51/51 tests passing this session
    - "scripts/warpos/manifest/validate.js is stable per Sprint 1 (SP-20260522-001) retrospective (18+ tests passing)"
    - "spawnSync + os.tmpdir() pattern is portable (already used by test-defaults-migration.js)"
    - "The 5 scenarios named in ROADMAP cover the operational risk surface — derived from prior incident history"
  unsafe:
    - "Multi-version-upgrade scenario assumes ≥2 real capsules exist on disk OR a synthesize-capsules helper can be authored. Need to verify framework/releases/ contents during design"
    - "Total matrix runtime target <60s assumes scenarios can run in parallel without lock contention on .warpos/. If active.lock check forces serialization, runtime could balloon"
    - "Cleanup-on-test-crash relies on process.on('exit') handlers; on hard SIGKILL, orphan fixtures may persist — not catastrophic (gitignored) but messy"
  needs_user_or_beta_review:
    - "Fixture root location: .warpos/test-fixtures/install-matrix/ (repo-local, easier to inspect after failures) vs os.tmpdir() (OS-managed cleanup, more portable). Default lean: .warpos/ for inspectability"
open_questions:
  blocking: []
  non_blocking:
    - "Wire-in target: npm test, /check:all, framework-manifest gauntlet, or all three?"
    - "Synthesize minimal test capsules vs use existing framework/releases/ capsules for multi-version-upgrade?"
    - "Meta-test approach: snapshot expected-pass + run with planted regression to confirm matrix catches it, OR formal mutation testing?"
    - "Per-scenario timeout default — 30s? 60s? Per-scenario or matrix-wide?"
non_goals:
  - "Do NOT modify scripts/warpos/update.js, transaction.js, snapshot-installed.js, settings/compile.js, manifest/build.js, manifest/validate.js — these are the SUT, not the test"
  - "Do NOT add new install flows or new behavior to the install pipeline — test-only sprint"
  - "Do NOT test downstream-product-specific scenarios — downstream products are responsible for their own install testing"
  - "Do NOT touch Dreamteam or other portfolio products (operator constraint)"
  - "Do NOT build full property-based fuzz mode (that's expanded variant)"
requirement_areas:
  - "Test runner (scripts/warpos/test-install-matrix.js) — fixture lifecycle + per-scenario dispatch + report aggregation"
  - "Scenario definitions — 5 scenarios with seed state + post-state assertions"
  - "Ephemeral fixture infrastructure — create/isolate/cleanup primitives reusable across scenarios"
  - "Multi-version-upgrade support — capsule sourcing or synthesis helper"
  - "JSON + human report modes"
  - "CI wire-in (npm script + gauntlet entry)"
  - "Meta-tests — verify matrix detects planted regressions"
high_level_story_candidates:
  - "As a maintainer landing install-reliability changes, I run a single command and know within 60s whether my change broke any of 5 representative install scenarios."
  - "As a CI gate, the matrix runs on every commit touching scripts/warpos/* or scripts/warp-setup.js, fails the build on regression with structured per-scenario failure detail."
  - "As a future install-reliability sprint (per-file status reporting, migrations + userModified, etc.), I land my change knowing the matrix protects against regressions in the 5 baseline scenarios."
granular_story_candidates:
  - "Scaffold scripts/warpos/test-install-matrix.js with fixture lifecycle (create, run, assert, cleanup) primitives"
  - "Define scenario 1 (clean install): create empty fixture project, run /warp:setup, assert all framework files present + manifest honest + settings.json --check clean"
  - "Define scenario 2 (existing-install upgrade): seed fixture with prior-version install, run /warp:update --to <newer>, assert post-state matches new version"
  - "Define scenario 3 (dirty-uncommitted preservation): seed fixture with install + operator edit to a framework file, run /warp:update, assert operator edit preserved (or properly conflicted)"
  - "Define scenario 4 (multi-version-upgrade): seed fixture with install at version N, run /warp:update --to N+3, assert all intermediate migrations ran in order"
  - "Define scenario 5 (user-overrides preservation): seed fixture with install + operator settings.local.json overrides + permissions overrides, run /warp:update, assert overrides survive"
  - Synthesize test-capsules helper OR document which framework/releases/ versions to chain for scenario 4
  - "JSON report mode for CI (--json flag emitting structured per-scenario result)"
  - "Wire-in: npm script (npm run test:install-matrix) + gauntlet entry"
  - "Meta-tests: plant a regression (e.g., delete a hook from defaults.json mid-install) and confirm matrix catches it"
workstream_candidates:
  - "Runner + fixture primitives"
  - "Scenario authoring (5 scenarios)"
  - Multi-version capsule synthesis or sourcing
  - "Reporting + JSON mode"
  - "CI wire-in + path key"
  - Meta-tests
