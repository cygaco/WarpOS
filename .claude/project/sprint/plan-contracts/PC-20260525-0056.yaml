sprint: SP-20260525-023
source_request: "Wire bootstrap:spinup's full orchestration pipeline (0.15.0 sprint 3 of 3): make the five phases that today are documented hooks in .claude/commands/bootstrap/spinup.md actually execute end-to-end — /check:install pre-flight gate, intent (guided brief OR --clone via scripts/portfolio/clone.js), canon (reuse B's scripts/canon/generate.js, already wired in T6), roadmap (roadmap:create grounded in canonical, MVP-core-loop first), and on-screen (execute the first sprint until the core loop SERVES, gated by verify-before-claim)."
source_request_verbatim: "Wire bootstrap:spinup's full orchestration pipeline (0.15.0 sprint 3 of 3, the on-ramp finisher). The phases already exist as documented hooks in .claude/commands/bootstrap/spinup.md; this sprint makes them execute end-to-end: (1) /check:install pre-flight gate refuses a gappy install; (2) intent phase — guided brief (default) or --clone a competitor via scripts/portfolio/clone.js; (3) canon phase already wired in T6 to scripts/canon/generate.js (B's engine — reuse, don't rebuild); (4) roadmap phase invokes roadmap:create grounded in the canonical docs, MVP-core-loop first; (5) on-screen phase executes the first sprint until the core loop SERVES, gated by verify-before-claim (build clean + dev server HTTP 200 + entry module transforms). Sprint C is itself an engine/tooling sprint with no deploy artifact — expect the RI-001 release-prep friction at close (close via ff-merge to main, not the orchestrator). Off main."
request_type: feature_add
interpreted_intent: "Turn bootstrap:spinup from a documented skeleton (Phases 1-4 are prose hooks, Phase 4 on-screen explicitly deferred to this sprint) into an executable one-command on-ramp. The orchestration LOGIC is built in canonical (the spinup.md skill body + any supporting scripts under scripts/bootstrap/ or scripts/canon/) but EXECUTES product-side (spinup runs inside a product repo). Concretely: (0) a /check:install pre-flight gate that refuses to proceed on a gappy install (incl. the WG-4 sprint-subsystem probe); (1) intent phase that runs the guided brief by default or derives intent from a competitor via the existing scripts/portfolio/clone.js when --clone is passed (reuse, do not reimplement); (2) canon phase that invokes scripts/canon/generate.js (B's engine, already wired in T6) on the Phase-1 intent; (3) roadmap phase that invokes roadmap:create grounded in the freshly-generated _requirements/00-canonical/* (preferred) with MVP-core-loop-first sprint ordering; (4) on-screen phase that takes Milestone-1's first sprint and executes it until the core loop SERVES, gated by verify-before-claim (build clean + dev server returns HTTP 200 + entry module transforms without error — 'it builds' != 'it serves'). --phase <name> re-runs a single phase; --resume continues from the last completed phase."
user_or_business_outcome: "The 0.15.0 milestone's payoff: a fresh product goes from 'just WarpOS installed' to 'core loop on screen' with ONE command. This is JTBD-3 ('just WarpOS' -> canonical docs + roadmap + something running) fully realized. Sprints A (suite reconciliation) and B (canon engine) built the parts; C composes them into the on-ramp."
affected_surfaces:
  - surface: ".claude/commands/bootstrap/spinup.md (orchestration body)"
    evidence_level: verified_from_repo
    notes: "Phases 1-4 are documented hooks today; Phase 4 (on-screen) + the full intent->canon->roadmap->on-screen chaining are explicitly deferred to this sprint. Make the phase pipeline + --phase/--resume/--clone flags execute end-to-end."
  - surface: "scripts/bootstrap/spinup-orchestrate.js (NEW — likely)"
    evidence_level: inferred_from_repo
    notes: "A driver the skill body can shell to that sequences the phases, tracks phase state (for --resume), and enforces the verify-before-claim gate. May be thin if the skill body drives phases directly; design decides."
  - surface: "/check:install pre-flight gate"
    evidence_level: verified_from_repo
    notes: "Phase 0 gate: refuse a gappy install before Phase 1. Reuse the existing /check:install (incl. sprint-probe) — wire its exit code as a hard gate."
  - surface: "scripts/portfolio/clone.js (--clone intent)"
    evidence_level: verified_from_repo
    notes: "Phase 1 --clone mode reuses the existing clone engine (source classes product|review|landing|devdocs|appimg). Reuse, do not reimplement — verify the integration point + that the clone doc feeds Phase 2."
  - surface: "scripts/canon/generate.js (canon phase — REUSE from B)"
    evidence_level: verified_from_repo
    notes: "Phase 2 already wired in SP-022 T6: spinup.md invokes generate.js + the research bridge. Verify the chaining (intent file -> generate.js -> _requirements/00-canonical/*) works from the orchestrator, do NOT rebuild the engine."
  - surface: "roadmap:create (roadmap phase)"
    evidence_level: verified_from_repo
    notes: "Phase 3 invokes roadmap:create, which already prefers _requirements/00-canonical/* when present. Verify it grounds on the canon B's engine produced + MVP-core-loop-first ordering."
  - surface: verify-before-claim serve gate
    evidence_level: inferred_from_repo
    notes: "Phase 4 gate: build clean + dev server HTTP 200 + entry module transforms without error. The 'serves != builds' contract. A live node process / existing worktree is NOT evidence."
  - surface: "scripts/bootstrap/test-spinup-orchestrate.js (NEW e2e)"
    evidence_level: inferred_from_repo
    notes: "Fixture/dry-run e2e proving the phases chain (intent->canon->roadmap) without standing up a real product in canonical — mirrors B's fixture-test pattern."
current_behavior:
  evidence_level: verified_from_repo
  notes: "bootstrap:spinup exists (added in SP-021) with Phases 1-4 as documented hooks. Phase 2 (canon) was wired to scripts/canon/generate.js in SP-022 T6. Phase 4 (on-screen) is explicitly a documented contract deferred to SP-20260525-023. There is no driver that executes the full intent->canon->roadmap->on-screen chain, no --resume phase-state tracking, and no verify-before-claim serve gate."
desired_behavior: "Running /bootstrap:spinup inside a WarpOS-installed product executes end-to-end: pre-flight /check:install gate -> intent (brief or --clone) -> canon (generate.js) -> roadmap:create -> execute first sprint until the core loop SERVES (verify-before-claim). --phase re-runs one phase; --resume continues from the last completed phase. A fixture e2e proves the chain in canonical without standing up a real product."
scope:
  size: l
  risk_level: high
  complexity_drivers:
    - "Composes four existing-but-separate capabilities (check:install, clone.js, canon generate.js, roadmap:create) into one chained pipeline with phase-state for --resume — the seams are the risk"
    - "The on-screen phase's verify-before-claim gate (build + HTTP 200 + entry transform) must be real, not aspirational — 'it builds != it serves' is a recurring failure class"
    - "Orchestration is built in canonical but executes product-side; canonical can only test the chain on a fixture, not by standing up a real product (framework-purity + no product content)"
scope_variants:
  minimal_safe:
    summary: "Wire phases 0-3 (pre-flight + intent + canon + roadmap) end-to-end with --phase/--resume; leave Phase 4 on-screen as the documented contract."
    tradeoffs:
      - "Pro: smaller, gets idea->roadmap working"
      - "Con: stops short of 'on screen' — the milestone's whole promise"
  recommended:
    summary: "Full pipeline: pre-flight gate + intent (brief|--clone) + canon + roadmap + on-screen execute with verify-before-claim, --phase/--resume flags, and a fixture e2e proving the chain. Reuse B's engine + clone.js + roadmap:create — compose, don't rebuild."
    tradeoffs:
      - "Pro: completes the 0.15.0 on-ramp; idea->screen in one command"
      - "Con: large; the on-screen serve gate is the risk surface"
  expanded:
    summary: "recommended + portfolio:spinup <slug> from-WarpOS wrapper hardening + multi-product spinup matrix."
    tradeoffs:
      - "Pro: richer"
      - "Con: wrapper already exists as thin dispatch; matrix is beyond the milestone"
assumptions:
  safe:
    - "bootstrap:spinup, scripts/canon/generate.js, scripts/portfolio/clone.js, roadmap:create, and /check:install all exist and work in isolation (built/verified in A + B)"
    - "the orchestration is built in canonical but runs product-side, so chaining the phases on a FIXTURE intent is the correct canonical-side verification"
    - Phase 2 canon wiring from T6 is the integration template for the other phases
  unsafe:
    - "The on-screen phase's verify-before-claim gate must work across product types (PWA/CLI/server) — needs a defined, type-aware serve check, or a bounded first target (local-first PWA bias per spinup.md)"
  needs_user_or_beta_review:
    - "How far the on-screen phase goes in canonical: does C build the execute-loop wiring + verify gate (and prove it on a fixture), or also demonstrate a real serve? (β: likely the former — canonical proves the chain, real serve is product-side.)"
    - Whether the orchestrator is a new scripts/bootstrap/spinup-orchestrate.js driver or the skill body drives phases directly
open_questions:
  blocking: []
  non_blocking:
    - "Driver script vs skill-body-driven orchestration?"
    - "verify-before-claim: one bounded target type (local-first PWA) for v1, or type-aware from the start?"
non_goals:
  - "Standing up / serving a REAL product inside canonical (canonical proves the chain on a fixture; real serve is product-side via spinup)"
  - "Rebuilding the canon engine (B / SP-022), the clone engine (clone.js), or roadmap:create — REUSE all three"
  - "The 0.10.0 canonical scrub (separate, operator-gated)"
  - "Milestone close: flipping SP-021/022/023 to retrospected + the 0.15.0 Shipped narrative (after this sprint)"
requirement_areas:
  - spinup-orchestration
  - preflight-install-gate
  - intent-phase-brief-and-clone
  - canon-phase-chaining
  - roadmap-phase-chaining
  - on-screen-verify-before-claim
  - phase-resume-state
  - fixture-e2e
high_level_story_candidates:
  - "As a fresh product, running /bootstrap:spinup once takes me from intent to my core loop on screen."
  - "As an operator, a gappy install is refused at pre-flight before any phase runs."
  - "As the on-ramp, each phase reuses the existing engine (clone.js / generate.js / roadmap:create) rather than reimplementing it."
  - "As the on-screen phase, I only claim success when the core loop SERVES (build + HTTP 200 + entry transform), never just 'it builds'."
granular_story_candidates:
  - "Phase 0: wire /check:install as a hard pre-flight gate (incl. WG-4 sprint probe) that refuses a gappy install."
  - "Phase 1 intent: drive the guided brief (default) AND the --clone path (reuse scripts/portfolio/clone.js); the chosen output feeds Phase 2."
  - "Phase 2 canon: chain the Phase-1 intent into scripts/canon/generate.js (verify the T6 wiring end-to-end from the orchestrator)."
  - "Phase 3 roadmap: invoke roadmap:create grounded in the generated _requirements/00-canonical/*, MVP-core-loop-first."
  - "Phase 4 on-screen: execute Milestone-1's first sprint with a verify-before-claim serve gate (build clean + dev server HTTP 200 + entry module transforms)."
  - "Phase-state + flags: --phase <name> re-runs one phase, --resume continues from the last completed phase."
  - "Fixture e2e: a sample intent drives the chain (intent->canon->roadmap) in canonical without standing up a real product — the verify-before-claim for this orchestration."
workstream_candidates:
  - Pre-flight install gate
  - "Intent phase (brief + clone)"
  - Canon phase chaining
  - Roadmap phase chaining
  - "On-screen execute + verify-before-claim gate"
  - Phase-state / --phase / --resume
  - Fixture e2e test
preliminary_ticket_candidates:
  allowed: false
  notes: "Design must settle: (1) driver-script vs skill-body orchestration, (2) the verify-before-claim serve-check shape (type-aware vs bounded local-first PWA for v1), (3) how far the on-screen phase goes in canonical (chain-proof on fixture vs real serve). Then mint ~7 tickets from the granular stories: pre-flight gate, intent(brief|clone), canon-chaining, roadmap-chaining, on-screen+verify gate, phase-state/flags, fixture e2e."
external_service_dependencies:
  status: possible
  possible:
    - "research:* via the canon phase's bounded research bridge (only if a fixture run exercises live research; default --research off for canonical tests)"
  notes: "C is orchestration wiring; it does not itself incur research spend during the build. The canon phase MAY invoke research product-side at spinup runtime, bounded by B's cap schema."
approval_boundaries:
  - "Push to remote — operator-scoped (orchestrator commits locally only)"
  - "Engine/tooling sprint with no deploy artifact — release-prep does not apply (RI-001); close via ff-merge to main"
