  - "Re-fixing anything in NOTAGAIN §6 receipts (F-1/F-2/F-3, S-12, safe-spawn, WG-1..9, S-LC-07)."
  - "Pushing to remote / regenerating manifests in canonical (α owns the end-of-arc)."
