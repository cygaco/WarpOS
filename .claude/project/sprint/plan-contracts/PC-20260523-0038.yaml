  - "As the framework, /sprint:full's Beta cadence is now enforced — drift is detectable by anyone running the skill."
  - "As a future contributor, I can trust that AUTONOMY.md's Beta consultation cadence reflects reality (no aspirational disclaimer)."
  - "As the operator, I see the enforcement-debt for Beta consultation cadence closed in /enforcement:list."
