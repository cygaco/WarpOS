  allowed: false
  candidates: []
  notes: "Sprint is size=l, risk=medium, scope=architecture_change — design_required is true. Ticket minting deferred to /sprint:design."
external_service_dependencies:
  status: possible
  required: []
  possible:
    - "gh CLI (already a runtime dep elsewhere in WarpOS) — used by /products:new --create-remote for `gh repo create --private`. Requires the user to be authenticated; failure mode is well-defined."
    - "GitHub API (via gh CLI) — same; only invoked when --create-remote is passed."
  notes: "No new services. Only existing gh authentication is exercised, and only behind an opt-in flag."
approval_boundaries:
  - "git push origin main on the canonical WarpOS public repo — standard 'Ask first' per CLAUDE.md."
  - "gh repo create --private on the user's GitHub — gated behind --create-remote flag AND explicit user approval per /products:new invocation. Not auto-fired by turbo scope."
  - "Moving _docs/briefs/dreamteams/ and _docs/clones/companycam/ out of canonical — destructive in the sense that the files leave canonical's working tree. Confirmed they're untracked, so no history-level loss, but operator should confirm before the move runs."
  - "Adding new paths.* keys to canonical .claude/paths.json and framework/paths.registry.json — schema-level change that propagates to consumers via /warp:update; not blocking but Beta-flagged."
  - "Adjusting canonical .gitignore — alters which untracked files are visible in `git status`. Operator-visible, not destructive."
