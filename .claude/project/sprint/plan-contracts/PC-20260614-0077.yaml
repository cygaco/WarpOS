  - "Do not add a new auth provider (reuse the founder allowlist)."
  - "Do not let any product-facing 'WarpOS' string ship (brand boundary)."
  - "Do not push to remote without explicit in-session approval (operator has standing push/merge freedom; the orchestrator never pushes)."
