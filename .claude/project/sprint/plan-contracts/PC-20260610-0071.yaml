  recommended: "All three W1 gaps + planted tests. G2 via option (i) dispatch-claude --review-fallback (single recorded wrapper lane, route-guard-blessed); G5 breaker module + providers.js write/consult + fail-open; G4/N4 detectAuthTier content-parse + envelope stamp."
  expanded: "Above + extend the breaker consult to dispatch-readiness's status row + a /scan-runnable breaker-staleness surface — only if additive/report-only."
assumptions:
