sprint: SP-20260610-007
source_request: "Conduct W1 of E-DISPATCH-SHAPE-001 (availability and fallback real) as SP-20260610-007. Three tickets per the epic's Current next action + NOTAGAIN §7 W1 + audit gaps G2/G4/G5/N4. All three touch providers.js — sequential where shared."
source_request_verbatim: "W1 — make availability and fallback real. (1) Recorded claude-fallback review lane (G2): ONE sanctioned, LEDGERED door for claude-fallback reviews when cross-providers are down — the record must visibly trip cross_provider_required in coverage-gate (honest debt, NOT silent satisfaction); gauntlet-verify must SEE the lane (planted fixture); respect dispatch-route-guard (wrapper route allowlisted, raw claude -p stays non-build-only). (2) Provider circuit breaker (G5): providers.js writes a provider-down state file (.claude/runtime/provider-down.json or similar) on quota_exhausted classification with a TTL (gemini's own reset when parseable, else default ~30m); dispatch wrappers consult it BEFORE spawning and fail fast with the breaker info (no blind retry storms); fail-open on breaker-file faults; planted re-burn test. (3) Auth-posture surface (G4/N4, ROADMAP item 6): parse codex auth.json auth_mode (value-free — mode label only, never key material); fix the detectAuthTier metered-as-oauth misreport; dispatch-readiness/provider-tier rows show key(metered) vs oauth(plan); quota error envelopes from providers.js include the auth mode. PLANTED tests per ticket; goldens before/after on touched wrappers."
request_type: bug_fix_batch
interpreted_intent: "Make the dispatch stack DEGRADE HONESTLY when providers go down: a claude fallback review is recorded + visible (not invisible to gauntlet-verify); a quota-dead provider is not re-burned; and the auth posture that caused 3 days of unseen metered billing is one read away. W1 of the dispatch-shape epic — does NOT flip ENFORCE or make the resolver the only door (that is W2)."
user_or_business_outcome: "When both cross-providers are quota-dead, a claude review lane is LEDGERED and gauntlet-verify sees it (no blind spot at the highest-risk moment); a quota-dead provider is short-circuited before another blind retry burns it; and a metered codex key reads as 'key (metered)' instead of being misreported as funded oauth — closing the 3-day metered-drain class. Each guarded by a planted-violation test."
affected_surfaces:
  - surface: "G2 — recorded claude-fallback review lane: scripts/dispatch-claude.js (--review-fallback non-build mode) OR scripts/sprint/epsilon-runtime.js record-inprocess (--fallback-from); + scripts/hooks/dispatch-route-guard.js (allowlist the route); + coverage-gate visibility"
    evidence_level: verified_from_repo
    notes: "Today: dispatch-agent exits 2 on provider=claude; raw `claude -p --agent` writes NO record (ED-018, invisible to gauntlet-verify); record-inprocess hard-refuses non-CLAUDE_AGENT/AGENT_TOOL routes (epsilon-runtime.js:492-497) so backend-reviewer/qa-reviewer (DISPATCH_AGENT route) are un-recordable. coverage-gate.js:155 ALREADY trips on `coverage.cross_provider_required && hit.provider==='claude'` — so a claude record for a cross-provider role VISIBLY shows as the debt (exactly right). DECISION (β): option (i) dispatch-claude --review-fallback non-build mode (no -w gate; already writes records + handles any role token; route-guard points fallback traffic here) vs option (ii) record-inprocess --fallback-from carve-out (stamps fallback:true, provider:claude, quotaFallbackFrom). Recommend (i) dispatch-claude --review-fallback: it's a REAL recorded subprocess lane (gauntlet-verify sees a normal completion record), single-wrapper, and route-guard can bless ONE explicit mode instead of raw claude -p; (ii) only covers the Agent-tool (top-level α) path. The record must carry fallback:true + the cross-provider origin so coverage-gate:155 trips visibly."
  - surface: "G5 — provider circuit breaker: scripts/hooks/lib/providers.js (write on classifyQuotaFailure; consult in providerAvailable ~L458) + a new breaker module (e.g. scripts/dispatch/provider-breaker.js) + the dispatch wrappers consulting before spawn"
    evidence_level: verified_from_repo
    notes: "classifyQuotaFailure (providers.js:172) returns {kind:'quota_exhausted',recoverable:true}. No breaker exists. Fix: on quota_exhausted, write .claude/runtime/provider-down.json {provider→{kind,until,evidence}} with a TTL (parse gemini 'resets after Xh' when present, else default ~30m); providerAvailable() (L458) consults it (provider is 'down' until TTL); wrappers fail fast with breaker info instead of re-spawning into the dead window. FAIL-OPEN on any breaker-file fault (unreadable/corrupt/missing → provider treated as available — a broken breaker must NEVER block a healthy provider). Surface in dispatch-readiness."
  - surface: "G4/N4 — auth-posture surface: scripts/checks/dispatch-readiness.js#detectAuthTier (L116-127 openai branch) + scripts/hooks/lib/providers.js (quota error envelope) + provider-tier rows"
    evidence_level: verified_from_repo
    notes: "detectAuthTier (dispatch-readiness.js:122-124) does `loggedIn = authFiles.some(exists)` then `if (loggedIn) return tier:'oauth'` — treats mere EXISTENCE of ~/.codex/auth.json as oauth. But `codex login --with-api-key` ALSO writes auth.json (with auth_mode + OPENAI_API_KEY — the 2026-06-07 incident file), so a metered key is misreported as oauth/paid (provider-tier-check inherits oauthFunded=true). Fix: PARSE auth.json content — auth_mode/OPENAI_API_KEY present → tier 'key' detail 'key (metered)'; tokens (access/refresh) present → 'oauth' detail 'oauth (plan)'. VALUE-FREE: read only the MODE label, NEVER key material. Stamp the auth mode into providers.js quota error envelopes (classifyQuotaFailure call site) so the next misdiagnosis is one read away."
  - surface: "Planted-violation tests (3) + goldens: a fallback claude record SEEN by gauntlet-verify + tripping cross_provider_required; a quota_exhausted re-burn blocked by the breaker; a metered auth.json reading 'key (metered)' not 'oauth'"
    evidence_level: inferred_from_repo
    notes: "G2: planted fixture — a fallback claude completion record for a cross-provider role is SEEN by gauntlet-verify AND coverage-gate flags it cross_provider_required (visible debt). G5: planted re-burn — a second dispatch into a quota-dead window is short-circuited by the breaker (no re-spawn); fail-open when the breaker file is corrupt. G4/N4: planted — a metered auth.json (auth_mode+OPENAI_API_KEY) reads tier 'key (metered)', NOT 'oauth'; a token auth.json reads 'oauth'."
current_behavior:
  evidence_level: verified_from_repo
  notes: "G2: no sanctioned recorded claude-fallback lane — raw claude -p writes no record, Agent-tool writes no record, record-inprocess refuses cross-provider routes; gauntlet-verify blind when providers down. G5: no circuit breaker anywhere; a quota-dead provider re-burned every dispatch (6 prompts x 3 retries into the dead window). G4/N4: detectAuthTier reports a metered codex key as oauth/paid (existence-only check); provider-tier inherits the lie; the 3-day metered drain was invisible. All live-reproduced in the audit."
desired_behavior: "G2: ONE sanctioned ledgered claude-fallback review lane; a claude record for a cross-provider role is recorded, SEEN by gauntlet-verify, and visibly trips cross_provider_required (honest debt). G5: providers.js writes provider-down.json on quota_exhausted (TTL'd); wrappers consult before spawn + fail fast; fail-open on breaker faults; no re-burn. G4/N4: detectAuthTier parses auth.json content — metered key reads 'key (metered)', oauth reads 'oauth (plan)'; provider-tier + quota envelopes carry the mode. Three planted tests green."
scope:
  size: m
  risk_level: high
  complexity_drivers:
    - "all three tickets touch providers.js — sequential builds (chained worktrees) to avoid shared-file conflicts; G2 may also touch dispatch-claude.js + route-guard, G5 a new breaker module + wrappers, G4 dispatch-readiness.js"
    - "G5 breaker MUST fail-open on any file fault — a broken breaker that blocks a healthy provider is worse than no breaker; the fail-open path is the load-bearing safety property"
    - "G2's recorded lane must trip cross_provider_required VISIBLY (the record is honest debt, NOT silent coverage satisfaction) — getting this backwards would let a claude-only gauntlet read as cross-provider-satisfied (the exact anti-pattern)"
    - "G4 must be VALUE-FREE — read only the auth_mode label, NEVER key material into logs/envelopes (a key leak would be a security regression)"
    - "the W0 lesson (fix-all-callers): G5's breaker-consult + G4's auth-read must cover ALL relevant call sites/providers, not 3-of-4 (the W0 runProvider miss)"
