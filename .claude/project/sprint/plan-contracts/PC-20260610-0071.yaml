  - "Option (i) dispatch-claude --review-fallback is the better G2 home (real recorded subprocess lane, single wrapper, route-guard-blessable) — to be ratified by β."
  - "The breaker file lives under .claude/runtime/ (gitignored, per-project runtime state — correct home, not a shipped asset)."
  - "auth.json content carries auth_mode and/or OPENAI_API_KEY for a metered key, and access/refresh tokens for oauth — parse for the MODE, never the value."
open_questions:
