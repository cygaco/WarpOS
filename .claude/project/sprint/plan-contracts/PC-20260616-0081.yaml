  - Wire epsilon-runtime.js to consult through the door at its spawn point
  - "Migrate dispatch-agent.js + dispatch-claude.js to the door, preserving current report-only + sanctioned-lane behavior"
  - "Add planted-violation tests for both modes + kill-switch + fail-open"
  - "Document the door + ramp + kill-switch in the dispatch guide and epsilon.md"
workstream_candidates:
