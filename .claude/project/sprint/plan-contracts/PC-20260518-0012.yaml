  - "H-2: As a framework operator, a future payload-shape change in Claude Code's hook contract surfaces as a warning at the next Edit/Write, not as silent behavior drift weeks later."
  - "H-3: As an operator debugging RAM pressure, I can run /check:node-procs to see exactly which Node processes are alive, when they started, and what they were running."
  - "H-4: As a Ralph-loop reader, the operational-loop reference doc tells me explicitly when run_in_background is safe and when it orphans children."
