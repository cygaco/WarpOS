  - "Implement scripts/portfolio/status.js — read each product's RELEASES.md + .session-checkpoint.json, emit aggregate"
  - Write .claude/commands/portfolio/list.md skill spec
  - "Write .claude/commands/portfolio/sync.md skill spec (parallel-by-default, --serial escape hatch)"
  - Write .claude/commands/portfolio/status.md skill spec
  - "Add telemetry events portfolio_listed, portfolio_synced, portfolio_status_emitted to logger taxonomy"
