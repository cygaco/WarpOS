    - "Cross-repo subprocess invocation contract for scripts/warpos/update.js has not been exercised — design must validate or scope-cut"
    - "DreamTeams repo doesn't exist yet — seed entry will be placeholder; round-trip test runs against a stub"
  fail_reasons: []
