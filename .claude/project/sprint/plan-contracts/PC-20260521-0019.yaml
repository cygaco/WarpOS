  isolation_notes: "Additive across .claude/portfolio/, .claude/commands/portfolio/, scripts/portfolio/. No conflict with existing sprints; no modification of scripts/warpos/update.js."
beta_review:
  required: true
  likely_founder_rejection_risks:
    - "Portfolio model over-engineered for a one-product (DreamTeams) reality"
    - "Manifest schema locks in too early — DreamTeams may want fields not anticipated here"
    - "/portfolio:sync's cross-repo invocation introduces a new permission boundary user hasn't thought about"
    - "Scope is bigger than 'just an index' — operator may want minimal_safe to validate appetite first"
  overbuild_risks:
    - "Building /portfolio:status before there is portfolio-wide signal worth aggregating"
    - Inventing a portfolio asset class in framework-manifest.json before a single product has consumed it
    - Writing schemas/portfolio/manifest.schema.json before knowing what fields actually matter
    - "Coupling portfolio model to DreamTeams' validation-layer-as-vocabulary bet before DreamTeams ships"
  missing_context_risks:
    - Whether the operator has already chosen a sibling-repo location convention
    - "Whether dream-team-kit (vrwithkr/dream-team-kit) is the first portfolio entry or a separate concern"
    - "Whether the portfolio model is a personal-OS feature or a public-API surface (affects what gets published)"
