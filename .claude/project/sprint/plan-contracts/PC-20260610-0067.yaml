source_request: "Lane A — ship/install integrity fixes from the 2026-06-10 WARPOS.md sweep (runtime/notes/warpos-md-sweep-2026-06-10.md, §Lane A). Five items, all verified reproducing at canonical @75cd7e5, plus the class-closing enforcer extension."
source_request_verbatim: "Lane A — ship/install integrity fixes from the 2026-06-10 WARPOS.md sweep (runtime/notes/warpos-md-sweep-2026-06-10.md, §Lane A). Five items, all verified reproducing: (1) doogle WG-1: ship scripts/dispatch-claude.js + scripts/dispatch/dispatch-claude.test.js in the framework manifest generator (scripts/generate-framework-manifest.js top_script entries) so products receive the mandatory build-chain wrapper; (2) doogle WG-9: scripts/sprint/release.js regressionSeedGate must detect product-vs-canonical BEFORE require('../testsuite/enforce') — product repos no-op exit 0 without the module existing; canonical unchanged mandatory; add a product-role fixture to scripts/sprint/test-regression-seed-gate.js; (3) almanac AL-W-007: ship .claude/runtime/package.json {\"type\":\"commonjs\"} in the scaffold/install payload (same pattern as the existing scripts/package.json WG-9 pin); (4) almanac AL-W-004: add the scaffolded-brief-location pointer to the scaffold's PROJECT.md template; (5) E-LIFECYCLE-001 step 4 (operator pre-authorized): fix pre-existing broken test tests/regression/SP-20260518-007/check-ac-coverage.test.js (stale check/->scan/ path from SP-20260528-001 + missing real-tree fixture) — repoint + restore fixture, or retire with evidence if superseded. PLUS the class-closing enforcer: extend scripts/checks/warpos-install-baseline.js (fail-closed, non-zero exit per beta) to assert every script path mandated by a guard's remediation message / required by a shipped gate exists in the ship payload."
request_type: bug_fix_batch
interpreted_intent: "Convert four ship/install-integrity defects + one silently-broken regression test from 'present in canonical but never reaching products / failing closed wrongly / crashing the suite' into shipped, honest, gated state — and close the underlying closed-trap CLASS once via a ship-payload enforcer so the same gap can't recur silently. Each fix is file-disjoint from Lane B (no .claude/agents/** specs, no dispatch-contract.json, no role-parity-scan.js, no epsilon.md)."
user_or_business_outcome: "Products that install/update WarpOS receive the mandatory build-chain wrapper (dispatch-claude.js) the dispatch guides tell them to use; product repos can close sprints without the regression-seed gate falsely blocking on a canonical-only module; scaffolded products get the CommonJS runtime pin (no ESM-inherit breakage of ad-hoc runtime .js) and a PROJECT.md that points to the scaffolded brief; the test suite is honestly green (no top-level ENOENT crash masquerading as a pass); and the closed-trap class is mechanically self-detecting at /scan:full going forward."
affected_surfaces:
  - surface: "scripts/generate-framework-manifest.js TOP_LEVEL_SCRIPTS (WG-1)"
    evidence_level: verified_from_repo
    notes: "CONFIRMED: only dispatch-agent.js is in TOP_LEVEL_SCRIPTS (L293); scripts/dispatch-claude.js (top-level, 22296 bytes) has NO path to inclusion (generator only walks scripts/<subdir> + the explicit top-level list). The .test.js lives under scripts/dispatch/ which DOES ship via the dispatch_engine ASSET_DIR (L208) — verify it's actually emitted; the load-bearing add is the top-level wrapper itself."
  - surface: "scripts/sprint/release.js regressionSeedGate (WG-9, L98-147)"
    evidence_level: verified_from_repo
    notes: "CONFIRMED: run() calls require('../testsuite/enforce').run(opts) INSIDE the try; in a product repo where testsuite/enforce.js was never shipped, the require throws and is caught as runner_error -> exit 3 (BLOCK), not the intended product no-op exit 0. The product-vs-canonical role detection must precede the require. Canonical behavior MUST be unchanged (still mandatory, still fail-closed on real regression/runner-error)."
  - surface: "scripts/sprint/test-regression-seed-gate.js (WG-9 fixture)"
    evidence_level: verified_from_repo
    notes: "Add a product-role fixture asserting the BEFORE-require product no-op path: when role=product and the module is absent, gate returns 0 (no throw, no exit 3). Tests A-G already exist; B stubs product opt-in but does not exercise the missing-module require path. Keep A-G green."
  - surface: ".claude/runtime/package.json (NEW — AL-W-007) + its inclusion in the ship/install payload"
    evidence_level: verified_from_repo
    notes: "CONFIRMED absent. Mirror scripts/package.json ({\"type\":\"commonjs\"} + the WG-9 rationale comment). Must SHIP: the generator currently EXCLUDES .claude/runtime/ wholesale (EXCLUDE_RELATIVE_PREFIXES L65). Ship it via a narrow allowlist (TOP_LEVEL_FRAMEWORK_FILES-style single-file entry or a targeted exclude carve-out) OR the scaffold/install payload path — DoE picks the mechanism; the test is that an installed/scaffolded product has .claude/runtime/package.json = type:commonjs."
  - surface: "scaffold PROJECT.md template (AL-W-004)"
    evidence_level: inferred_from_repo
    notes: "setup.js findExistingBrief() auto-detects but the PROJECT.md template lacks the brief-location pointer line. Locate the actual scaffold template (framework/templates/** likely) and add a docs line pointing at the scaffolded brief location. Verify the template is the one the scaffolder renders."
  - surface: "tests/regression/SP-20260518-007/check-ac-coverage.test.js (E-LIFECYCLE step 4)"
    evidence_level: verified_from_repo
    notes: "CONFIRMED two defects: (a) L147 reads .claude/commands/check/ac-coverage.md but SP-20260528-001 moved it to .claude/commands/scan/ac-coverage.md -> top-level ENOENT throw (process crashes AFTER prose test 'passes', so the suite is silently broken — a real fail-closed hole); (b) test_check_ac_coverage_json_output_shape expects total_acs etc., but check-ac-coverage.js --json returns {gate_applicable:false, error:'acceptance-criteria.md missing'} because the SP-20260518-007 requirements fixture isn't on the real tree. Repoint check/->scan/ AND restore/point a real-tree fixture so --json returns the populated shape, OR retire with evidence if superseded. check-ac-coverage.js EXISTS at scripts/sprint/ (the require at L20-22 resolves)."
  - surface: "scripts/checks/warpos-install-baseline.js --guard-remediation (the class-closing enforcer)"
    evidence_level: verified_from_repo
    notes: "Today --guard-remediation scans scripts/hooks/*.js remediation strings and asserts the named script exists on canonical DISK (fs.existsSync against REPO_ROOT). The Lane A extension: assert every guard-mandated path (and every script path a SHIPPED gate requires) exists in the SHIP PAYLOAD (.claude/framework-manifest.json assets), not merely on disk — that is what catches WG-1/WG-9 (file present in canonical, absent from the install). Fail-closed, non-zero exit per beta. Keep the existing on-disk check; ADD the manifest-coverage assertion."
  - surface: "_warpos/MANIFEST.json + .claude/framework-manifest.json (regen BOTH last)"
    evidence_level: verified_from_repo
    notes: "WG-1 + AL-W-007 add hash-tracked ship entries; the new enforcer + restored fixture are hash-tracked scripts/tests. Regen BOTH manifests as the LAST step before commit (BC-02/BC-05/sprint-close)."
current_behavior:
  evidence_level: verified_from_repo
  notes: "All five reproduce at canonical @75cd7e5 (verified this session by reading each file): WG-1 dispatch-claude.js not in TOP_LEVEL_SCRIPTS; WG-9 require() inside the gate try -> product repos block at exit 3; AL-W-007 .claude/runtime/package.json absent + .claude/runtime/ wholesale-excluded from the manifest; AL-W-004 PROJECT.md template lacks the brief pointer; E-LIFECYCLE step4 test crashes with ENOENT on the stale check/ path + expects a fixture-backed --json shape that isn't on the tree. The enforcer asserts on-disk existence only, so it cannot catch a canonical-present/install-absent file."
desired_behavior: "dispatch-claude.js + its test ship to products via the manifest generator; regressionSeedGate detects product-vs-canonical BEFORE the require so product repos no-op exit 0 (canonical unchanged: mandatory + fail-closed on real regression/runner-error); .claude/runtime/package.json = type:commonjs ships in the scaffold/install payload; the scaffold PROJECT.md template carries the brief-location pointer; tests/regression/SP-20260518-007/check-ac-coverage.test.js passes cleanly (scan/ path + real fixture) with no top-level throw; warpos-install-baseline.js fails closed (non-zero) when any guard-mandated or shipped-gate-required script path is absent from the ship payload. Both manifests regenerated; Lane B files untouched."
