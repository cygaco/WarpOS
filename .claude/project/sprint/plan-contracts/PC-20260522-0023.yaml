current_behavior:
  evidence_level: verified_from_repo
  notes: "Install + update currently rely on .claude/framework-installed.json + framework-manifest.json (per-file kind/sha but no ownership classes, no user-override tracking, no rollback snapshot). /warp:update --dry-run is parsed but does not gate writes in all paths. release-build.js does not check manifest freshness before snapshotting into a capsule (manifest-coverage drift caused dreamteam's mode-set bug 2026-05-21). Settings.json is a hand-edited per-project file with no compile step. Hooks gate-test installs manually after each release; no CI matrix."
desired_behavior: "Every framework file is enumerated in _warpos/MANIFEST.json with owner (framework|generated|project|runtime), source sha256, current sha256, and userModified flag. /warp:setup is idempotent and reports per-file unchanged/repaired/added/conflict. /warp:update --dry-run lists every change before applying — framework/project/user-owned/conflicts — and `--apply` writes a rollback snapshot so /warp:rollback <update-id> reverts framework files without touching user files. release-build.js refuses to snapshot a capsule when manifest is stale. /check:warpos-manifest-coverage flags any on-disk path not enumerated. /check:framework-views-fresh fails the build when .claude/commands or .claude/agents drift from _warpos/ source. /check:framework-purity refuses commits to _requirements/ or _docs/ at canonical root and rejects client slugs / maintainer abs paths / product spec titles. .claude/manifest.json is always present at install; the four CLIs that hardcode it tolerate absence + warn + fall through. CI matrix exercises clean / existing / dirty / multi-version / user-override install scenarios on every PR."
scope:
  size: xl
  risk_level: high
  complexity_drivers:
    - "Depends on _warpos/MANIFEST.json schema from Sprint 1 — Sprint 2 can only progress as far as Sprint 1's schema is stable"
    - "Three-layer settings.json compiler has to handle hook-command and permission conflicts deterministically — incorrect merging silently breaks installs"
    - "Rollback snapshot must work for users with dirty repos (uncommitted changes) — can't rely solely on git"
    - Versioned migrations need a backward-compat story for products upgrading from pre-MANIFEST installs
    - "Install fixture CI matrix is greenfield — 5 scenarios × N WarpOS versions × CI minutes"
    - "User-override tracking is a UX trap: too aggressive surfaces noise, too lax silently overwrites local work"
scope_variants:
  minimal_safe:
    summary: "Ship the manifest-coverage check + release-build stale-manifest refusal + .gitignore runtime-leak gap + .claude/manifest.json present-at-install. Defer the new MANIFEST.json schema work (depends on Sprint 1), the dry-run + rollback, the install fixture CI matrix to Sprint 3 or later."
    tradeoffs:
      - Closes the dreamteam regression class fast
      - "Doesn't structurally improve update UX"
      - "Skips the cadence rule's framework reliability deliverable"
  recommended:
    summary: "Ship manifest-coverage + stale-manifest refusal + manifest.json present + .gitignore extension + the new _warpos/MANIFEST.json generator/validator/regenerator + settings.json compiler (v1 defaults pass-through, two-layer for now) + /check:framework-views-fresh + /check:framework-purity gates. Defer rollback snapshot and install fixture CI matrix to a polish sprint."
    tradeoffs:
      - "Captures the Sprint 1 architecture's downstream needs in the same window"
      - Two new CI gates increase release time
      - Rollback gap still leaves dirty-repo users vulnerable
  expanded:
    summary: "Recommended + rollback snapshot + install fixture CI matrix + versioned migrations with full user-override tracking + idempotent install with per-file status."
    tradeoffs:
      - Sprint duration doubles
      - CI matrix demands non-trivial fixture authoring
      - Highest pay-off in install reliability
assumptions:
  safe:
    - Sprint runs on branch sprint/SP-20260522-002
    - "Sprint 1's _warpos/MANIFEST.json schema lands before Sprint 2 implementation begins"
    - "Existing manifest infrastructure (scripts/generate-framework-manifest.js) becomes the base for the new generator"
