sprint: SP-20260522-002
source_request: "Sprint 2 of the ROADMAP — Install & Release Integrity. Make WarpOS installs boring. Builds on Sprint 1's _warpos/MANIFEST.json by adding the manifest-coverage check, the release-build refusal of stale manifests, .claude/manifest.json always-present + graceful absence in callers, the post-update check provenance fix, the runtime-leak .gitignore gap, idempotent install with per-file status, /warp:update --dry-run + diff, versioned migrations + user-override tracking, the _warpos/MANIFEST.json generator + validator, the generated-views regenerator, the three-layer settings.json compiler, /check:framework-views-fresh + /check:framework-purity gates, rollback snapshot for /warp:update, and the install fixture CI matrix."
source_request_verbatim: |
  Read roadmap.md and proceed with the first 3 sprints, using /sprint:full --turbo for each.
  
  ROADMAP.md ## Now: Install & Release Integrity (the in-scope text for this sprint, 2026-05-22):
  
  Sprint-2 target. Reason: dreamteam's first sprint hit a manifest gap that broke /mode:adhoc --turbo despite framework-installed.json claiming a complete install. The pattern recurs — installs claim completeness, manifest snapshots get stale, capsules drift from source. Make WarpOS installs boring.
  
  [fixed-local] Manifest generator missed 15 scripts/ subdirs + mode-set.js — to ship in this release.
  
  [open] Manifest-coverage regression check (/check:warpos-manifest-coverage).
  [open] release-build.js refuses stale manifest.
  [open] .claude/manifest.json always-present at install + graceful absence in callers.
  [open] release-build post-update check provenance (resolve 0.1.4-era bug class).
  [open] Runtime-leak .gitignore gap.
  [open] Idempotent install with per-file status reporting (codex stay-simple must-have).
  [open] Update dry-run + diff (codex stay-simple must-have).
  [open] Versioned migrations + user-override tracking in _warpos/MANIFEST.json (codex stay-simple must-have).
  [open] _warpos/MANIFEST.json generator + validator (scripts/warpos/manifest/build.js + validate.js).
  [open] Generated-views regenerator (scripts/warpos/views/regenerate.js).
  [open] Three-layer settings.json compiler.
  [open] /check:framework-views-fresh CI gate.
  [open] /check:framework-purity canonical gate.
  [open] Rollback snapshot for /warp:update.
  [open] Install fixture CI matrix.
request_type: feature_add
interpreted_intent: "Harden the WarpOS install + update + release pipeline so installs become boring (predictable, dry-runnable, rollbackable, regression-tested). Implement the _warpos/MANIFEST.json generator/validator/regenerator from Sprint 1's schema; add coverage + freshness gates that refuse stale or drifted state; surface install/update changes per-file (dry-run + diff + rollback); track user-overrides so updates don't silently overwrite local work; ship the three-layer settings.json compiler; add an install-fixture CI matrix that exercises clean repo / existing install / dirty repo / multi-version-upgrade / user-override scenarios."
user_or_business_outcome: "Maintainer and downstream products experience update reliability as a default, not a luxury. /warp:update --dry-run shows exactly what will change before committing. Manifest-coverage gates catch 'forgot to register new framework content' before release. Rollback snapshots let any update be undone. CI gates refuse stale generated views and product leaks from being shipped. The hollow-claim class (e.g. dreamteam manifest gap that claimed complete but broke /mode:adhoc --turbo) becomes structurally impossible."
