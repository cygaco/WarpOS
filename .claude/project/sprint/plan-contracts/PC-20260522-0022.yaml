current_behavior:
  evidence_level: verified_from_repo
  notes: "WarpOS today has no enforced boundary between 'framework source' and 'maintainer product workspace' inside a single checkout. /warp:promote enables bidirectional sync from a product repo into canonical WarpOS; this has leaked maintainer product data (Jobzooka-titled files) into the publicly-pushed canonical clone. Sync is bidirectional via /warp:promote (product→canonical) and /warp:update (canonical→product). The flag ledger (warpos-to-update.md), the promote suite, and supporting path-registry keys are still present and tracked. Tool-mandated paths (.claude/commands, .claude/agents, .claude/settings.json) are the only source-of-truth — no separate _warpos/ zone exists. .claude/settings.json is a single hand-edited file."
desired_behavior: "Canonical WarpOS at github.com/cygaco/WarpOS contains framework/, scripts/, tests/, CLAUDE.md, AGENTS.md, ROADMAP.md, RELEASES.md, README.md — and explicitly NO _requirements/ or _docs/ at root. Installed products gain _warpos/ as the framework source-of-truth zone with MANIFEST.json declaring per-path ownership; .claude/commands and .claude/agents become byte-identical generated views from _warpos/ committed to git; .claude/settings.json is compiled deterministically from _warpos/settings/defaults.json + .claude/settings.local.json. No /warp:promote, /warp:flag, /warp:promote-flags skill, no warpos-to-update.md ledger, no promote-era keys in paths.registry.json. Five structural gates refuse drift back. Existing products migrate via a one-time script. A grep for 'warp:promote|warp:flag|warpos-to-update' in canonical returns zero hits outside ROADMAP archive references."
scope:
  size: xl
  risk_level: high
  complexity_drivers:
    - "Cross-cutting change touching skills, scripts, paths registry, schemas, hook configs, agent specs, top-level docs, .gitignore — every layer at once"
    - "Irreversible-ish: deleting /warp:promote is a one-way door for maintainer workflow; needs a private-workspace landing first"
    - "Maintainer-only step inside the sprint: create a NEW PRIVATE repo for WarpOS-as-product and move product-titled specs out — the framework cannot self-execute this"
    - "Push to canonical GitHub is required to remove warpos-to-update.md from public history (normal commit, no force-push) — gated by CLAUDE.md autonomy ceiling"
    - "Five new structural gates need design + implementation before they can refuse drift back"
    - "Migration plan must work on Jobzooka, DreamTeam, and the canonical-as-workspace clone simultaneously — three target shapes"
    - "_warpos/MANIFEST.json is a new schema; downstream code (install, update, view-regenerator, settings-compiler) consumes it before it's stable"
    - "Generated-views discipline requires both _warpos/ source and .claude/ view to be committed together — every PR touches twice as many paths"
scope_variants:
  minimal_safe:
    summary: "Purge only — delete /warp:promote, /warp:promote-flags, /warp:flag, warpos-to-update.md, supporting scripts, path-registry keys, references. Add the canonical pre-commit guard refusing reintroduction. Defer the _warpos/ zone, MANIFEST.json, generated-view discipline, settings.json compiler, and migration plan to Sprint 2 or later. No GitHub push yet — purge lands on a branch, reviewed before merge."
    tradeoffs:
      - "Closes the leak vector fastest (one PR)"
      - "Leaves the architectural debt (ownership ambiguity, generated views, settings compiler) unaddressed"
      - "Sprint 2's manifest-driven gates have no manifest to consume"
      - Maintainer still owns the product-vs-framework boundary manually
  recommended:
    summary: "Purge + _warpos/ zone + MANIFEST.json schema + canonical scrub + the 5 structural gates as stubs (pre-commit guard real; the 4 CI gates as failing-by-default stubs with TODOs). Migration plan documented but not executed against products (Jobzooka, DreamTeam migrate in a follow-up sprint). Three-layer settings.json compiler exists but with a one-input pass-through default (compiles defaults only) — full layered compile happens in Sprint 2. Maintainer creates the new private workspace OUT-OF-BAND during the sprint and the framework only verifies the canonical scrub."
    tradeoffs:
      - "Captures the architectural intent in one sprint; Sprint 2 only has to harden, not invent"
      - "Stubs the CI gates so the architecture is enforceable from day 1, even if shallow"
      - "Doesn't fully migrate downstream products this sprint — surfaces in product repos as 'pre-migration' state"
      - "Maintainer-only step (private repo creation) becomes a hard halt mid-sprint — orchestrator will surface it"
  expanded:
    summary: "Recommended + execute the migration against Jobzooka, DreamTeam, and the maintainer's canonical-as-workspace clone within the same sprint. Ship the full three-layer settings.json compiler with conflict detection. Run /check:framework-views-fresh and /check:framework-purity in CI for canonical and at least one product."
    tradeoffs:
      - "Doubles the sprint duration; multi-day at minimum"
      - Three concurrent product migrations risk uncoordinated drift
      - Forces Sprint 2 scope to shrink to mostly polish
      - "Validates the architecture under real use earlier — fewer surprises in Sprint 2"
