  required: true
  likely_founder_rejection_risks:
    - "Gates that block legitimate updates on transient yellows (operator gets a worse experience, not a better one)."
    - "Rollback that loses operator changes (snapshot must include uncommitted work)."
    - "Building features for failure modes that aren't the actual recurring ones."
  overbuild_risks:
