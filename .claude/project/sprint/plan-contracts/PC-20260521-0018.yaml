sprint: SP-20260520-002
source_request: "Plan a new skill /product:import (renamed mid-prompt from product:convert) that, given the current project context, generates a comprehensive paste-friendly questionnaire for ANOTHER session running in another project — Claude Code, Codex, Claude (web app), ChatGPT (web app), or Gemini (web app) — so that session can answer detailed questions about the product being built there. Answers come back to feed /product:bootstrap. Positioned as a pre-step to /product:bootstrap. Workflow: run /product:import in target project → paste questionnaire elsewhere → bring answers back → /product:bootstrap with answers. Goal: convert a product that is trapped in a non-Claude-Code project (older repo, ChatGPT thread, scattered notes) into a proper Claude Code project with enough context that /product:bootstrap can create real requirements for features that already exist."
source_request_verbatim: |
  # Extending the `product` skill suite
  
  ## Product Cloning
  
  /sprint:plan --turbo a `product:clone` skill that intakes information about a product, explores the product, and creates high-level requirements that can be used to clone it.
  
  ### Information Sources
  
  Possible information sources are:
  1. Videos about the product
  2. Website for the product
  3. Reviews and adjacent information for the product
  4. Other types of sources along these lines
  
  ### Product Exploration Requirements
  
  Ensure that the following are included in your product exploration:
  1. If watching a video about a product, and you do not have a name for it, find the name and search the web about it (including its own website)
  2. If browsing a product's website, discover links to crawl and find them.
  3. Attempt to find reviews.
  
  ### Deliverables
  
  The skill should deliver:
  1. JTBDs of their Product
  2. Feature list, with complexity to build and how 'core' a feature is to their Product
  3. What their users say about it
  4. Gaps in their Product
  5. Opportunities we can capitalize on
  
  ### Goal
  
  The goal of this skill is to enable me to rapidly deploy clones or competing products to companies that I want to kill.
  
  ## Product Mining
  
  /sprint:plan --turbo a skill that basically spits out questions for another claude session in another project to answer about the product being built.
  
  Make sure it works for claude code, codex, claude (just normal app), chatgpt (just normal app), etc
  
  It should basically be a pre-step to the product:bootstrap skill
  
  It should be called `product:convert`
  
  ### Goal
  
  Convert a product from being trapped in a simpler type of project to a claude code project, with enough context to run `product:bootstrap` and create requirements for existing features.
  
  [follow-up message from user: Actually instead of 'product:convert' make it 'product:import']
request_type: feature_add
interpreted_intent: "Create a new skill /product:import in .claude/commands/product/ that, run in the target project, inspects local context (PROJECT.md, README, package.json, last N commits) and emits a single paste-friendly Markdown questionnaire artifact at _docs/imports/<slug>/<slug>.questionnaire.md. The questionnaire is structured to be paste-compatible across five target surfaces: Claude Code, Codex, Claude web app, ChatGPT web app, Gemini web app. Sections mirror /product:bootstrap's section set so answers can be brought back and consumed by /product:bootstrap --answers-file. User renamed the skill from /product:convert to /product:import mid-prompt — final name is import."
user_or_business_outcome: "Operator can rescue a product 'trapped' in a simpler project (older repo, ChatGPT thread, scattered notes) and convert it into a proper Claude Code project with enough context that /product:bootstrap can create real requirements for features that already exist. Removes the manual interview burden when the source-of-truth lives in another session or tool."
