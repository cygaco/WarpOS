  - surface: ".claude/commands/product/bootstrap.md (existing — output contract must align so handoff works)"
    evidence_level: verified_from_repo
    notes: "bootstrap supports --answers-file <path> JSON map keyed by section id. import's output must round-trip into this format."
  - surface: ".claude/commands/product/ponder.md (existing — style/frontmatter reference)"
    evidence_level: verified_from_repo
  - surface: "scripts/product/import.js (new generator)"
    evidence_level: assumed_from_request
    notes: Mirrors scripts/product/bootstrap.js architecture.
  - surface: "framework/templates/product-import/ (new templates dir)"
    evidence_level: inferred_from_repo
    notes: framework/templates/product-bootstrap/ precedent.
  - surface: "_docs/imports/<slug>/ (new output dir)"
    evidence_level: assumed_from_request
  - surface: ".claude/paths.json (add paths.imports, paths.importsCurrent)"
    evidence_level: inferred_from_repo
    notes: Bootstrap precedent for first-emit paths registration.
  - surface: "scripts/product/bootstrap.js --answers-file <path> JSON contract (existing)"
    evidence_level: verified_from_repo
    notes: "Import's paste-back parser must produce this JSON map. The format is observable in scripts/product/bootstrap.js."
current_behavior:
  evidence_level: verified_from_repo
  notes: "/product:bootstrap exists and runs an interactive 4-8-question conversation, writes _docs/briefs/<slug>/<slug>.brief.{md,html,docx}. It accepts --answers-file <path> with JSON keyed by section id. There is no skill that generates a paste-friendly questionnaire for another session. An operator wanting to use bootstrap with an answer file currently has to construct the JSON manually."
desired_behavior: "Operator runs `/product:import` in the project where they want the brief to land. The skill: (a) inspects the project (any existing PROJECT.md, README, package.json, last ~10 commits) bounded read-only for hints; (b) emits a single Markdown questionnaire at _docs/imports/<slug>/<slug>.questionnaire.md containing project-context preamble, one section per /product:bootstrap section (problem, JTBD, value chain, ...), paste-friendly question prompts, and an explicit response-format instruction for the answering session; (c) renders identically enough across Claude Code, Codex, Claude web, ChatGPT web, and Gemini web that it works in all five. Operator pastes into another session, gets answers back, runs `/product:bootstrap --answers-file _docs/imports/<slug>/<slug>.answers.json` (or a paste-back-and-parse helper) to convert answers into a brief."
scope:
  size: m
  risk_level: low
  complexity_drivers:
    - Output must be paste-friendly across 5 different AI surfaces with different markdown rendering and prompt conventions
    - "Answers must round-trip back into /product:bootstrap --answers-file format without manual JSON construction"
    - "Project introspection (read PROJECT.md, README, package.json, recent commits) needs bounded scope — no full audit"
    - "Section parity with /product:bootstrap section set (minimal=8, extended=12) — has to track if bootstrap changes"
scope_variants:
  minimal_safe:
    summary: "Single questionnaire MD output, no project introspection (operator passes name only). No answer-parsing helper — operator manually constructs answers.json or pastes section-by-section."
    tradeoffs:
      - "Operator has to do parsing work — friction"
      - "No introspection — questionnaire is more generic"
      - Easiest to ship
  recommended:
    summary: "Project introspection: read PROJECT.md, README.md, top-level package.json, last 10 commits — extract hints into preamble. Emit questionnaire MD with embedded paste-back format hint. Companion answers-parse helper: when operator pastes answers back, /product:bootstrap --answers-file is auto-callable. Aligned with /product:bootstrap minimal section set (8 sections)."
    tradeoffs:
      - "Introspection adds ~10s to run time"
      - "Answer parser is the riskiest piece — heuristic markdown parser may misalign sections"
      - Matches stated workflow fully
  expanded:
    summary: "Recommended + per-surface presets (--for claude-code/codex/chatgpt/gemini) with subtly tailored prompt phrasing. Per-section response-format examples. Optional --section-set extended (12 sections) matching bootstrap's extended set. Round-trip validation: import → answer → bootstrap → verify all sections drafted."
    tradeoffs:
      - "Per-surface prose adds maintenance — when bootstrap changes section set, both ends drift"
      - Validation loop is a separate workstream
      - Worth it only if operator runs imports often across surfaces
assumptions:
  safe:
    - "Skill follows .claude/commands/product/ style (ponder.md and bootstrap.md as references)"
    - Generator at scripts/product/import.js mirrors scripts/product/bootstrap.js architecture
    - "Output at _docs/imports/<slug>/ registers as paths.imports / paths.importsCurrent (bootstrap precedent)"
    - "Bootstrap's --answers-file JSON format is stable enough to target"
    - "Project introspection is read-only and bounded (≤5 files, no recursive scans)"
  unsafe:
    - "All 5 target surfaces (Claude Code, Codex, Claude web, ChatGPT, Gemini) render the same markdown questionnaire correctly without surface-specific tweaks"
    - Operator can reliably paste responses back without re-formatting
    - "Answers fit /product:bootstrap section set 1:1 — no impedance mismatch"
    - Heuristic markdown answer-parser is reliable enough to skip manual JSON construction
  needs_user_or_beta_review:
    - "Final skill name confirmed as /product:import (user renamed mid-prompt from /product:convert)"
    - "Should the skill have a paste-back-parse companion (/product:import-parse?) or rely on the operator constructing answers.json?"
    - "Should questionnaire include /product:ponder-style observations as a 'context primer' for the other session?"
open_questions:
  blocking:
    - "Confirm output schema target: round-tripped to /product:bootstrap --answers-file JSON exactly, OR markdown that bootstrap learns to ingest natively."
  non_blocking:
    - "Per-target-surface preset prompts, or one universal questionnaire?"
    - "How does the questionnaire convey 'context about the operator's source project' — preamble, embedded snippets, or full project dump?"
    - "Does the operator paste output by hand, or do we ship a `pbcopy` / `clip.exe` step in the skill?"
    - "Should the questionnaire emit JSON-schema metadata so a downstream parser can validate before /product:bootstrap consumes?"
non_goals:
  - "Do NOT auto-paste into another session — operator-mediated only"
  - "Do NOT replace /product:bootstrap; /product:import is strictly a pre-step"
  - "Do NOT introspect deeply (no AST parsing, no git-history dive beyond last 10 commits)"
  - "Do NOT modify .claude/commands/product/bootstrap.md behavior; alignment flows one way (import → bootstrap)"
  - "Do NOT design for multi-source merging (one import per invocation)"
requirement_areas:
  - "Skill spec (.claude/commands/product/import.md)"
  - "Generator (scripts/product/import.js)"
  - "Questionnaire template (framework/templates/product-import/)"
  - "Project-context introspection (read PROJECT.md, README, package.json, last N commits)"
  - Paste-friendly output for 5 target surfaces
  - "Round-trip contract with /product:bootstrap --answers-file"
  - "Optional answer-parser helper (markdown → answers.json)"
  - "Paths registration (paths.imports, paths.importsCurrent)"
  - "Trace events (import_started, context_introspected, questionnaire_emitted)"
high_level_story_candidates:
  - "As an operator with a product trapped in another tool/repo, I want one skill that emits a paste-friendly questionnaire I can hand to another AI session so it tells me what we're building."
  - "As an operator, I want the questionnaire to mirror /product:bootstrap section structure so the answers can be ingested directly."
  - "As an operator, I want the skill to read my project enough to add hints (project name, stack guesses) to the questionnaire preamble without me re-typing."
  - "As an operator, I want the answers paste-flow to convert cleanly to /product:bootstrap --answers-file JSON, even when the answering session uses slightly different formatting."
granular_story_candidates:
  - "/product:import CLI: --slug, --section-set minimal|extended, --output-dir, --no-introspect"
  - "Project introspection pass: read PROJECT.md, README.md, package.json, last 10 commits — extract name/stack/age hints"
  - "Questionnaire template: section preamble + per-section question + per-section response-format hint"
  - "Universal phrasing: write questions in tool-agnostic English (no slash commands, no IDE-specific affordances)"
  - "Render: MD output at _docs/imports/<slug>/<slug>.questionnaire.md"
  - "Paths registration: first emit adds paths.imports and paths.importsCurrent to .claude/paths.json"
  - "Trace events: import_started, context_introspected, questionnaire_emitted"
  - "Companion: /product:import-parse OR --parse <pasted-answers-file> mode that maps answers to /product:bootstrap --answers-file JSON"
workstream_candidates:
  - "Skill spec + generator"
  - Project introspection
  - "Questionnaire template + universal phrasing"
  - "Round-trip contract to /product:bootstrap"
  - Telemetry
  - Optional answer-parser
