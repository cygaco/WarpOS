schema: warpos/sprint/plan-contract/v1
id: PC-20260730-0084
created_at: "2026-07-30T02:27:09.080Z"
updated_at: "2026-08-01T00:00:00.000Z"
sprint: S-VLADW1-02
source_request: "Wave-1 AUDIT of epic E-VLAD-001 (epic label SP-VLAD-W1-AUDIT). Derived from the epic contract, not from a fresh operator message: the operator's verbatim brief is the completed 6-round grill recorded in _planning/vlad-agent-mcp-plan.md (rulings in-file, 2026-07-28) plus the 34-family port inventory in _planning/vlad-transferability.md. This Plan Contract marshals the banked product-lead substance in runtime/vlad-w1/w1-planning-inputs.md §2."
source_request_verbatim: "S-VLADW1-02 (epic label SP-VLAD-W1-AUDIT) — candidate — Job #1: port lastmile detect/score/adapters into the engine; remove WarpOS refusals in the ported copy; intake fallback for undetectable stacks; adopt score.js as the ONE readiness number (checklist proxy not ported); receipt schema v1 from portfolio dogfood"
request_type: feature_add
interpreted_intent: "Port the existing lastmile readiness-audit engine (detect, score, adapters) into the new Vlad product engine so Job #1 — a read-only readiness audit — runs end-to-end on a stranger repo and returns a receipt. Three things make this a port rather than a build: the WarpOS-specific refusals are edited out in the PORTED copy (canonical WarpOS assets are never modified); score.js is ADOPTED as the single readiness number rather than converged with the checklist proxy (J3); and the receipt schema's interior — left deliberately untyped by S-VLADW1-01 (J4) — is filled here from real dogfood data and minted as v1."
user_or_business_outcome: "A founder with a prototype points Vlad at their repo and gets back an honest readiness audit: what Vlad did, what it verified, and the one thing it needs. It degrades honestly — a repo with no tests is reported 'NOT verified', never scored as if it passed. This is the first Vlad capability that reaches a user and the evidence base for the receipt contract the rest of v1 depends on."
affected_surfaces:
  - surface: "The sibling Vlad product repo (all product-side files)"
    evidence_level: unknown
    notes: "Does not exist. Name + slug + creation sign-off is operator gate #1 and the epic's first approval point. No path can be assigned yet, so every file-level claim in this contract is necessarily unlocated."
  - surface: "lastmile detect / score / adapters — the port source"
    evidence_level: inferred_from_repo
    notes: "Sourced from the 34-family inventory in _planning/vlad-transferability.md, which flags its own maps as trailing live values. The inventory was read; the cited source files were NOT. Deliberately not raised above inferred."
  - surface: "score.js — the readiness scorer adopted as the ONE number (inventory cites score.js:134)"
    evidence_level: inferred_from_repo
    notes: "The line reference comes from the inventory and has never been opened. A builder MUST verify the path and line before porting; treat the citation as a lead, not evidence."
  - surface: "The checklist readiness proxy — a deliberate NON-port"
    evidence_level: inferred_from_repo
    notes: Per J3 this is never ported. The inventory records that the proxy concedes in its own code that it is an MVP stand-in. That concession is itself an unverified citation.
  - surface: The FOUNDERS_CHECKLIST.md-dependent readiness dimension
    evidence_level: inferred_from_repo
    notes: "One scored dimension depends on a WarpOS-shaped checklist that will not exist in a stranger repo. Must be re-sourced or honestly recorded as NOT SCORED — see the non-blocking open question."
  - surface: "The receipt envelope interior (schema_version + three named slots emitted by S-VLADW1-01)"
    evidence_level: unknown
    notes: "The envelope does not exist yet — S-VLADW1-01 builds it. This sprint fills the interior and mints v1. The dependency on ENGINE is narrow and deliberately so (J4)."
  - surface: "The portfolio dogfood corpus (>=3 repositories): dreamteam, companycam, almanac — READ-ONLY"
    evidence_level: verified_from_repo
    notes: "AUTHORIZED 2026-08-04 by a dated operator act (verbatim 'yes to all') answering a three-part question that named these three repositories explicitly, so the naming is the operator's own and not an agent proposal. Provenance: relayed to eps by team-lead. READ-ONLY at all times — no write, branch, commit or push in any of the three, at any point. SUPERSEDES the prior 'Unnamed / operator gate' state: the gate's own release condition was 'an operator-run edit or an explicit permission grant', and this is the latter. Four earlier attempts to write these names were denied by the permission layer while an AGENT was asserting the authorization; that was the WarpOS-only rule working correctly, and it is superseded by an operator-given authorization rather than worked around. Corpus-dependent acceptance stays split per AC-9.1/AC-9.2: synthetic-fixture evidence and real-corpus evidence remain honestly separated, and fixture-green is never reported as corpus-green."
current_behavior:
  evidence_level: verified_from_repo
  notes: "Nothing exists product-side. The sibling repo is Verified Nonexistent as of 2026-07-29 (no path assigned; operator gate #1 unresolved). Inside WarpOS the registry entry, ROADMAP row and sprint stores exist for S-VLADW1-02 (current.yaml + progress.yaml only, both at their minted defaults); the tracker at trackers/sprints/S-VLADW1-02-vlad-audit-lastmile-port.md was authored separately because add-sprint.js does not scaffold one. No product code has been written and none may be before the design->build gate clears."
desired_behavior: "Inside the Vlad engine, a read-only audit job runs against an arbitrary repository and completes without any WarpOS-specific refusal firing: it detects the stack (falling back to an intake flow when the stack is undetectable rather than failing), scores readiness through the single adopted score.js, and emits a receipt whose interior is now typed as v1 and derived from real dogfood observations. Exactly ONE readiness number exists in the product repo — score.js adopted, the checklist proxy absent, and the FOUNDERS_CHECKLIST-dependent dimension either re-sourced or reported as NOT SCORED. A build-failing enforcer refuses to let a second readiness number appear. Where the repo gives no evidence (no tests), the audit says 'NOT verified' rather than inferring a pass."
scope:
  size: l
  risk_level: medium
  complexity_drivers:
    - "Every port source is inferred_from_repo and was never opened — the cited paths and line numbers must each be verified before porting, and the inventory warns its own maps trail live values."
    - "The WarpOS-refusal removal happens in the PORTED copy only; canonical WarpOS assets must remain untouched, so the port is a copy-out with edits, not a shared-module extraction."
    - "The readiness number is an ADOPTION, not a convergence (J3) — and the word 'converge' in the original DoD invites porting both scorers and reconciling them, which is a hidden second sprint."
    - "One scored dimension depends on a WarpOS-shaped FOUNDERS_CHECKLIST.md that no stranger repo has; it must be re-sourced or honestly degraded."
    - "The receipt interior can only be typed from real dogfood data, so the sprint's most durable output is gated on corpus authorization that does not exist yet."
    - "Honest degradation ('NOT verified' when a repo has no tests) is a claims-correctness surface, not a UX nicety — it is the difference between an audit and a guess."
scope_variants:
  minimal_safe:
    summary: "Port detect + score + adapters into the engine behind verified path references, strip the WarpOS refusals in the ported copy, adopt score.js as the sole readiness number with the checklist proxy deliberately absent, and ship the build-failing second-number enforcer. Run against ONE authorized repo. Leave the receipt interior at the untyped envelope ENGINE emits and do not mint v1."
    tradeoffs:
      - "Does not mint receipt v1 — the schema stays open, so the circularity J4 defuses is deferred rather than closed."
      - "One repo is not a corpus: the intake fallback for undetectable stacks stays largely unexercised, which is precisely the path a stranger repo is most likely to take."
      - "Still requires the sibling repo and one authorized repository, so it does not escape the operator gates — it only shrinks the corpus one."
  recommended:
    summary: "The full sprint as scoped: port detect/score/adapters with every cited reference verified first; refusal removal in the ported copy; intake fallback for undetectable stacks; score.js adopted as the ONE readiness number with the checklist proxy not ported and the FOUNDERS_CHECKLIST-dependent dimension re-sourced or recorded NOT SCORED; a build-failing enforcer against a second readiness number; a run across the named corpus of >=3 authorized repos; and receipt v1 minted from that real data, filling the interior ENGINE leaves untyped."
    tradeoffs:
      - "Needs the full four-item operator gate set resolved, including the named corpus with written read-only authorization."
      - "Receipt v1 is minted from three repos — a small corpus, so v1 should be expected to want a v2 rather than being treated as final."
      - "The port-verification pass costs real time up front and will look like slow progress; it is the mitigation for the highest-likelihood risk in the sprint."
  expanded:
    summary: "Recommended, plus: broaden the corpus beyond three repos to stress the intake fallback across more stack shapes, and re-source the FOUNDERS_CHECKLIST-dependent dimension properly (a genuine stranger-repo signal) instead of degrading it to NOT SCORED."
    tradeoffs:
      - "Re-sourcing a scored dimension is a design problem of its own and can quietly become its own sprint — the honest NOT SCORED path exists precisely to avoid that."
      - "A wider corpus multiplies the read-only authorization surface the operator must grant, and each repo is a separate consent."
      - "Risks tuning the scorer to the dogfood corpus, which is a portfolio of one founder's repos and not a representative sample of strangers."
assumptions:
  safe:
    - "The port is genuinely a port: the lastmile audit engine already runs on non-WarpOS repositories behind a small number of refusal edits, per the transferability inventory."
    - "This is a NEW repo with no legacy consumer, so there is nothing to migrate and no back-compatibility surface for the readiness number."
    - "The audit is read-only: it inspects and scores, and does not write to the audited repository. The write path is Wave 2 and explicitly out of scope."
    - "'Your code never touches our servers' is SEAM-AGNOSTIC — it survived the API-key-only reversal and survives the 2026-08-01 subscription-primary ruling, because the audit runs locally either way. Safe to keep making under any seam."
  unsafe:
    - "That the cited port references (score.js:134, phases/preflight.js and the rest of the inventory's maps) are accurate — they are inferred, never opened, and the inventory says its maps trail live values."
    - "That 'converge the two readiness scores' is a small reconciliation task — read literally it invites porting both scorers, which is a hidden second sprint. J3 reframes it as adoption for exactly this reason."
    - "That a stranger repo resembles WarpOS. The FOUNDERS_CHECKLIST-dependent dimension is the known instance; there may be other WarpOS-shaped assumptions inside the audit that only a real corpus will expose."
    - That receipt v1 minted from three repos is stable enough to be treated as final.
  needs_user_or_beta_review:
    - "OPERATOR: the sibling product repo's name and slug, plus sign-off to create it — the epic's first approval point and a hard precondition for every product-side file in this sprint."
    - "OPERATOR: the named portfolio corpus (>=3 repos) WITH explicit read-only authorization, reconciled in writing against the standing WarpOS-only rule. Verbal acceptance in grill round 3 was never reconciled with 'open these three directories', and this sprint cannot run its DoD without it."
    - "RESOLVED-2026-08-01 (prior text preserved: 'OPERATOR: the Anthropic API spend envelope for dev/test — trips two autonomy rows (signups/purchases not allowed; >=$5 ask-first).'). Operator granted $50 dev/test, vlad lane only; spend beyond that envelope remains ask-first."
    - "BETA: the honest-degradation language. When a repo has no tests the audit must report 'NOT verified' rather than inferring a pass — this is a claims-boundary surface, and the exact wording determines whether the receipt is honest or merely hedged."
    - "BETA: whether the build-failing second-readiness-number enforcer is the right shape of teeth for J3, or whether an adoption discipline this simple regrows anyway."
open_questions:
  blocking:
    - "Sibling product repo name + slug + operator sign-off to create it (epic gate #1, inherited)."
    - "Which >=3 portfolio repositories form the dogfood corpus, and explicit written read-only authorization for each, reconciled against the standing WarpOS-only rule."
    - "RESOLVED-2026-08-01 (prior text preserved: 'The Anthropic API spend envelope for dev/test.'). Operator granted $50, vlad lane only."
  non_blocking:
    - "Can the FOUNDERS_CHECKLIST.md-dependent readiness dimension be re-sourced from a signal a stranger repo actually has, or must it ship as honestly NOT SCORED? Either answer is acceptable; silently scoring it is not."
    - "J3 (adopt score.js, never port the checklist proxy) is now folded into the epic's Definition of Done item on the readiness number as an alpha-altitude Class B scoping call. It is recorded, not awaiting an operator answer — surfaced here for objection rather than held as a gate."
    - "Is the receipt interior minted from three repos versioned as v1, or as v0.9 with v1 reserved until a wider corpus? The envelope carries schema_version precisely so this can be answered late."
    - "The plan-contract schema's recommended_mode enum offers only solo/adhoc/oneshot/no_recommendation and has no 'sprint' value, so this contract records no_recommendation despite being conducted in sprint mode. The enum predates sprint mode; the honest value is the one recorded."
non_goals:
  - "The write path — porting transaction.js, branch-per-job, preflight, ff-only apply, draft-PR park, undo. That is Wave 2."
  - The agent face and the installer. Wave 2.
  - "Porting the checklist readiness proxy. This is a deliberate NON-port under J3, not an omission to be corrected later."
  - "Typing the receipt ENVELOPE itself — ENGINE owns the versioned envelope and its three named slots; this sprint fills the interior only."
  - "Modifying any canonical WarpOS asset. Every port is a copy-out; the WarpOS-side originals are untouched."
  - "Cross-provider review of the audit output. Same-provider adversarial review is the v1 posture; cross-provider is a premium tier."
  - Any write to an audited repository. The audit is read-only in this sprint by construction.
requirement_areas:
  - "Port fidelity and reference verification — every cited path and line confirmed before code moves"
  - Stack detection and the intake fallback for undetectable stacks
  - "Readiness scoring: single-number adoption and its build-failing enforcer"
  - "Honest degradation and claims correctness ('NOT verified' when evidence is absent)"
  - "Receipt interior schema v1, derived from real dogfood observations"
  - WarpOS-refusal removal confined to the ported copy
  - Dogfood corpus operation under recorded read-only authorization
high_level_story_candidates:
  - "As a founder with a prototype, I point Vlad at my repo and get a readiness audit that names what is missing, so I know what to fix next."
  - "As a founder whose repo has no tests, I get told plainly that readiness could NOT be verified, so I am not misled into thinking I passed."
  - "As a founder with an unusual stack Vlad cannot detect, I am asked a few questions instead of hitting an error, so the audit still completes."
  - "As the operator, I see exactly one readiness number in the product, so I never have to reconcile two scores that disagree."
  - "As the operator, I get a receipt whose shape came from real runs on real repos, so the receipt contract the rest of v1 depends on is grounded in evidence."
granular_story_candidates:
  - "Verify each cited port reference (path AND line) against its source before porting, and record the verification result — including any citation that turns out to be wrong."
  - "Copy detect/score/adapters into the engine as a port, leaving the WarpOS originals untouched."
  - "Remove the WarpOS-specific refusals in the ported copy only, and prove none fires on a non-WarpOS repo."
  - "Adopt score.js as the readiness scorer; do not port the checklist proxy."
  - "Re-source the FOUNDERS_CHECKLIST-dependent dimension, or make it report NOT SCORED explicitly rather than defaulting to a number."
  - Add an enforcer that fails the build if a second readiness number appears in the product repo.
  - Implement the intake fallback that triggers when stack detection cannot classify a repo.
  - "Emit 'NOT verified' for every dimension the repo provides no evidence for, and never substitute an inferred pass."
  - "Run the audit across the >=3 authorized corpus repos and capture the observations the receipt interior needs."
  - "Mint receipt interior v1 from those observations, filling ENGINE's untyped slots without changing the envelope."
workstream_candidates:
  - "Port + reference verification (backend)"
  - "Readiness-number adoption + its enforcer (backend + enforcement)"
  - "Detection, intake fallback, and honest degradation (backend + claims correctness)"
  - "Dogfood operation and receipt-v1 derivation (evidence gathering, gated on corpus authorization)"
preliminary_ticket_candidates:
  allowed: false
  candidates: []
  notes: "No executable tickets. plan_quality is needs_user_clarification with three blocking operator gates, and design_required is true — tickets are minted during /sprint:design once the gates clear. Minting them now would create executable work against unresolved preconditions, including a sibling repo that does not exist."
external_service_dependencies:
  status: required
  required:
    - "Anthropic model access — SUBSCRIPTION-PRIMARY per the operator ruling of 2026-08-01 (the end user's own Claude subscription, user-invoked agent, local MCP topology, no developer credentials in the path), with the API-key/TypeScript-Agent-SDK route ENGINEERED AND READY as the fallback. SUPERSEDES the prior entry, preserved here: 'Anthropic API (Console account + the operator's own API key) — the engine's only model-access path after the ToS NO-GO on the claude-CLI subscription seam.' Our own dev/test spend is covered by the $50 envelope granted 2026-08-01 (vlad lane only)."
    - "The named portfolio dogfood corpus (>=3 repositories) under explicit written read-only authorization — external to WarpOS and outside the standing WarpOS-only rule, so it requires operator consent per repository."
  possible:
    - "A git host, if the corpus repos are read from remotes rather than local working copies."
  notes: "The Anthropic dependency is inherited from S-VLADW1-01's model-access seam rather than introduced here; this sprint consumes it — and as of the 2026-08-01 operator ruling that seam is SUBSCRIPTION-PRIMARY with the API-key route as the engineered fallback, so what this sprint consumes is an auth-agnostic seam rather than an API-key-only one. The spend half of the prior gating is settled ($50 dev/test granted 2026-08-01, vlad lane only). The corpus half still needs read-only authorization reconciled against the standing WarpOS-only rule."
approval_boundaries:
  - "Creating the sibling product repo — operator sign-off, the epic's first approval point. No product-side file may be written before it."
  - "Opening any repository outside WarpOS, even read-only — the standing WarpOS-only rule holds until the operator names the corpus and authorizes it in writing."
  - "Any metered Anthropic API spend — >=$5 is ask-first and signups/purchases are not allowed at all."
  - "Crossing design->build. HELD: this contract stops at the plan->design boundary and the build phase needs the sibling repo plus the corpus."
design_required: true
execution_allowed_without_design: false
recommended_mode: no_recommendation
mode_invocation_required_by_user: true
lane:
  type: default
  value: null
  isolation_notes: "No lane isolation set at plan time. The product-side work lands in a sibling repo that does not exist yet, so the eventual isolation question is 'which repo', not 'which worktree'. Revisit at /sprint:design once the repo exists."
beta_review:
  required: true
  likely_founder_rejection_risks:
    - "The corpus request reads as scope creep against the operator's own WarpOS-only rule — 'open these three directories' was accepted verbally in grill round 3 but never reconciled in writing, and asking again may feel like re-litigating a settled yes."
    - "Reporting NOT SCORED for a readiness dimension may read as an incomplete product rather than an honest one, especially in a demo."
    - "The port-verification pass looks like slow, unglamorous progress on work that was sold as 'substantially a port, not a build'."
  overbuild_risks:
    - "Re-sourcing the FOUNDERS_CHECKLIST-dependent dimension properly instead of degrading it honestly — a design problem that can absorb the sprint."
    - "Porting BOTH scorers and reconciling them, which is what the original 'converge the two readiness scores' wording literally asks for and what J3 exists to prevent."
    - "Over-engineering the receipt interior from a three-repo corpus, treating v1 as final when the envelope was versioned precisely so it need not be."
  missing_context_risks:
    - "Every port citation is unverified, so a builder trusting the inventory rather than checking it will port against references that may not exist."
    - "The receipt interior's shape depends on ENGINE's untyped envelope actually shipping untyped (J4). If ENGINE types it early, this sprint inherits the churn J4 was designed to prevent."
    - "The honest-degradation wording is a claims boundary, and no reviewer has yet ruled on the exact language."
plan_quality:
  status: needs_user_clarification
  confidence: medium
  evidence_gaps:
    - "Every port source is inferred_from_repo; not one cited file or line has been opened."
    - "The sibling product repo does not exist, so no product-side path can be verified."
    - "The dogfood corpus is unnamed, so the intake-fallback and honest-degradation paths cannot be exercised against real inputs yet."
    - The receipt envelope this sprint fills does not exist until S-VLADW1-01 ships it.
  fail_reasons: []
next_recommended_command: "/sprint:design (HELD — do not run until the three blocking operator gates clear: sibling repo name+slug+sign-off, the named >=3-repo corpus with written read-only authorization, and the API spend envelope)"
resume_instructions: "Sprint S-VLADW1-02 is HELD at the plan->design boundary. SEAM POSTURE UPDATED 2026-08-01: model access is SUBSCRIPTION-PRIMARY per the operator ruling — the end user's own Claude subscription powering an agent they themselves invoke, local MCP topology, no developer credentials in the path — with the API-key/TypeScript-Agent-SDK seam ENGINEERED AND READY as the fallback per beta 7c4e2b96's auth-agnostic design. Residual risk is recorded not softened: an alternative parse of the clause is available, policy is explicitly in flux, and Anthropic reserves enforce-without-notice; the Anthropic clarification/approval request is live PARALLEL work, and the trigger for flipping to API-key is Anthropic closing or metering the seam. Authoritative text: the epic's § Decisions first entry + Change-log fold 5b022ea9. This sprint consumes the seam rather than building it, so the ruling changes its inherited dependency, not its scope. Product-lead assessment carried forward: this sprint is better-evidenced than S-VLADW1-01 and its blockers are INPUTS, not unknowns — it clears to plan_quality=pass without re-authoring once the operator answers. Read trackers/sprints/S-VLADW1-02-vlad-audit-lastmile-port.md for the durable state and runtime/vlad-w1/w1-planning-inputs.md for the banked substance (§2 the product-lead contracts, J1-J4 the judgments). Do NOT begin product-side work: the sibling repo does not exist and the corpus is unauthorized."
