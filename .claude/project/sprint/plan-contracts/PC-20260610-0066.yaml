source_request_verbatim: "Lane B — dispatch/registry coherence fixes from the 2026-06-10 WARPOS.md sweep (runtime/notes/warpos-md-sweep-2026-06-10.md §Lane B): (1) doogle WG-2: replace model: inherit with registry-derived pins in the 6 role specs (director-of-engineering, copy-lead, cabinet, ops-analyst, director-of-product, product-lead) + fix president/beta.md sonnet-vs-registry-opus drift + extend role-parity enforcer (scripts/checks/role-parity-scan.js) to FAIL when spec frontmatter model differs from role-registry model incl. the inherit case; (2) doogle WG-5: add dispatch-contract.json class_derivation rule routing cross-provider leads (provider openai/gemini) before the generic tier:lead→manager rule, so design-lead's derived shape matches its registry route; extend parity scan to FAIL on shape-vs-route contradictions; (3) doogle WG-4: rewrite epsilon.md + agent-dispatch-guide.md so subprocess dispatch (claude -p --agent for non-build roles, dispatch-claude.js for build-chain, dispatch-agent.js cross-provider) is the SANCTIONED conduct route for teammate-spawned epsilon (operator-ratified in doogle 2026-06-09) + epsilon startup self-check that records which conduct route is active; (4) doogle WG-6: add teammate stall rules to epsilon.md (never idle awaiting background returns, dispatch blocking, report-before-idle) + a fail-closed epsilon-stalled liveness check (evidence files without matching ledger record after N minutes = loud event)."
