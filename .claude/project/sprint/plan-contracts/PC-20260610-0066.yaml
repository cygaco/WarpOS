interpreted_intent: "Make the role-registry the enforced single routing source (model pins + shape derivation), make the documented teammate-ε conduct path match what the harness actually permits (subprocess routes, ED-041), and make conductor stalls self-detecting instead of operator-babysat. All four are coherence repairs to existing architecture, no new architecture (Beta OPEN_ADR false)."
user_or_business_outcome: "Sub-agents stop silently running on the session model; shape-based enforcers stop contradicting the registry; every future product install gets a conduct loop that is actually implementable; ε stalls become loud events instead of 25-minute silent waits. Downstream products (doogle proved all four live) inherit the fixes on next release."
