  notes: "design_required=true. Tickets minted in /sprint:design once the contract + anchor map are pinned against the other session's final guide list."
external_service_dependencies:
  status: none_for_sprint
  required: []
  possible: []
  notes: "The SPRINT is docs/wiring (no signup/billing/secrets). Meta-note: the sprint's PURPOSE is to surface the user's ESD-handling guidance (SSO/OAuth app review, Apple/Google/Play dev accounts, DNS) at the right time — it makes ESDs visible earlier (ED-012), but introduces none itself."
approval_boundaries:
  - "none beyond hard ceilings — docs + pipeline wiring; reversible; no push/deploy/paid-service/secrets. (If expanded-scope hard-gating is chosen, that gate design is an operator call.)"
