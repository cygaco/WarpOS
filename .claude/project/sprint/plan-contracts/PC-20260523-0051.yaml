      - "Con: more surface"
  expanded:
    summary: "recommended + DoPM consultation history per roadmap entry persisted in a roadmap-decisions ledger + queryable via new /roadmap:why <entry> skill."
    tradeoffs:
      - "Pro: full traceability"
      - "Con: ledger is new infra"
