sprint: SP-20260525-017
source_request: "Wire existing /roadmap:* through DoPM — milestone 0.14.0 sprint 4. /roadmap:add and /roadmap:cleanup declare `temporary-agent: director-of-pm` in frontmatter; proposed edits pass through DoPM critique before file write; operator sees 'DoPM suggests: …' annotations with rationale. /roadmap:add gains 'which milestone does this feed?' prompting; /roadmap:cleanup gains 'what cadence rule is this entry violating?' lensing. Closes milestone 0.14.0."
source_request_verbatim: "Fourth sprint of the Managerial Agent Layer milestone — the application that proves the mechanism + persona work end-to-end on existing skills. /roadmap:add stops being a stenographer; /roadmap:cleanup stops being a heuristic-only scan. Both consult DoPM. Closes the milestone."
request_type: feature_modify
interpreted_intent: "Two existing roadmap skills (/roadmap:add, /roadmap:cleanup) get DoPM integration via the skill-scoped injection mechanism. /roadmap:add: when operator adds an entry, DoPM lenses it — 'which milestone does this feed? if none, should there be a new milestone? does this conflict with current cadence?'. /roadmap:cleanup: when scanning for stale/duplicate/hidden-urgency entries, DoPM applies decision lenses — 'this entry violates the cadence rule because…', 'this entry is duplicate because…'. Edits still go through operator review; DoPM annotates, doesn't autonomously write."
user_or_business_outcome: "Operator using /roadmap:add gets strategic prompting that catches missing-context issues (entry doesn't feed any milestone, conflicts with cadence). /roadmap:cleanup output is more actionable (specific rule citations, not just heuristic warnings). The roadmap stays more coherent with less operator effort."
affected_surfaces:
  - surface: ".claude/commands/roadmap/add.md"
    evidence_level: verified_from_repo
    notes: "Add temporary-agent: director-of-pm to frontmatter; modify procedure to consult DoPM on each proposed entry."
  - surface: ".claude/commands/roadmap/cleanup.md"
    evidence_level: verified_from_repo
    notes: "Add temporary-agent: director-of-pm to frontmatter; modify scan logic to lens findings through DoPM."
  - surface: "scripts/roadmap/add.js + scripts/roadmap/cleanup.js (or wherever logic lives)"
    evidence_level: asserted_inferred
    notes: Engine scripts gain DoPM consultation step before writing.
  - surface: paths.eventsFile
    evidence_level: verified_from_repo
    notes: "Add new event subtype `manager-consult` with { persona, skill, request_payload, response_summary, decision_rationale } so consultations are observable."
  - surface: "scripts/roadmap/test-add.js + test-cleanup.js (NEW or extended)"
    evidence_level: asserted_inferred
    notes: "Fixtures: roadmap entry with missing milestone link; entry with cadence violation; stale entry; verify DoPM annotations land."
current_behavior:
  evidence_level: verified_from_repo
  notes: "/roadmap:add accepts entry text + section, writes it without strategic review. /roadmap:cleanup runs heuristic scans (completed items, stale entries, duplicates) but doesn't apply directorial decision lenses."
desired_behavior: "(1) Both skills declare temporary-agent: director-of-pm. (2) /roadmap:add consults DoPM on each proposed entry — 'milestone fit? cadence impact? evidence quality?'. (3) /roadmap:cleanup output includes DoPM-cited rule violations + recommendations. (4) Consultations emit manager-consult events for auditability. (5) Operator still reviews + approves all edits; DoPM annotates, doesn't autonomously write. (6) Tests cover all annotation paths. (7) Closes milestone 0.14.0 — moves to Shipped section in ROADMAP.md. (8) Local commit. Push operator-scoped."
scope:
  size: m
  risk_level: low
  complexity_drivers:
    - "DoPM consultation latency adds to skill runtime — bound this"
    - "Annotation format must be operator-readable + machine-parseable for events"
