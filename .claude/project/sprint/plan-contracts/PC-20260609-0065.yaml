source_request: "Build the Mode-Lifecycle Registry keystone (Wave 0 of E-LIFECYCLE-001): one SoT for mode->team/bindings/tier/dispatch, de-dup the hardcoded sites to read it, fix getMode() sprint case + add isSprint(), register mode.json as a paths.* key, add a registry-drift validator, reconcile the DEFAULT-ON drift. mode-set.js is the single lifecycle-transaction writer reading the registry; the PreToolUse guard is backstop-only (built in S-LC-03, not here). Engine/tooling sprint, ff-merge close, defer retro to epic close (RI-001)."
source_request_verbatim: "S-LC-01 - Mode-Lifecycle Registry keystone (Wave 0 of E-LIFECYCLE-001). Create .claude/agents/_org/mode-lifecycle.json (per-mode: roster, requires_team, bindings [sprint/epic/tracker/planning], provider tier, dispatch-profile ref, teardown policy). De-duplicate the 3 hardcoded required-team-by-mode sites (session-start.js TEAM_MODES, team-guard.js inline epsilon-check, mode-skill prose) to READ the registry. Fix scripts/hooks/lib/mode.js getMode() to handle the sprint case + add isSprint() (audit all getMode callers first). Register .claude/runtime/mode.json as a paths.* key (edit framework/paths.registry.json SOURCE then run scripts/paths/build.js). Add a mode-lifecycle-registry validator (every reader resolves from the registry; planted wrong-roster fails). Reconcile the DEFAULT-ON drift in TRACKER.md + E-SYSTEM-ORG-001 (shipped code is DEFAULT-ON; reconcile as a logged Change Log entry, not a silent edit). Architecture directive (GPT-5.5 correction, operator-confirmed 2026-06-09): mode-set.js is the single lifecycle-transaction writer that reads this registry; the PreToolUse guard is backstop-only (built in S-LC-03, not here). Gates: new validator green + team-guard-gate.test.js stays green (golden-snapshot first) + regen BOTH manifests last. Engine/tooling sprint - fast-close via ff-merge to main, defer retro to epic close (RI-001)."
request_type: architecture_change
interpreted_intent: "Convert mode->team/bindings correctness from 'remembered by hardcoded sites + prose' into ONE declarative registry that every reader resolves from, so the recurring mode/team drift becomes mechanically self-detecting. Fix the confirmed getMode() sprint->solo fallthrough and add isSprint(). Register mode.json as a paths.* key (source-vs-generated discipline). Establish mode-set.js as the single transaction writer that READS the registry; the gates that consume it (mode:switch preflight, mode:init:gate) are S-LC-03/04 and explicitly out of scope here."
user_or_business_outcome: "Mode/team correctness stops depending on the model remembering prose: one registry is the SoT, a validator fails closed on drift, and sprint mode is correctly detected (not silently 'solo'). This is the foundation every Wave-1 gate in E-LIFECYCLE-001 reads - without it the gates would re-encode the same drift this epic is curing."
