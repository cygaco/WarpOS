current_behavior:
  evidence_level: verified_from_repo
  notes: "Required-team-by-mode is HARDCODED + duplicated across session-start.js TEAM_MODES (~L535), team-guard.js inline check (~L166), and mode-skill prose - and already drifting (shipped code DEFAULT-ON vs E-SYSTEM-ORG-001 prose DEFAULT-OFF). getMode() in lib/mode.js has no sprint case -> sprint resolves to 'solo' (re-confirmed live this session). mode.json is referenced as a literal string, not a paths.* key. No mode-lifecycle registry, no drift validator. team-guard-gate.test.js golden baseline = 13/13 pass, exit 0 (captured 2026-06-09)."
desired_behavior: "One .claude/agents/_org/mode-lifecycle.json that all readers resolve from; getMode() returns 'sprint' for sprint mode + isSprint() exists; higgsfield-spend-gate verified correct under 'sprint'; mode.json is a paths.* key; a validator exits non-zero when any reader drifts from the registry or a planted wrong-roster is present; the DEFAULT-ON drift reconciled with a logged Change Log entry on BOTH tracker surfaces; mode-set.js reads the registry. No gate is built here (S-LC-03/04). team-guard-gate.test.js stays 13/13; both manifests regenerated."
