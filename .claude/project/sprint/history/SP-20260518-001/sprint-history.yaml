source_request: "A sprint:full command that goes through all sprint phases automatically, without a human needed to initiate each sprint command or to give approvals."
interpreted_intent: "Add a meta-orchestrator skill /sprint:full that chains the existing sprint phases in one invocation under a bounded autonomy preset. Hard ceilings (push_to_remote, paid_service_signup, production_deploy, destructive_migration, secret_to_remote) remain non-bypassable. Composition over duplication — shells out to existing helpers."
