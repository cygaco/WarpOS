key_tradeoffs:
  - "Composition over reimplementation: orchestrator shells out to existing per-phase helpers rather than reimplementing their logic. Lower blast radius, faster ship, lower test surface; cost is that bugs in helpers propagate up — but helpers are already test-covered."
  - "Phase 3 (execute) hands Ralph loops to skill body in v0.1 rather than orchestrator-driven 9-stop-reason mapping. Pragmatic: skill body has the LLM reasoning needed to interpret stop_reasons in context; cleaner contract for v0.2 enhancement when execute.js gains a non-interactive driver."
  - "Hard ceilings hardcoded in code rather than configurable. Forced choice: secure-by-default vs configurable. Chose secure-by-default; redteam threat A-2 verifies escalation attempts get rejected at preset-load."
  - "Three discrete presets vs continuous policy DSL. Discrete is comprehensible at-a-glance; DSL would have been infinitely flexible but operator-hostile. Chose comprehensibility."
  - "Cost-estimate is coarse (phase × per-phase-typical-spend) rather than telemetry-based. Telemetry-based is more accurate but requires real run data to calibrate; coarse default unblocks shipping. Calibration is a v0.2 telemetry-driven enhancement."
final_outcome_notes: "Shipped internal-canary. /sprint:full is committed locally on main but not yet promoted to canonical WarpOS or pushed/tagged. The next /warp:release pipeline can carry it canonical-wide. Bootstrap caveat: the skill was built using the per-phase commands (it was the subject) and has not yet been used end-to-end live — the first real /sprint:full invocation will be the v0.1 smoke test. Two known v0.1 caveats are documented in the changelog + report: (1) Phase 3 stop-reason mapping owned by skill body, (2) Beta SendMessage owned by skill body. Both are explicit contracts, not gaps."
should_be_remembered:
  - "Always consult the active-sprints registry primary id before bootstrapping a fresh sprint id (root cause of RT-008). Generalizable to any helper that bootstraps state."
  - "Hooks returning hookSpecificOutput.updatedInput MUST gate on tool_name and emit the right shape per tool (root cause of RT-009). Generalizable lint rule worth adding."
  - "When building a meta-feature that wraps existing primitives, composition-over-duplication keeps the build small and the test surface bounded."
  - "Hard-ceiling enums must live in code, not config. Config can document, code enforces. (Validated by redteam threat A-2.)"
  - "Single-vendor sessions are acceptable but must be honestly recorded as routing evidence (single_vendor_session or mismatch_override) — not silently hidden."
