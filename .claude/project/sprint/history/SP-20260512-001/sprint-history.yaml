schema: warpos/sprint/sprint-history/v1
id: SP-20260512-001
title: Multi-sprint parallelism for Sprint Workflow
objective: "Lift the single-active-sprint singleton constraint so 2+ sprints can coexist (and, in the recommended variant, execute concurrently in isolated lanes) without corrupting tracker state or git history."
source_request: Enable multiple WarpOS sprints to run in parallel.
interpreted_intent: "Lift the single-active-sprint constraint baked into Sprint Workflow v0.1. Today there is exactly one current-sprint.yaml and one sprint-progress.yaml; every sprint helper reads/writes those singletons by file path. The user wants the sprint subsystem to support more than one sprint being alive at a time, and ideally to let independent sprints execute concurrently without stepping on each other's tracker state, git state, or downstream artifacts."
plan_contract: ".claude/project/sprint/plan-contracts/PC-20260512-0001.yaml"
final_scope: "v0.2 recommended variant: per-sprint subdirs, active-sprints registry, --sprint flag end-to-end, lane model (default/worktree/branch), worktree warm-up workaround, conflict-check on affected_surfaces, /sprint:status command, sprint-id tagging on append singletons, sprint-tracker-guard v0.2 layout support, ADR + 5 doc files. Plus the in-flight init-template validation bug fix (S-5)."
