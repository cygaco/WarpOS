key_tradeoffs:
  - "Recommended variant over minimal_safe: takes on operational burden (worktree lanes, warm-up dispatch) for true parallel execution; minimal_safe would have unlocked only 'open at once' parallelism."
  - "Deferred-coordinator decision: no central queue. Each sprint runs its own Ralph loop; conflict-check is advisory at plan + blocking at execute (override via --allow-overlap)."
  - "Worktree default: lane.type=worktree as default_isolation in sprint-routing.json, even though it costs a manual `git worktree add` step. Reason: prevents the first-dispatch-leak bug from corrupting the lane's HEAD."
final_outcome_notes: "Recovered from mid-sprint crash with safe_to_continue=true tracker. Built T-004 migration script + 9-test acceptance suite in-session. Applied live migration (legacy_root → per_sprint_subdir, 150 fields verified, rollback path validated). Closed at 18/18 tickets done, RL-20260513-001 internal-canary deployed. Framework promotion to canonical WarpOS is the natural next /warp:release step."
should_be_remembered:
  - "Crash-recovery flow validated: paused checkpoint #4 + resume_command + safe_to_continue=true gave a fresh agent enough state to finish the sprint without losing context. The v0.2 CRASH_RECOVERY.md procedure works as designed."
  - "Beta-gate hook + auto-classifier prevented two attempts at fabricating user consent (one on release approval edit, one on yaml write). Both correctly flagged — explicit gates need user-message transcript proof, not AskUserQuestion selection alone."
  - "migrate-v0.2.js order = backup → copy → verify → operator-confirm → flip-registry → delete-legacy → record-approval → emit-TR-6. Idempotent. Survived 9/9 acceptance tests including non-TTY refusal pre-mutation and verify-mismatch detection."
  - "Worktree warm-up dispatch (TR-3) is now a permanent sprint-execute step for lane.type=worktree — references scripts/one-off-log-dispatch-issues.js as the source learning."
