  - outcome: "Refuse-not-skip landed on the claim-lint derivation: a paragraph resembling an Asserted/Ceiling lead-in is bound or REFUSED by name, never silently skipped. All seven near-miss authorings RED plus both em-dash controls RED."
    planned: true
    evidence:
      - "bundle A + bundle G; verified INDEPENDENTLY by two gauntlet-2 lanes, controls firing the correct DISTINCT rule (unbound-paragraph for controls vs unbindable-paragraph-shape for near-misses)"
      - "backend lane disclosed and re-ran its own invalid first battery rather than report rows refusing for the wrong reason"
  - outcome: "A NAMED CANONICAL TRANSFORM matching on the RENDERED form: NFKD, default-ignorables stripped BY PROPERTY, combining marks deleted, a confusable fold, the dash class by \\p{Pd} plus U+2212, whitespace collapse, case fold - 26 of 27 rendered-form dimensions caught under adversarial probing."
    planned: true
    evidence:
      - "bundle G; bundle K's ten falsification attempts each observed a flip, including the NFKD-vs-NFKC discriminator isolated exactly (accented RED->GREEN under NFKC while fullwidth stays RED)"
      - "security lane drove 27 dimensions; 26 caught"
  - outcome: "Two false bound sentences corrected with the bind moving in the same change, and S4-3 held at close: 15 bindable paragraphs matched against 15 canonical copies byte-for-byte."
    planned: true
    evidence:
      - "bundle B; RF-4 observed RED in BOTH directions inside the owning bundles' own runs (H-prime, L1, L2 envelopes carry the real rule output)"
      - "alpha re-execution at close: RF-4 both directions confirmed"
  - outcome: "The args.map scan door closed with an indexed loop and no method lookup, then RE-ATTACKED at the qualifying gauntlet with twelve live-child shapes for zero leaks."
    planned: true
    evidence:
      - "bundle D + RF-5a/b/c; security lane: Array subclass, Object.create(Array.prototype) with counting getter, Proxy args, stateful toString, prototype-chain secrets - 9 refused, 3 launched clean, 0 decoy deliveries"
      - "stateful toString() called exactly ONCE (no TOCTOU re-read); refused-container getters invoked ZERO times"
  - outcome: "AC-8.6 built at the capped shape: one invocation from the product-layer entry, one named test, and RF-7 RED at RUNTIME rather than at text/AST level."
    planned: true
    evidence:
      - "bundle C; the mutant still starts and still CONTAINS the function definition, and goes red on the ABSENCE of the custody-selfcheck record"
      - "check:pointers resolves custody-runtime.test.js::selfcheck-runs-on-user-machine; the missing-NAME line is gone"
