    linked_friction: "beside-not-inside fold"
    due_by: "S-VLADW1-05 first bundle"
  - action: "State coverage as the letter set actually mapped, or vendor a Unicode confusables table. Never as 'scripts closed'."
    owner: "S-VLADW1-05"
    linked_friction: "coverage-granularity class"
  - action: "Replace every escape COUNT with a named CLASS. A count is a property of the day it is read."
    owner: "S-VLADW1-05"
    linked_friction: "coverage-granularity class"
  - action: "Extend refuse-not-skip to the LEAD-IN path for every prefix class, heading markers included."
    owner: "S-VLADW1-05"
    linked_friction: "coverage-granularity class"
  - action: "Attach a grep or read proof line to every 'X is missing' or 'X is required' in a builder brief, and tell builders explicitly they may refuse a premise with evidence."
    owner: "epsilon"
    linked_friction: "brief premises written from belief"
  - action: "Scope every enforcement sweep to where the CLASS lives, not to where the instance was found."
    owner: "epsilon"
    linked_friction: "enforcement sweep scoped to the instance"
  - action: "Arm the paired waiter in the SAME turn as every background dispatch, rather than narrating a poll and yielding."
    owner: "epsilon"
    linked_friction: "idle-while-polling"
  - action: "Document in the scanner's own header that prose naming a banned primitive trips the ban, so the next author writing about it does not rediscover it."
    owner: "S-VLADW1-05"
    linked_friction: "text matcher cannot distinguish violation from description"

