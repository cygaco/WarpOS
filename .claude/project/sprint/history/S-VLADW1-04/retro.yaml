key_tradeoffs:
  - "Ran a DIAGNOSTIC gauntlet before the qualifying one, spending a full gauntlet to buy one real iteration - which found six defects that would otherwise have consumed the single attempt."
  - "Disclosed the count-of-surfaces class rather than widening the matcher to catch it, because count phrasing is unbounded and widening manufactures the appearance of coverage. Bundle L1 measured a candidate pattern with zero false positives and still declined to land it, which does not overturn the ruling: beta's ground was unboundedness, not over-refusal."
  - "Dropped the D1 prototype-check window from the cross-family payload to stay under the 32KB argv wall, keeping the gate region that refuted the previous round's false HIGH and stating the absence in the lane's own terms."
  - "Left the transform's own description paragraph UNBOUND rather than fake a bind, because binding it properly requires changing a test fixture builder that was out of scope at a qualifying boundary."
  - "Serialized the three mutating Claude lanes again rather than isolate them, and ran the cross-family lane alongside because it mutates nothing."

learning_candidates:
  - learning: "Approval is not a truth check. A sentence recommended by the judgment face, approved by the orchestrator and reviewed by the conductor can still be false of the code, because none of those three is an execution. No shipped claim without its attack."
    promote_via: "learn:integrate"
    evidence:
      - "beta row 316: 'approval is not a truth check, and beta's recommendation is worth exactly nothing against the shipped bytes'"
      - "the confusable calibration was beta-recommended, alpha-approved, epsilon-reviewed, and execution-proven false"
  - learning: "A coverage claim stated at a coarser granularity than the mechanism has is a distinct, recurring defect class. 'The two scripts the fold covers' asserted a script-level closure over a letter-level sample; three instances appeared in one sprint."
    promote_via: "learn:integrate"
    evidence:
      - "S4-1a (script-vs-letter), S4-1b (two escapes vs thirteen prefix shapes), S4-1c (NOT-bound enumeration vs headings) - beta row 316 named them one class"
      - "ED-358, second instance one layer out"
  - learning: "A comment stating an invariant is not an enforcer of it. Bundle G's own comment said two comparison sites 'must share one transform'; the transform was applied to one and the missing fold was implemented beside the other, and nothing detected the divergence."
    promote_via: "learn:integrate"
    evidence: ["S4-2(c) found independently by two lanes; flattenForAssertionScan holds the missing fold one function away"]
  - learning: "A text-matching enforcer cannot distinguish a violation from a description of one. Any prose written ABOUT a banned pattern will trip the ban."
    promote_via: "learn:integrate"
    evidence: ["bundle K refused CUSTODY.md itself by quoting the Asserted adjacency", "bundle L2 turned the tree RED in two files by naming the banned primitive"]
  - learning: "A brief is a claim surface like any other. An unrefusable brief converts the author's error into shipped code, so every 'X is missing' needs an attached proof and every builder needs standing permission to refuse a premise with evidence."
    promote_via: "learn:integrate"
    evidence: ["three refusals, three correct: J's grep, K's unbound proof, L2's halt", "ED-363"]
  - learning: "A read-scope-limited reviewer that reports what it could NOT see, and names the check that would refute its own finding, is worth more than one that is merely right. The refutation cost two commands instead of a fix bundle."
    promote_via: "learn:integrate"
    evidence: ["agy marked both HIGHs execution_proven:false with what_would_confirm_or_refute; ED-362's machinery"]
  - learning: "Lane independence is not ceremony. Two lanes that never saw each other's work found the same decisive mechanism defect, and a third found a different false sentence."
    promote_via: "learn:integrate"
    evidence: ["backend and security_claude_hunter both filed S4-2(c) independently; qa filed a different S4-1 sentence"]
  - learning: "Refusing an exception clause when minting a rule is load-bearing, and its value shows up only at the close. The single failure was one fold implemented beside the shared transform - exactly the defect a 'mechanical failures only' carve-out would have been argued into."
    promote_via: "learn:integrate"
    evidence: ["beta row 309 refused the carve-out deliberately; beta row 316 confirms it was load-bearing"]

