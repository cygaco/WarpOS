sprint_id: S-VLADW1-04
plan_contract_id: PC-20260828-0086
synthesis_mode: llm
summary: >-
  S-VLADW1-04 closed at honest state 2026-08-29, NOT released, at 80%. The qualifying gauntlet closed
  S4-1 FAILS, S4-2(c) FAILS, S4-3 HOLDS, S4-4 HOLDS, S4-5 HOLDS, S4-6 HOLDS, and beta's pre-committed
  TERMINAL was applied verbatim: no release, no fix attempt 2. The work that landed is real and survives
  at vlad wt/S-VLADW1-01-engine @ 6a105f2 (deliberately unmerged) - refuse-not-skip closing all seven
  near-miss authorings, a rendered-form canonical transform, the args.map door re-attacked with twelve
  live-child shapes for zero leaks, AC-8.6 built with RF-7 RED at runtime, createRequire banned with a
  standing EXPECTED-BYPASS witness, suite 339 to 366 with every mutant no-op-guarded, check:ship exit 0,
  and S4-2(d) discharged TWICE independently with controls first. It failed on the same class as its
  predecessor, one layer out: the fix attempt authored NEW false sentences about its own mechanisms, and
  left one dimension of the rendered-form property implemented BESIDE the shared transform rather than
  inside it. Every failing instance was in prose or code that the full approval chain - epsilon reviewed,
  beta recommended, alpha approved - had passed.

