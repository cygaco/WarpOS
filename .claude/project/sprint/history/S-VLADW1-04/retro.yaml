    planned: true
    evidence:
      - "S4-6 HOLDS; qa lane quoted all three required elements verbatim and confirmed CLASS form rather than instance form - the question beta left explicitly open at row 312"
  - outcome: "createRequire banned outside the spawn wrapper with a code-level structural exemption and DELIBERATELY no suppression marker, plus a committed EXPECTED-BYPASS witness re-pointed to a route that is still open and execution-proven."
    planned: false
    evidence:
      - "bundle J; the witness launches a real child echoing a labelled placeholder while the scanner reports clean"
      - "three lanes judged the prose describing it accurate; none filed it as a defect"
  - outcome: "Internal process vocabulary scrubbed from the shipped surface, including a user-visible violation message, with a ship-set-wide sweep."
    planned: false
    evidence:
      - "bundles L1 + L2; conductor's own sweep leaves exactly one S4-n hit, a maintainer comment"

outcomes_missed:
  - outcome: "S4-1 TRUTH - two independent, execution-proven false sentences on the shipped surface, BOTH newly authored by the fix attempt."
    reason: >-
      The confusable-fold calibration asserts a script-level closure over a letter-level sample (the fold
      reaches 36 of 52 Latin letters; Ceiling needs l, n, g and the map has none of them), so in-script
      Cyrillic and Greek homoglyphs of unmapped letters ship GREEN - reached by the very accident vector
      the paragraph names. And "two escapes REMAIN" is false with a third class execution-proven, in a
      paragraph that narrates its own predecessor being false for the same reason.
  - outcome: "S4-2(c) MECHANISM - markdown-emphasis canonicalization is not on the status-token path."
    reason: >-
      Emphasis canonicalization exists twice in the same file but neither instance is on the comparison
      S4-2(c) governs, so '**ASSERTED** - NOT VERIFIED' plants green inside the Proven section. Bundle G's
      own comment says the two sites "must share one transform"; the shared transform was applied and
      emphasis was implemented beside it.
  - outcome: "The sprint's actual goal - a RELEASABLE custody set."
    reason: >-
      Two criteria failed at the qualifying close, so the terminal applied. What exists is a surface the
      successor starts from rather than one a user receives.

plan_quality_actual:
  - dimension: "scope accuracy"
    assessment: >-
      Accurate. Every one of the nine carried residuals plus AC-8.6 was built, and eight of them survived
      the qualifying gauntlet. Nothing in the plan turned out to be the wrong work.
  - dimension: "risk identification"
    assessment: >-
      The plan named "the predecessor's signature defect recurring one layer up" as its first risk and
      prescribed the right mitigation (no control is done until a test fails on its removal AND the control
      is attacked at the layer above). The mitigation was applied to MECHANISMS and not to SENTENCES, and
      the sprint failed on sentences. The risk was seen; its scope was drawn too narrowly.
  - dimension: "approval boundaries"
    assessment: >-
      The contract's operator-authorization boundary was OVERRIDDEN by alpha under a standing mandate that
      predated the boundary. Recorded honestly at the time as an override rather than an authorization,
      which is what made it auditable. Beta fenced it to builder dispatch only, and the fence held.

scope_variant_actual:
  - variant: "Fix attempt 1 grew from four bundles (G/H/I/J) to seven (G/H/I/J/K/L1/L2)."
    driver: >-
      Beta rows 313 and 314 raised five flags on a read of the tree, and bundle J routed a finding it could
      not act on because another bundle owned the file. Each addition was authorized, small, and inside the
      single fix attempt - attempts are counted by GAUNTLET RUNS, not by bundles.
  - variant: "Bundle L was split into a serial pair L1 -> L2."
    driver: "CUSTODY.md must never have two concurrent editors; the split is the same defect class the sprint exists to close, applied to its own process."

surprises:
  - surprise: "The approval chain passed a false sentence three times over."
    detail: >-
      The confusable calibration was recommended by beta, approved by alpha, reviewed by epsilon, and is
      false of the code. Beta graded its own recommendation as correctly false at row 316, declaring the
      conflict first and running the position-swap.
  - surprise: "A text-matching enforcer cannot distinguish a violation from a description of one."
    detail: >-
      Bundle K's draft quoted the Asserted adjacency literally and the lint refused CUSTODY.md itself;
      bundle L2's draft named the banned primitive literally and turned the tree RED in both files. Two
      bundles, opposite directions, same trap, both caught before commit.
  - surprise: "The cross-family lane's false HIGHs cost two commands instead of a fix bundle."
    detail: >-
      agy filed two HIGHs from a false Unicode belief, but marked both execution_proven:false and supplied
      the exact refuting command. The refuting line was INSIDE the window it was given, so this was a
      factual belief rather than a scope gap - the what_would_confirm_or_refute field is what saved it.
  - surprise: "Builders refused conductor premises with evidence three times, and were right every time."
    detail: >-
      J refuted 'zero executable uses' with a grep; K proved the paragraph it was told to bind atomically
      is not bound at all; L2 halted rather than make an uncommittable edit after the brief named the wrong
      cwd. An unrefusable brief converts the conductor's error into shipped code.

friction_points:
  - friction: "brief premises written from belief"
    detail: >-
      Three briefs asserted 'X is missing' or 'X is required' without an attached grep or read. L2's cost a
      whole dispatch cycle, and it was avoidable: L1 had reported the same cwd mismatch in a free-text
      field and the conductor read it without acting on it. ED-363.
  - friction: "enforcement sweep scoped to the instance, not the class"
    detail: >-
      The internal-id sweep was scoped to CUSTODY.md because that is where the instance was found, so a
      shipped internal id in a user-visible message one file over survived it and needed a second bundle.
  - friction: "idle-while-polling"
    detail: >-
      The conductor said 'polling in-turn' and then yielded, repeatedly, after correction. Alpha's watchers
      carried every wait in this run. The fix is mechanical: arm the waiter in the same turn as the fire.
  - friction: "reading a mid-write tree as clean"
    detail: "Caught before reporting. The rule is tree-clean AND no live builder; the second half was skipped."
  - friction: "WarpOS commit race between alpha and epsilon"
    detail: "Main briefly diverged. Resolved by naming every hash in the status that follows the commit."
  - friction: "an unverified claim in the conductor's own commit message"
    detail: >-
      A commit said RETRO-INPUT.md had been trimmed to its 45-line cap; it was 60 lines. Compliance asserted
      without measuring. Corrected at a measured 31 lines, with the miss recorded IN the retro rather than
      quietly fixed - the smallest possible instance of the sprint's own finding.
  - friction: "ED-356 merge-guard denied three builders' commits"
    detail: >-
      Pre-existing broken refs in .claude/ docs blocked builder commits three times. All three refused to
      use --no-verify or an allowlist entry; the conductor verified the staged trees and landed them. One
      builder re-ran the identical denied command and self-flagged it against blocked-is-not-retry.
  - friction: "agy served on a fallback model"
    detail: "gemini-3.1-pro-high, not the pinned model. Well-formed record, pin not honoured; gauntlet-verify PASS must not be read as covering it."

