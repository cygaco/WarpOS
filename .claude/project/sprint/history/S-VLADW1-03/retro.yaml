beta_decisions_reviewed:
  - "row 305 (7c05e9d1) - S1-S5 release rule pre-committed at the design-to-build boundary, before any result existed"
  - "row 306 (4e1b7a92) - the AC-8.6 deferral is not a gate reshape; item 6's residual may travel via a round record or the successor tracker, but not via the spec that named it"
  - "row 307 (b6d38f04) - alpha's application of the rule CONFIRMED, no AP-15 in either direction, with two record corrections neither of which changes an outcome"

key_tradeoffs:
  - "Deferred AC-8.6 rather than building new product surface on the terminal fix attempt, accepting an unmet DoD item to protect bundle disjointness. Beta ruled the deferral sound."
  - "Serialized the three mutating gauntlet lanes instead of isolating them, paying ~25 minutes of wall time to avoid judging a tree that was not byte-faithful to the one under review."
  - "Held the qualifying gauntlet rather than firing it with two known-false source claims, because the qualifying run is terminal and spending it on a known hole is the one thing the rule forbids."
  - "Graded the args.map attack as a defeated CONTROL (S2) rather than a leak (S1), because it needs a hostile caller already holding the plaintext and no shipped call site has that shape."

learning_candidates:
  - learning: "Watching a control fire tells you nothing about what it cannot see. Verifying a mechanism by observing it catch a real case is confirmation, not coverage - the next step is enumerating the inputs it silently skips."
    promote_via: "learn:integrate"
    evidence:
      - "10b's bind was verified by watching it catch 10c's real edit, and its predicate still skipped en-dash, hyphen, colon and indented Ceiling paragraphs"
      - "evidence-backend-reviewer.md F-1: seven authorings, controls first, five green"
  - learning: "A detector that SKIPS a non-matching input is fail-open; one that REFUSES it is fail-closed. Any derivation over authored text must refuse what it cannot classify, never continue past it."
    promote_via: "learn:integrate"
    evidence: ["custody-claim-lint.js:410 continues on non-match with no violation recorded", "ED-358"]
  - learning: "Binding a claim byte-for-byte makes it un-editable, not true. If the bound text is false, the bind now enforces the falsehood and an honest correction turns the gate red."
    promote_via: "learn:integrate"
    evidence: ["evidence-security-claude-hunter.md regressions_from_fix_attempt_2: check:ship requires a proven-false sentence to be present verbatim"]
  - learning: "A dispatch record and the worktree are two independent witnesses; neither alone classifies a death. elapsed_ms plus the tree state separates clamp from timeout-after-commit from never-spawned."
    promote_via: "learn:integrate"
    evidence: ["fix-attempt-2/ROUND-RECORD.md section 1 death-signature table"]
  - learning: "A cross-family reviewer is not redundancy. Three gauntlets, three defects the same-family lanes missed - once on code a same-family lane had read and explicitly failed to break."
    promote_via: "learn:integrate"
    evidence: ["evidence-security-agy.md F-1 vs evidence-backend-reviewer.md F-4"]
  - learning: "Naming a lane's own prior failure mode in its brief changes its behaviour. Three lane-runs were lost to truncated returns across two gauntlets; after each brief named that failure and told the lane to cut scope before emitting, all three returned JSON on the first dispatch."
    promote_via: "learn:integrate"
    evidence: ["gauntlet-3 lane briefs DISPATCH NOTE sections; 3/3 first-dispatch returns"]

