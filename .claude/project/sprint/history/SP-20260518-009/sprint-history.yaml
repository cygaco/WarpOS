final_outcome_notes: "Sprint shipped clean. Canonical repo now has single ROADMAP.md (framework backlog + dual-identity header HTML comment). WARPOS_ROADMAP.md deleted. 4 live-code references cleaned (promote.js, paths/gate.js, path-lint.js, phase0-verify.js). 6 historical references in _docs/phase0/*, framework/releases/0.4.0/changelog.md, _docs/sprint/FINDINGS.md left frozen as documented historical fact. Consumer behavior unchanged (promote.js exclusion + inline scaffold-generator). Push + tag pushed to origin/sprint/SP-20260518-009 + tag sprint/SP-20260518-009/RL-20260519-013."
should_be_remembered:
  - "git rename detection requires the destination filename to not exist in HEAD. When consolidating two files into one of their names, split into two commits to preserve rename history."
  - "documentation_scale=s legitimately skips redteam-plan + full QA gauntlet, but the release gate still requires routing traces for qa+redteam phases unless --allow-routing-gap is passed. The override is the documented path for scale-skipped phases; it logs to decisionLedger."
  - "promote.js FRAMEWORK_PREFIXES is the single source of truth for what's never propagated to consumers. Roadmap files (canonical or otherwise) belong in this list."
