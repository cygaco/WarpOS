key_tradeoffs:
  - "Sibling schema vs extending sprint-history.schema.json — chose sibling; preserves sprint-history as a frozen registry, retro fields evolve independently; cost is one extra schema file."
  - "Synthesis-in-script vs synthesis-in-skill-body — chose skill body owns the LLM call, script accepts --synthesis JSON file; mirrors plan.js --payload, keeps writer pure (no network), makes --no-synth and --retry-synth ergonomic."
  - "Auto-status-transition in retrospective.js vs in release.js — retrospective.js flips closed -> retrospected; release.js does NOT flip releasing -> closed (today). Cleanest place for the second transition is release.js deploy — see action item #1."
learning_candidates:
  - learning: "Multi-step skill workflows where each phase owns a single status transition reduce coupling but create gaps if any phase doesn't ship its transition. When designing a new workflow, enumerate every status transition upfront and assign one owner per edge."
    evidence:
      - "release.js does not flip releasing -> closed; retrospective.js cannot run; manual YAML patch required"
  - learning: "When a writer script accepts an optional synthesis payload, default to a stderr warning (not silent skeleton) if neither --synthesis nor --no-synth is passed. Silence is misread as failure."
    evidence:
      - Initial dog-foot run produced skeleton without operator-visible signal
  - learning: "Worktree-rooted invocations of CWD-resolving tracker scripts silently target the wrong repo. Pair every tracker-mutating script with an `assertInMainRepo()` check, or resolve paths from the script's own location rather than CWD."
    evidence:
      - "Initial ticket.js batch failed with `no ticket: <worktree path>`"
