    due_by: next sprint
    linked_friction: "release.js does not transition releasing -> closed"
  - action: "Document the worktree-vs-main-repo CWD constraint in scripts/sprint/README or in paths.js comments — any worktree-rooted invocation of ticket.js / checkpoint.js will silently miss real tracker files."
    owner: alpha
    due_by: next sprint
