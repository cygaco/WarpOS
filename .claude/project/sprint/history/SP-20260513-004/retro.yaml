  - action: "Add a stderr warning when retrospective.js runs without --synthesis and without --no-synth: `no synthesis payload supplied — emitting skeleton; pass --synthesis <file> or --no-synth to silence this warning`."
    owner: alpha
    due_by: next sprint
    linked_friction: Naive invocation silently yields skeleton
