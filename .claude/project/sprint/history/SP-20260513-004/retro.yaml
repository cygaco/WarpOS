surprises:
  - surprise: "Status transition gate required `closed` (not `releasing`) — release.js does not auto-flip the registry, so retrospective.js refused to run until the active-sprints.yaml was manually patched."
    impact: minor
    evidence:
      - "First retrospective.js invocation exited 3 with `Sprint is in state planning`"
  - surprise: "Sibling schema decision (over extending sprint-history) made the writer simpler — retro fields evolve independently of sprint-history; no migration cost on the frozen registry."
    impact: positive
    evidence:
      - schemas/sprint/sprint-retrospective.schema.json is standalone
  - surprise: "First worktree-rooted batch of ticket.js calls failed because ticket.js resolves the tracker path from CWD; the worktree had no tickets/ directory. cd into the main repo unblocked all 8 promotions in two parallel fan-outs."
    impact: minor
    evidence:
      - "First parallel ticket update batch failed with `no ticket: <worktree path>`"
friction_points:
  - friction: "release.js deploy did not transition the sprint registry from `releasing` -> `closed` automatically, blocking retrospective.js until the YAML was manually patched."
    category: tooling
    evidence:
      - "First retro.js invocation rejected SP-004 in state `planning`"
    severity: medium
  - friction: "Worktree CWD vs main-repo path mismatch — ticket.js resolves the tracker path relative to CWD, so worktree-rooted invocations missed the actual tracker files. Workaround: cd into main repo for all sprint script calls."
    category: tooling
    evidence:
      - "First parallel ticket update batch failed with `no ticket: <worktree path>`"
    severity: low
  - friction: "The writer-script does not perform the LLM synthesis call itself — the slash-command body is responsible for calling the model and producing the --synthesis JSON. Naive script invocation always yields skeleton mode, which is correct behavior but easy to misread as a failure."
    category: other
    evidence:
      - "Initial retrospective.js --force run produced synthesis_mode=skeleton without warning that no synthesis payload was supplied"
    severity: low
action_items:
  - action: "Make release.js deploy auto-flip active-sprints.yaml#sprints[].status to `closed` after a successful deploy (today the only path to closed is manual YAML edit or retrospective.js's transition from closed -> retrospected, which leaves a gap)."
