schema: warpos/sprint/external-service-dependency/v1
id: ESD-20260521-009
sprint: SP-20260521-001
related_ticket: T-20260521-171
service_name: "Cross-platform terminal binaries (wt/iTerm/Terminal.app/gnome-terminal/xterm)"
service_category: other
purpose: "Optional terminal launchers used by /portfolio:open --spawn. wt-first on Windows, OS-specific fallbacks. If none on PATH, /portfolio:open --spawn prints copyable 'cd <path> && claude' instead (graceful degradation per Beta DEC-006 addendum)."
required_for: []
required_phase: execute
status: ready_for_terminal_work
signup_required: false
billing_required: false
credentials_required: false
oauth_required: false
domain_dns_required: false
compliance_review_required: false
human_owner: null
terminal_implementable_after_setup: true
can_mock: true
mock_strategy: ""
sandbox_available: true
production_required: false
approval_required: false
approval_state: not_required
approval_ref: null
required_env_vars: []
human_setup_steps: []
terminal_setup_steps: []
risks: []
blockers: []
binaries_probed_at_invocation:
  windows:
    - name: wt
      probe: where wt
      invoke: "wt -d <path> claude"
      priority: 1
    - name: powershell
      probe: where powershell
      invoke: "start powershell -NoExit -Command 'Set-Location <path>; claude'"
      priority: 2
    - name: cmd
      probe: where cmd
      invoke: "start cmd /k 'cd /d <path> && claude'"
      priority: 3
  macos:
    - name: iTerm
      probe: "osascript -e 'tell application \"iTerm\" to ...'"
      invoke: AppleScript launch
      priority: 1
    - name: Terminal.app
      probe: "osascript -e 'tell application \"Terminal\" to do script ...'"
      invoke: AppleScript launch
      priority: 2
  linux:
    - name: gnome-terminal
      probe: which gnome-terminal
      invoke: "gnome-terminal --working-directory=<path> -- claude"
      priority: 1
    - name: xterm
      probe: which xterm
      invoke: "xterm -e 'cd <path>; claude'"
      priority: 2
fallback_when_none_available: "print copyable string: cd <path> && claude"
notes: "Beta design-review directive 2026-05-21T21:11Z: enumerate all six terminal binaries probed at invocation time, so the implementation team has the exact `where`/`which`/`osascript` calls to make. wt-first on Windows; iTerm preferred over Terminal.app on macOS; gnome-terminal preferred over xterm on Linux."
